 the low forward limiter."},{"t":"step","lvl":2,"n":"b","text":"At approximately mid collective, the cyclic must contact the forward cyclic stop."},{"t":"step","lvl":2,"n":"c","text":"As the collective is moved up from mid to the high stop, the cyclic may move aft indicating operation of the high forward limiter."},{"t":"step","lvl":1,"n":"5","text":"If the stick does not move aft slightly to indicate operation of the high forward limiter, slowly apply full right pedal."},{"t":"step","lvl":2,"n":"a","text":"The cyclic should move aft indicating operation of the high forward limiter."},{"t":"step","lvl":1,"n":"6","text":"With the collective full up and the pedals centered, move the cyclic to the full aft position."},{"t":"step","lvl":1,"n":"7","text":"Maintain slight aft pressure on the cyclic."},{"t":"step","lvl":1,"n":"8","text":"The cyclic may not reach the aft cyclic stop."},{"t":"step","lvl":1,"n":"9","text":"Slowly apply full left pedal."},{"t":"step","lvl":2,"n":"a","text":"Cyclic should move slightly forward, indicating operation of the high aft limiter."},{"t":"step","lvl":1,"n":"10","text":"Center the pedals."},{"t":"step","lvl":1,"n":"11","text":"Slowly lower collective."},{"t":"step","lvl":2,"n":"a","text":"Initially, the cyclic may move slight aft and contact the aft cyclic stop (if it had not reached the aft stick stop at high collective)."},{"t":"step","lvl":2,"n":"b","text":"At approximately collective mid position, the cyclic must start moving forward indicating operation of the low aft limiter."},{"t":"h","id":"1.37.4","text":"CYCLIC LATERAL"},{"t":"step","lvl":1,"n":"1","text":"With the pedals centered and collective full down, move the cyclic full left."},{"t":"step","lvl":2,"n":"a","text":"The cyclic should contact the left cyclic stop."},{"t":"step","lvl":1,"n":"2","text":"Move the cyclic full right."},{"t":"step","lvl":2,"n":"a","text":"The cyclic should contact the right cyclic stop."}]},{"id":"1.38","chapter":"1","title":"PRIMARY SERVOS CHECK","page":29,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Select GND PUMP ON."},{"t":"step","lvl":1,"n":"2","text":"Select BST ON."},{"t":"step","lvl":1,"n":"3","text":"Select SAS 1 and SAS 2 OFF."},{"t":"step","lvl":1,"n":"4","text":"Select YAW/CYCLIC/COLL TRIM OFF."},{"t":"step","lvl":1,"n":"5","text":"Place the SERVO switch to the BOTH position."},{"t":"step","lvl":1,"n":"6","text":"Cyclic and pedals centered."},{"t":"step","lvl":1,"n":"7","text":"Place the servo switch to NO. 1 position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the MR SVO 2 PRES and TR SVO 2 caution lights illuminate."},{"t":"step","lvl":2,"n":"b","text":"Verify that the cyclic stick does not jump when securing the primary servo."},{"t":"step","lvl":1,"n":"8","text":"Slowly move the flight controls through full range."},{"t":"step","lvl":2,"n":"a","text":"Check for unusual binding or restrictions."},{"t":"step","lvl":1,"n":"9","text":"Place the servo switch to NO. 2 position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the MR SVO 1 PRES and TR SVO 1 caution lights illuminate."},{"t":"step","lvl":2,"n":"b","text":"Verify that the cyclic stick does not jump when securing the primary servo."},{"t":"step","lvl":1,"n":"10","text":"Slowly move the flight controls through full range."},{"t":"step","lvl":2,"n":"a","text":"Check for unusual binding or restrictions."},{"t":"step","lvl":1,"n":"11","text":"Place the SERVO switch to the BOTH position."},{"t":"step","lvl":2,"n":"a","text":"Confirm all servo caution lights extinguish."},{"t":"step","lvl":1,"n":"12","text":"Slowly move the flight controls through full range."},{"t":"step","lvl":2,"n":"a","text":"Check for unusual binding or restrictions."}]},{"id":"1.39","chapter":"1","title":"BOOST SERVOS CHECK","page":30,"blocks":[{"t":"note","text":"With boost OFF there is an interaction between the collective and the pedals."},{"t":"step","lvl":1,"n":"1","text":"Select GND PUMP ON."},{"t":"step","lvl":1,"n":"2","text":"Select BST OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that the BOOST PRES caution light illuminates."},{"t":"step","lvl":1,"n":"3","text":"Slowly move flight controls through full range."},{"t":"step","lvl":2,"n":"a","text":"Verify that there is no unusual binding, restriction or excessive dead band."},{"t":"step","lvl":2,"n":"b","text":"Note increased forces."},{"t":"step","lvl":1,"n":"4","text":"Select BST ON."}]},{"id":"1.40","chapter":"1","title":"TRIM CHECKS","page":30,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Select GND PUMP ON."},{"t":"step","lvl":1,"n":"2","text":"Select BST ON."},{"t":"step","lvl":1,"n":"3","text":"Select YAW, CYCLIC and COLL TRIM ON."},{"t":"step","lvl":1,"n":"4","text":"Select ATT, AP 1, AP 2, SAS 1 PRI and SAS 2 PRI ON."},{"t":"h","id":"1.40.1","text":"DISENGAGEMENT CHECK"},{"t":"step","lvl":1,"n":"1","text":"Center controls."},{"t":"step","lvl":1,"n":"2","text":"Select CYCLIC TRIM OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that the cyclic does not move."},{"t":"step","lvl":1,"n":"3","text":"Select CYCLIC TRIM ON."},{"t":"step","lvl":1,"n":"4","text":"Repeat for collective and pedals."},{"t":"h","id":"1.40.2","text":"TRIM RELEASE CHECK"},{"t":"step","lvl":1,"n":"1","text":"Depress cyclic TRIM release switch and move cyclic slowly."},{"t":"step","lvl":2,"n":"a","text":"Verify that the trim disengages."},{"t":"step","lvl":1,"n":"2","text":"Repeat for collective and pedals."},{"t":"h","id":"1.40.3","text":"FORCE GRADIENT CHECK"},{"t":"step","lvl":1,"n":"1","text":"Without pressing cyclic TRIM release, move the cyclic fore/aft and left/right."},{"t":"step","lvl":2,"n":"a","text":"Verify that a force gradient exists, i.e., increasing force with displacement."},{"t":"step","lvl":1,"n":"2","text":"Repeat for collective and pedals."},{"t":"h","id":"1.40.4","text":"BEEPER TRIM CHECK"},{"t":"step","lvl":1,"n":"1","text":"On the pilot’s cyclic, activate the cyclic beeper trim in the fore/aft and lateral directions."},{"t":"step","lvl":2,"n":"a","text":"Verify that the beeper trim operates smoothly."},{"t":"step","lvl":1,"n":"2","text":"Repeat for collective and pedals."},{"t":"h","id":"1.40.5","text":"TRIM RETURN CHECK"},{"t":"step","lvl":1,"n":"1","text":"Center cyclic."},{"t":"step","lvl":1,"n":"2","text":"Without depressing the trim release, displace cyclic full fore/aft and left/right."},{"t":"step","lvl":2,"n":"a","text":"Verify that the cyclic returns smoothly to the center position."},{"t":"step","lvl":1,"n":"3","text":"Without depressing the pedal micro-switches, displace either pedal to full forward and release."},{"t":"step","lvl":2,"n":"a","text":"Verify that the pedals return smoothly to the neutral position."},{"t":"step","lvl":1,"n":"4","text":"Repeat with the other pedal."},{"t":"step","lvl":1,"n":"5","text":"From collective mid position, without pressing the collective trim switch, slowly displace the collective full up and release."},{"t":"step","lvl":2,"n":"a","text":"Verify that the collective returns smoothly to mid-position."},{"t":"step","lvl":1,"n":"6","text":"Repeat for collective full down."},{"t":"h","id":"1.40.6","text":"COPILOT’S CONTROLS"},{"t":"step","lvl":1,"n":"1","text":"Check copilot’s cyclic, collective and pedal TRIM release switch for proper operation."},{"t":"step","lvl":1,"n":"2","text":"Check copilot’s cyclic and collective beeper trim for proper operation."}]},{"id":"1.41","chapter":"1","title":"AFCS PREFLIGHT BIT CHECK","page":32,"blocks":[{"t":"warning","text":"Prior to initiating PFLT BIT, ensure that all personnel are clear of all flight control systems."},{"t":"note","text":"Return all flight controls to their original prestart condition prior to securing the ground check pump. Collective should be about mid position, with cyclic and pedals centered. Failure to do so could result in the transfer of hydraulic fluid from systems 1 and 2 into system 3."},{"t":"step","lvl":1,"n":"1","text":"Center all flight controls using the HUMS flight control position sensors. (HLTH→HUMS→MAINT→PARAMS →ENTR→ANLG→ANLG 2)."},{"t":"step","lvl":1,"n":"2","text":"SAS 1 PRI and SAS 2 PRI – ON."},{"t":"step","lvl":1,"n":"3","text":"AP 1 and AP 2 – ON."},{"t":"step","lvl":1,"n":"4","text":"GND PUMP – ON."},{"t":"step","lvl":2,"n":"a","text":"Assure HYDRAULIC status is OPERATIONAL."},{"t":"step","lvl":1,"n":"5","text":"BST – ON."},{"t":"step","lvl":1,"n":"6","text":"Rotor brake – ON."},{"t":"step","lvl":1,"n":"7","text":"CYCLIC, YAW and COLL TRIM – ON."},{"t":"step","lvl":1,"n":"8","text":"Ensure ATT mode – ON."},{"t":"step","lvl":1,"n":"9","text":"AP 1 and AP 2 AP PWR RESET – Press and hold for two seconds."},{"t":"step","lvl":1,"n":"10","text":"Press hard bezel TEST on either pilot or copilot FD MODE SEL panel."},{"t":"step","lvl":1,"n":"11","text":"Press and hold PFLT BIT soft bezel for at least 0.5 seconds but no more than 2 seconds."},{"t":"step","lvl":2,"n":"a","text":"Follow instructions on the FD MODE SEL panel while PFLT is running."},{"t":"step","lvl":2,"n":"b","text":"Monitor progress on the HLTH page."},{"t":"step","lvl":2,"n":"c","text":"If any fault codes are displayed, record and notify maintenance."},{"t":"step","lvl":2,"n":"d","text":"If no fault codes are displayed – TEST complete."},{"t":"step","lvl":1,"n":"12","text":"Press and hold the AP 1/2 PWR RESET buttons for 2 seconds."},{"t":"step","lvl":1,"n":"13","text":"Trim controls to their center position."},{"t":"step","lvl":1,"n":"14","text":"GND PUMP – OFF."}]},{"id":"1.42","chapter":"1","title":"WINDSHIELD WIPER/WASHER","page":33,"blocks":[{"t":"caution","text":"Do not activate the windshield wipers on a dry windshield."},{"t":"note","text":"Standoff pins shall be inserted prior to this check."},{"t":"step","lvl":1,"n":"1","text":"Place the WDSHLD WASH switch ON."},{"t":"step","lvl":2,"n":"a","text":"Verify that fluid flows from all the holes in the pilot and copilot windshield spray bars."},{"t":"step","lvl":1,"n":"2","text":"Place the WDSHLD WASH switch OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that fluid stops flowing."},{"t":"step","lvl":1,"n":"3","text":"Place the WDSHLD WIPER switch in SLOW."},{"t":"step","lvl":2,"n":"a","text":"Verify that the wipers operate at slow speed."},{"t":"step","lvl":1,"n":"4","text":"Place the WDSHLD WIPER switch in FAST."},{"t":"step","lvl":2,"n":"a","text":"Verify that the wipers operate at fast speed."},{"t":"step","lvl":1,"n":"5","text":"Place the WDSHLD WIPER switch OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that the wipers park parallel to the windshield inboard edge and about 1 inch from the edge."}]},{"id":"1.43","chapter":"1","title":"PITOT HEATER","page":34,"blocks":[{"t":"warning","text":"The pitot tubes can become very hot during the test."},{"t":"note","text":"The TURN OFF PITOT HT caution light will illuminate if the OAT is above 41°F and any pitot heat is selected ON."},{"t":"step","lvl":1,"n":"1","text":"Select the PITOT HT CPLT, PLT and STBY switches ON."},{"t":"step","lvl":1,"n":"2","text":"Pull the three PITOT HT PWR circuit breakers."},{"t":"step","lvl":2,"n":"a","text":"Verify that the PITOT 1 HEAT, PITOT 2 HEAT and PITOT 3 HEAT caution lights illuminate."},{"t":"step","lvl":1,"n":"3","text":"Reset the three circuit breakers."},{"t":"step","lvl":2,"n":"a","text":"Verify that the caution lights extinguish."},{"t":"step","lvl":2,"n":"b","text":"Have crewman verify that pitot tubes are heated."},{"t":"step","lvl":1,"n":"4","text":"Select PITOT HT CPLT, PLT and STBY switches OFF."}]},{"id":"1.44","chapter":"1","title":"ENVIRONMENTAL CONTROL SYSTEM","page":34,"blocks":[{"t":"note","text":"The ECS may be checked with the APU only or both engines running."},{"t":"step","lvl":1,"n":"1","text":"Place the AIR SRCE HEAT/STRT switch in APU."},{"t":"step","lvl":1,"n":"2","text":"Select CABIN VENT."},{"t":"step","lvl":2,"n":"a","text":"Verify that vent air flows from upper registers."},{"t":"step","lvl":1,"n":"3","text":"Select CABIN HEAT and rotate the cabin rheostat full clockwise to H."},{"t":"step","lvl":2,"n":"a","text":"Verify that warm air flows from all lower registers in the cabin."},{"t":"step","lvl":1,"n":"4","text":"Select CABIN HT and VT."},{"t":"step","lvl":2,"n":"a","text":"Verify that warm air flows from all lower registers and vent air flows from upper registers."},{"t":"step","lvl":1,"n":"5","text":"Select CABIN AC and rotate the cabin rheostat full counter clockwise to C."},{"t":"step","lvl":2,"n":"a","text":"Verify that cold air flows from upper registers."},{"t":"step","lvl":1,"n":"6","text":"Select CABIN MAX AC."},{"t":"step","lvl":2,"n":"a","text":"Verify that cold air flows from upper registers."},{"t":"step","lvl":1,"n":"7","text":"Repeat for cockpit."}]},{"id":"2.1","chapter":"2","title":"STARTER SYSTEM","page":36,"blocks":[{"t":"h","id":"2.1.1","text":"START SWITCH"},{"t":"note","text":"The following steps confirm that pressing the START switch after the starter is engaged will disengage the starter."},{"t":"note","text":"If the OAT is hotter than requested by the heater rheostats, no air will flow from the heater registers."},{"t":"step","lvl":1,"n":"1","text":"Place AIR SRCE HEAT/START switch in APU."},{"t":"step","lvl":1,"n":"2","text":"Place the CABIN and COCKPIT heater switches in HEAT."},{"t":"step","lvl":1,"n":"3","text":"Rotate the heater rheostats full clockwise to H."},{"t":"step","lvl":2,"n":"a","text":"Verify that air flows from the heater vents, if hot air is required."},{"t":"step","lvl":1,"n":"4","text":"Select NO. 1 FUEL selector OFF."},{"t":"step","lvl":1,"n":"5","text":"Select ENG IGN OFF."},{"t":"step","lvl":1,"n":"6","text":"Select NO. 1 THROTTLE OFF."},{"t":"step","lvl":1,"n":"7","text":"Press the NO. 1 ENG START button."},{"t":"step","lvl":2,"n":"a","text":"Verify that the STARTER 1 ON advisory light illuminates."},{"t":"step","lvl":2,"n":"b","text":"Verify that no air flows from the heater registers."},{"t":"step","lvl":1,"n":"8","text":"Continue motoring the engine until Ng stabilizes."},{"t":"step","lvl":2,"n":"a","text":"Verify Ng (24% Ng minimum)."},{"t":"step","lvl":1,"n":"9","text":"Press the NO. 1 ENG START button to abort the start."},{"t":"step","lvl":2,"n":"a","text":"Verify that the STARTER 1 ON advisory light extinguishes."},{"t":"step","lvl":2,"n":"b","text":"Verify that #1 engine Ng decreases."},{"t":"step","lvl":2,"n":"c","text":"Verify that air flows from the heater vents, if hot air is required."},{"t":"step","lvl":1,"n":"10","text":"Repeat for the #2 engine."},{"t":"step","lvl":1,"n":"11","text":"Place the HEAT switch OFF."},{"t":"h","id":"2.1.2","text":"THROTTLE DISENGAGEMENT"},{"t":"note","text":"The following steps confirm that moving the THROTTLES from IDLE to OFF will disengage the starter."},{"t":"step","lvl":1,"n":"1","text":"Select NO. 1 FUEL selector OFF."},{"t":"step","lvl":1,"n":"2","text":"Select ENG IGN OFF."},{"t":"step","lvl":1,"n":"3","text":"Place the NO. 1 THROTTLE in IDLE."},{"t":"step","lvl":1,"n":"4","text":"Press the NO. 1 ENG START switch."},{"t":"step","lvl":2,"n":"a","text":"Verify that the STARTER 1 ON advisory light illuminates."},{"t":"step","lvl":2,"n":"b","text":"Verify that #1 engine Ng increases."},{"t":"step","lvl":1,"n":"5","text":"Move NO. 1 THROTTLE from IDLE to OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that the STARTER 1 ON advisory light extinguishes."},{"t":"step","lvl":2,"n":"b","text":"Verify that the #1 engine Ng decreases."},{"t":"step","lvl":1,"n":"6","text":"Repeat for the #2 engine."}]},{"id":"2.2","chapter":"2","title":"ENGINE START","page":37,"blocks":[{"t":"caution","text":"Engine start will be aborted for any of the following reasons: TGT exceeds 1000°C, no indication of oil pressure within 30 seconds, light off does not occur within 20 seconds after initial indication of Ng or throttle advancement to IDLE, or starter drops out prior to 50% Ng."},{"t":"caution","text":"With an engine inlet removed, the helicopter is restricted to flat pitch operations. For dual engine operations with either or both inlets removed, the helicopter is restricted to one engine in IDLE and the other engine in FLY. Defer all engine checks (accel/decel) until the High Speed Shaft (HSS) is balanced and the engine inlets are installed."},{"t":"note","text":"This procedure should be used when a different engine is installed or an engine has been removed and reinstalled."},{"t":"note","text":"To collect HSS data to balance a shaft, the inlet on the engine being balanced must be removed to attach the optical sensor."},{"t":"step","lvl":1,"n":"1","text":"Select HIDE OBE on the EICAS page if displayed. The intent is to hide unnecessary cautions."},{"t":"step","lvl":1,"n":"2","text":"Place ROTOR BRAKE ON."},{"t":"step","lvl":2,"n":"a","text":"Verify at least 450 psi."},{"t":"step","lvl":2,"n":"b","text":"Verify that the ROTOR BRAKE caution light illuminates."},{"t":"step","lvl":1,"n":"3","text":"Place the ENG IGN switch in AUTO."},{"t":"step","lvl":1,"n":"4","text":"Place the fuel selector switch for the #1 engine to DIR."},{"t":"step","lvl":2,"n":"a","text":"Verify that the green EICAS fuel lines changes from OFF to DIR."},{"t":"step","lvl":1,"n":"5","text":"Press the NO. 1 ENG START switch."},{"t":"step","lvl":2,"n":"a","text":"Verify that the STARTER 1 ON advisory light illuminates."},{"t":"step","lvl":2,"n":"b","text":"Confirm TGT below 150°C."},{"t":"step","lvl":1,"n":"6","text":"Advance throttle to IDLE:"},{"t":"step","lvl":2,"n":"a","text":"Verify that the ENG 1 FUEL PRES caution light extinguishes."},{"t":"step","lvl":2,"n":"b","text":"Verify that the engine oil pressure is in the green."},{"t":"step","lvl":2,"n":"c","text":"Verify that the ENG 1 OIL PRES caution light extinguishes."},{"t":"step","lvl":2,"n":"d","text":"Verify that the STARTER 1 ON advisory light extinguishes."},{"t":"step","lvl":2,"n":"e","text":"Verify that Ng stabilizes at IDLE."},{"t":"step","lvl":1,"n":"7","text":"Run the engine 1 minute in DIR."},{"t":"step","lvl":1,"n":"8","text":"Place the fuel selector for the #1 engine to XFD."},{"t":"step","lvl":2,"n":"a","text":"Verify that the green EICAS fuel lines changes from DIR to XFD."},{"t":"step","lvl":1,"n":"9","text":"Run the engine 1 minute in XFD."},{"t":"step","lvl":1,"n":"10","text":"Retard throttle to OFF."},{"t":"step","lvl":1,"n":"11","text":"Repeat for #2 engine."}]},{"id":"2.3","chapter":"2","title":"ENGINE CROSSBLEED START","page":39,"blocks":[{"t":"caution","text":"The pilot must maintain 90% or higher Ng on the operating engine during a crossbleed start. Less than 90% Ng may not provide sufficient air for a successful crossbleed start and may result in a hung or hot start."},{"t":"note","text":"Regardless of AIR SRCE HT/START switch position, if the APU is operating during an attempted crossbleed start, the APU may be providing the air source and not the opposing engine. The APU must be OFF to successfully complete a crossbleed start."},{"t":"note","text":"This procedure should be used when a different engine is installed or an engine has been removed and reinstalled."},{"t":"note","text":"Even if only one engine has been installed, a crossbleed start from both engines should be conducted."},{"t":"step","lvl":1,"n":"1","text":"Start one engine and set throttle to FLY."},{"t":"step","lvl":1,"n":"2","text":"Set Nr at 105%."},{"t":"step","lvl":1,"n":"3","text":"Ensure #1 and #2 GEN ON."},{"t":"step","lvl":1,"n":"4","text":"Place the APU CONTR switch to the OFF position."},{"t":"step","lvl":1,"n":"5","text":"Place the AIR SRCE HEAT/START switch to ENG."},{"t":"step","lvl":1,"n":"6","text":"Throttle – OFF (engine to be started)."},{"t":"step","lvl":1,"n":"7","text":"FUEL SELECTOR – DIR."},{"t":"step","lvl":1,"n":"8","text":"Adjust collective to maintain a minimum of 90% Ng on the operating engine."},{"t":"step","lvl":1,"n":"9","text":"Press the ENG STARTER switch for the engine being started."},{"t":"step","lvl":1,"n":"10","text":"Continue motoring the engine until Ng peaks."},{"t":"step","lvl":2,"n":"a","text":"Verify Ng at least 24%."},{"t":"step","lvl":1,"n":"11","text":"Place the throttle to IDLE when TGT ≤150°C and Ng 24%."},{"t":"step","lvl":1,"n":"12","text":"Monitor normal start."},{"t":"step","lvl":1,"n":"13","text":"Repeat for other engine."}]},{"id":"2.4","chapter":"2","title":"ENGINE CROSSBLEED MOTORING","page":40,"blocks":[{"t":"caution","text":"The pilot must maintain 90% or higher Ng on the operating engine during a crossbleed motoring. Less than 90% Ng may not provide sufficient air for Ng to accelerate to 24%."},{"t":"note","text":"Regardless of AIR SRCE HT/START switch position, if the APU is operating during an attempted crossbleed start, the APU may be providing the air source and not the opposing engine. The APU must be OFF to successfully complete a crossbleed motoring check."},{"t":"note","text":"This procedure should be used when a different engine is installed or an engine has been removed and reinstalled."},{"t":"note","text":"Even if only one engine has been installed, a crossbleed motoring check from both engines should be conducted."},{"t":"step","lvl":1,"n":"1","text":"Start one engine and set throttle to FLY."},{"t":"step","lvl":1,"n":"2","text":"Set Nr at 105%."},{"t":"step","lvl":1,"n":"3","text":"Ensure #1 and #2 GEN ON."},{"t":"step","lvl":1,"n":"4","text":"Place the APU CONTR switch to the OFF position."},{"t":"step","lvl":1,"n":"5","text":"Place the AIR SRCE HEAT/START switch to ENG."},{"t":"step","lvl":1,"n":"6","text":"Throttle – OFF (engine to be motored)."},{"t":"step","lvl":1,"n":"7","text":"FUEL SELECTOR – OFF (engine to be motored)."},{"t":"step","lvl":1,"n":"8","text":"Adjust collective to maintain a minimum of 90% Ng on the operating engine."},{"t":"step","lvl":1,"n":"9","text":"Press the ENG STARTER switch for the engine being motored."},{"t":"step","lvl":1,"n":"10","text":"Continue motoring the engine until Ng peaks."},{"t":"step","lvl":2,"n":"a","text":"Verify that Ng is at least 24%."},{"t":"step","lvl":1,"n":"11","text":"Disengage starter."},{"t":"step","lvl":1,"n":"12","text":"Repeat for other engine."}]},{"id":"2.5","chapter":"2","title":"ROTOR ENGAGEMENT","page":41,"blocks":[{"t":"caution","text":"If engines starts were made with the rotor brake ON, remain at 50% to 54% Nr for a minimum of 1 minute prior to advancing the throttles to FLY."},{"t":"step","lvl":1,"n":"1","text":"Adjust Nr to 50 – 55% with the throttles."},{"t":"step","lvl":2,"n":"a","text":"Verify that MGB OIL PRES caution light extinguishes."},{"t":"step","lvl":2,"n":"b","text":"Verify that the main gear box oil pressure is in the green (minimum 30 psi)."},{"t":"step","lvl":2,"n":"c","text":"Verify that the HYD 1/2/3 PUMP FAIL caution lights extinguish."},{"t":"step","lvl":2,"n":"d","text":"Verify that the hydraulic pressure in all three systems are in the green."},{"t":"step","lvl":2,"n":"e","text":"Verify that all servo pressure caution lights are extinguished."}]},{"id":"2.6","chapter":"2","title":"HYDRAULIC SYSTEM CHECK","page":42,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Place the HYDRAULICS SERVO switch to NO. 1."},{"t":"step","lvl":2,"n":"a","text":"Verify that the MR SVO 2 PRES caution light illuminates."},{"t":"step","lvl":2,"n":"b","text":"Verify that the TR SVO 2 PRES caution light illuminates."},{"t":"step","lvl":1,"n":"2","text":"Place the HYDRAULICS SERVO switch to BOTH."},{"t":"step","lvl":2,"n":"a","text":"Verify caution lights extinguish."},{"t":"step","lvl":1,"n":"3","text":"Place the HYDRAULICS SERVO switch to NO. 2."},{"t":"step","lvl":2,"n":"a","text":"Verify that the MR SVO 1 PRES caution light illuminates."},{"t":"step","lvl":2,"n":"b","text":"Verify that the TR SVO 1 PRES caution light illuminates."},{"t":"step","lvl":1,"n":"4","text":"Place the HYDRAULICS SERVO switch to BOTH."},{"t":"step","lvl":2,"n":"a","text":"Verify caution lights extinguish."}]},{"id":"2.7","chapter":"2","title":"INITIAL RUN-UP CHECKS","page":42,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Advance both throttles to FLY."},{"t":"step","lvl":2,"n":"a","text":"Verify that the droop stops are out by 70% Nr."},{"t":"step","lvl":2,"n":"b","text":"Verify that Nr is set to 105% Nr."},{"t":"step","lvl":2,"n":"c","text":"Verify that the MGB oil pressure is between 55 and 60 psi."},{"t":"step","lvl":2,"n":"d","text":"Verify that the hydraulic and engine instruments on the EICAS page are in the green."},{"t":"step","lvl":2,"n":"e","text":"Verify that the aircraft exhibits no unusual vibration."},{"t":"step","lvl":2,"n":"f","text":"Verify that #1 and #2 torques are matched within 5%."}]},{"id":"2.8","chapter":"2","title":"MGB OIL BYPASS CHECK","page":42,"blocks":[{"t":"note","text":"A rise in MGB oil pressure and temperature may accompany the MGB Oil Bypass Check."},{"t":"note","text":"The auto bypass IBIT will be conducted as Nr passes through 60%."},{"t":"step","lvl":1,"n":"1","text":"At 105% Nr, place the MGB OIL BYP switch from AUTO to BYP."},{"t":"step","lvl":2,"n":"a","text":"Verify that the MGB BYPASS caution light illuminates."},{"t":"step","lvl":1,"n":"2","text":"Place the MGB OIL BYP switch in AUTO."},{"t":"step","lvl":2,"n":"a","text":"Verify that the MGB BYPASS caution light extinguishes."},{"t":"step","lvl":1,"n":"3","text":"Place the MGB OIL BYP switch in MAN COOL."},{"t":"step","lvl":2,"n":"a","text":"Verify that the MGB MAN COOL caution light illuminates."},{"t":"step","lvl":1,"n":"4","text":"Place the MGB OIL BYP switch in AUTO."},{"t":"step","lvl":2,"n":"a","text":"Verify that the MGB MAN COOL caution light extinguishes."}]},{"id":"2.9","chapter":"2","title":"DRIVE SYSTEM LEAK CHECK","page":43,"blocks":[{"t":"note","text":"For any MGB input module maintenance leak check or an engine input/output shaft seal replacement, start and run-up using the appropriate side engine."},{"t":"note","text":"In extremely cold weather, MGB oil temperature above 70°C might not be possible."},{"t":"step","lvl":1,"n":"1","text":"Start engine."},{"t":"step","lvl":1,"n":"2","text":"Advance throttle to FLY."},{"t":"step","lvl":1,"n":"3","text":"Ground run for a minimum of 5 minutes at 105% Nr. If possible, ensure that the MGB oil temperature is in excess of 70°C and the MGB oil pressure is in the normal operating range."},{"t":"step","lvl":1,"n":"4","text":"Shut down helicopter."},{"t":"step","lvl":1,"n":"5","text":"Have maintenance conduct visual leak check."}]},{"id":"2.10","chapter":"2","title":"ENGINE ACCELERATION CHECK","page":44,"blocks":[{"t":"caution","text":"The engine inlets must be installed prior to conducting the Engine Acceleration Check."},{"t":"step","lvl":1,"n":"1","text":"Both THROTTLES – FLY."},{"t":"step","lvl":1,"n":"2","text":"Set Nr/Np – 105%."},{"t":"step","lvl":1,"n":"3","text":"THROTTLE 1 – Retard to IDLE and allow engine parameters to stabilize."},{"t":"step","lvl":1,"n":"4","text":"THROTTLE 1 – Advance rapidly to FLY (in one second) and hold until Ng peaks."},{"t":"step","lvl":1,"n":"5","text":"THROTTLE 1 – Retard rapidly to IDLE (no stalls should occur)."},{"t":"step","lvl":1,"n":"6","text":"THROTTLE 1 – Return to FLY position."},{"t":"step","lvl":1,"n":"7","text":"Repeat for the other engine."}]},{"id":"2.11","chapter":"2","title":"ENGINE BREAK-IN","page":44,"blocks":[{"t":"note","text":"The following procedure should be used after a gas generator rotor and stator assembly has been changed in the field. When done properly, the break-in ensures that the gas generator section will operate reliably and with the highest efficiency. If the break-in procedure is neglected or is not accomplished properly, the gas generator efficiency may deteriorate, resulting in performance loss and an increase in specific fuel consumption."},{"t":"note","text":"This procedure is more easily accomplished at higher aircraft gross weights. Consider using full fuel tanks and approved internal loads."},{"t":"note","text":"High speed shaft balancing must be accomplished before the engine break-in procedure."},{"t":"note","text":"The engine inlets must be installed during the break-in procedure."},{"t":"caution","text":"Do not tether the aircraft to the ground to accomplish this procedure."},{"t":"step","lvl":1,"n":"1","text":"Start non break-in engine."},{"t":"step","lvl":1,"n":"2","text":"With collective full down, advance throttle of non-break-in engine to FLY."},{"t":"step","lvl":1,"n":"3","text":"Confirm Nr = 105%."},{"t":"step","lvl":1,"n":"4","text":"Start break-in engine."},{"t":"step","lvl":1,"n":"5","text":"With collective full down, slowly advance throttle of break-in engine to FLY."},{"t":"step","lvl":1,"n":"6","text":"Slowly retard throttle of non-break-in engine until the Ng of the break-in engine reaches 85% or the throttle is in IDLE."},{"t":"step","lvl":1,"n":"7","text":"Plunge down on the collective OEI switch to select continuous OEI power."},{"t":"step","lvl":1,"n":"8","text":"If required, slowly increase collective until Ng of break-in engine is 85% (±1%)."},{"t":"step","lvl":1,"n":"9","text":"Remain at 85% Ng on break-in engine for 30 seconds."},{"t":"step","lvl":1,"n":"10","text":"Ensure the throttle of the non-break-in engine is in IDLE."},{"t":"step","lvl":1,"n":"11","text":"Slowly increase collective until Ng of break-in engine is 90% (±1%)."},{"t":"step","lvl":1,"n":"12","text":"Remain at 90% Ng for 30 seconds."},{"t":"step","lvl":1,"n":"13","text":"Slowly reduce collective until Ng of break-in engine is 85% (±1%)."},{"t":"step","lvl":1,"n":"14","text":"Remain at 85% for 30 seconds."},{"t":"step","lvl":1,"n":"15","text":"Slowly increase collective until Ng of break-in engine is 90% (±1%)."},{"t":"step","lvl":1,"n":"16","text":"Remain at 90% Ng for 30 seconds."},{"t":"note","text":"Continue to 95% Ng only if this can be accomplished without lifting to a hover."},{"t":"step","lvl":1,"n":"17","text":"Slowly increase collective until Ng of break-in engine is 95% (±1%)."},{"t":"step","lvl":1,"n":"18","text":"Remain at 95% Ng for 30 seconds."},{"t":"step","lvl":1,"n":"19","text":"Slowly reduce collective until Ng of break-in engine is 90% (±1%)."},{"t":"step","lvl":1,"n":"20","text":"Remain at 90% Ng for 30 seconds."},{"t":"step","lvl":1,"n":"21","text":"Slowly increase collective until Ng of break-in engine is 95% (±1%)."},{"t":"step","lvl":1,"n":"22","text":"Remain at 95% for 30 seconds."},{"t":"note","text":"The minimum attained Ng to complete this procedure is 95%. The pilot should attempt to reach Ng’s above 95% to improve future engine performance."},{"t":"step","lvl":1,"n":"23","text":"Slowly increase collective to maximize Ng on the break-in engine without leaving the ground. Do not exceed 100% Ng."},{"t":"step","lvl":1,"n":"24","text":"Maintain maximum Ng for 30 seconds."},{"t":"step","lvl":1,"n":"25","text":"Slowly reduce collective until Ng of break-in engine is 95% (±1%)."},{"t":"step","lvl":1,"n":"26","text":"Maintain 95% Ng for 30 seconds."},{"t":"step","lvl":1,"n":"27","text":"Slowly increase collective to maximize Ng on the break-in engine without leaving the ground. Do not exceed 100% Ng."},{"t":"step","lvl":1,"n":"28","text":"Maintain maximum Ng for 30 seconds."},{"t":"step","lvl":1,"n":"29","text":"Slowly decrease collective to full down."},{"t":"step","lvl":1,"n":"30","text":"Procedure complete."}]},{"id":"2.12","chapter":"2","title":"ELECTRICAL SYSTEM","page":46,"blocks":[{"t":"h","id":"2.12.1","text":"AC GENERATOR UNDERFREQUENCY"},{"t":"caution","text":"If generators do not drop out by 90% Nr, return the throttles to FLY. Nr speeds lower than 90% may cause damage to avionics."},{"t":"step","lvl":1,"n":"1","text":"#1 and #2 GEN – ON."},{"t":"step","lvl":1,"n":"2","text":"APU – ON."},{"t":"step","lvl":1,"n":"3","text":"APU GEN switch – ON."},{"t":"step","lvl":1,"n":"4","text":"AVC – OFF."},{"t":"step","lvl":1,"n":"5","text":"On EICAS display, select PRESS SHOW OBE bezel. (EICAS will then show HIDE OBE)."},{"t":"step","lvl":1,"n":"6","text":"Place the weather radar in SBY or OFF."},{"t":"step","lvl":1,"n":"7","text":"Place the transponder in standby."},{"t":"step","lvl":1,"n":"8","text":"Pull WOW #1 circuit breaker (BATT HOLD UP Bus)."},{"t":"step","lvl":1,"n":"9","text":"Throttles – Retard slowly simultaneously to 90% Nr."},{"t":"step","lvl":2,"n":"a","text":"Verify that the AC 2 GEN FAIL cautions light illuminates between 96% and 92% Nr."},{"t":"step","lvl":2,"n":"b","text":"Verify that the AC 1 GEN FAIL caution light does not illuminate."},{"t":"step","lvl":2,"n":"c","text":"Verify that both LOW ROTOR warning lights illuminate."},{"t":"step","lvl":2,"n":"d","text":"Verify that the ″LOW ROTOR″ aural alert activates."},{"t":"step","lvl":1,"n":"10","text":"Throttles – Return to FLY."},{"t":"step","lvl":1,"n":"11","text":"Push in WOW #1 circuit breaker"},{"t":"step","lvl":1,"n":"12","text":"Pull WOW #2 circuit breaker (BATT Bus)."},{"t":"step","lvl":1,"n":"13","text":"Throttles – Retard slowly simultaneously to 90% Nr."},{"t":"step","lvl":2,"n":"a","text":"Verify that the AC 1 GEN FAIL cautions light illuminates between 96% and 92% Nr."},{"t":"step","lvl":2,"n":"b","text":"Verify that the AC 2 GEN FAIL caution light does not illuminate."},{"t":"step","lvl":2,"n":"c","text":"Verify that both LOW ROTOR warning lights illuminate."},{"t":"step","lvl":2,"n":"d","text":"Verify that the ″LOW ROTOR″ aural alert activates."},{"t":"step","lvl":1,"n":"14","text":"Throttles – Return to FLY."},{"t":"step","lvl":1,"n":"15","text":"Push in WOW #2 circuit breaker."},{"t":"step","lvl":1,"n":"16","text":"Transponder as required."},{"t":"step","lvl":1,"n":"17","text":"Weather radar as required."},{"t":"h","id":"2.12.2","text":"AC PRIMARY BUS TIE CONNECTOR"},{"t":"step","lvl":1,"n":"1","text":"Select AC GEN NO. 1 – OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that the AC GEN 1 FAIL caution light illuminates."},{"t":"step","lvl":2,"n":"b","text":"Verify that the DC CONV 1 FAIL caution light remains extinguished."},{"t":"step","lvl":1,"n":"2","text":"Select AC GEN NO. 1 – ON."},{"t":"step","lvl":1,"n":"3","text":"Repeat for #2 AC GENERATOR."},{"t":"h","id":"2.12.3","text":"DC BUS TIE CONNECTOR"},{"t":"step","lvl":1,"n":"1","text":"Select DC CONV NO. 1 – OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that the CONV 1 FAIL caution light illuminates."},{"t":"step","lvl":2,"n":"b","text":"Verify all MFDs function normally."},{"t":"step","lvl":1,"n":"2","text":"Select DC CONV NO. 1 – ON."},{"t":"step","lvl":1,"n":"3","text":"Repeat for #2 converter."},{"t":"h","id":"2.12.4","text":"BACKUP CONVERTER CHECK"},{"t":"caution","text":"Failure of the backup converter with the #1 and #2 converters OFF will result in loss of collective and cyclic trim. The pilot should guard the controls during the test."},{"t":"note","text":"The BMS will not be operative with the backup converter supplying DC power. The BMS may need to be reset after this check."},{"t":"note","text":"With the #1 and #2 converters OFF, the backup converter powers the DC essential and battery buses. In this condition, the battery powers the battery holdup and battery utility buses."},{"t":"note","text":"If an engine is not running, TGT and engine oil pressure for that engine will not be displayed with the backup converter supplying DC power. In addition the following caution lights for that engine will illuminate: ENG CHIP, FADEC B FAIL, FADEC TLD FAULT, ENG OIL PRES, and BATT CHARGE FAIL."},{"t":"step","lvl":1,"n":"1","text":"Select DC CONV BACKUP – NORM."},{"t":"step","lvl":1,"n":"2","text":"Select DC CONV NO. 1 and 2 – OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that only the pilot inboard and outboard MFDs remain ON."},{"t":"step","lvl":2,"n":"b","text":"Verify that the pilot’s AHRS (attitude and heading) remains ON."},{"t":"step","lvl":2,"n":"c","text":"Verify that the pilot’s DCU (pilot’s engine instruments) remain ON."},{"t":"step","lvl":2,"n":"d","text":"Verify that only the copilot RTU remains ON."},{"t":"step","lvl":1,"n":"3","text":"Select DC CONV NO. 1 and 2 – ON."}]},{"id":"2.13","chapter":"2","title":"WINDSHIELD ANTI-ICE","page":49,"blocks":[{"t":"caution","text":"Do not conduct the windshield anti-ice check if OAT is above 26°C."},{"t":"note","text":"Windshield will not heat if temperature is above 26°C."},{"t":"step","lvl":1,"n":"1","text":"Place the APU GEN switch to the ON position."},{"t":"step","lvl":1,"n":"2","text":"Place the AC GEN 1 and 2 switches to the OFF position."},{"t":"step","lvl":1,"n":"3","text":"Place the ANTI-ICE WDSHLD PLT and CPLT switches to the ON position."},{"t":"step","lvl":2,"n":"a","text":"Verify that neither the pilot nor the copilot windshield heats."},{"t":"step","lvl":1,"n":"4","text":"Place the ANTI-ICE WDSHLD PLT switch to the OVRD position."},{"t":"step","lvl":2,"n":"a","text":"Verify that only the pilot’s windshield heats."},{"t":"step","lvl":1,"n":"5","text":"Place the ANTI-ICE WDSHLD PLT switch to the OFF position."},{"t":"step","lvl":1,"n":"6","text":"Place the AC GEN 1 and 2 switches to the ON position."},{"t":"step","lvl":1,"n":"7","text":"Place the ANTI-ICE WDSHLD PLT and CPLT switches to the ON position."},{"t":"step","lvl":2,"n":"a","text":"Verify that both pilot and copilot windshields heat."},{"t":"step","lvl":1,"n":"8","text":"Place the ANTI-ICE WDSHLD PLT and CPLT switches to the OFF position."}]},{"id":"2.14","chapter":"2","title":"AFCS GROUND RUN CHECK","page":50,"blocks":[{"t":"note","text":"A jump in the flight controls or tip path plane could indicate an accelerometer or rate gyro bias. If a jump is noted an ACCEL NULL may be performed through the AFCS MODE SEL panel and TEST."},{"t":"step","lvl":1,"n":"1","text":"At 105% Nr, select YAW, CYCLIC, and COLL TRIM ON."},{"t":"step","lvl":1,"n":"2","text":"Select ATT, AP 1, AP 2, SAS 2 PRI and SAS 1 PRI ON."},{"t":"step","lvl":1,"n":"3","text":"Without engaging any trim releases (pedals, cyclic or collective), select AP 1 OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that the flight controls do not jump."},{"t":"step","lvl":2,"n":"b","text":"Verify that the rotor tip path plane does not move appreciably."},{"t":"step","lvl":2,"n":"c","text":"Verify that the AFCS stays in ATT Mode."},{"t":"step","lvl":1,"n":"4","text":"Select AP 1 ON."},{"t":"step","lvl":1,"n":"5","text":"Select SAS 1 OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that the flight controls do not jump."},{"t":"step","lvl":2,"n":"b","text":"Verify that the rotor tip path plane does not move appreciably."},{"t":"step","lvl":2,"n":"c","text":"Verify that the AFCS stays in ATT Mode."},{"t":"step","lvl":1,"n":"6","text":"Select SAS 1 ON."},{"t":"step","lvl":1,"n":"7","text":"Repeat for AP 2 and SAS 2."}]},{"id":"2.15","chapter":"2","title":"AUTOMATIC VIBRATION CONTROL","page":51,"blocks":[{"t":"note","text":"The AVC IBIT buzzes each individual force generator."},{"t":"step","lvl":1,"n":"1","text":"Set Nr at 105% Nr and collective at flat pitch."},{"t":"step","lvl":1,"n":"2","text":"Place the VIB CTRL switch in the ON position."},{"t":"step","lvl":1,"n":"3","text":"Select HLTH→AVC."},{"t":"step","lvl":2,"n":"a","text":"Verify that the AVC status is OPERATIONAL."},{"t":"step","lvl":1,"n":"4","text":"Select IBIT."},{"t":"step","lvl":2,"n":"a","text":"Verify that the AVC status changes to TEST IN PROGRESS."},{"t":"step","lvl":2,"n":"b","text":"Note the buzzing of each force generator."},{"t":"step","lvl":2,"n":"c","text":"Verify that the AVC status changes to TEST PASSED."},{"t":"step","lvl":2,"n":"d","text":"Verify that the AVC status changes to OPERATIONAL."}]},{"id":"2.16","chapter":"2","title":"GROUND MAIN ROTOR TRACK AND BALANCE","page":51,"blocks":[{"t":"note","text":"Actual track and balance limits are in Chapter 18 in the Maintenance Manual. Limits in this FCP might not be the most current limits and should be used for pilot reference only."},{"t":"note","text":"The HUMS will continue to average data unless power is removed from the HUMS for 5 minutes. Therefore, between data runs a CREW CHANGE must be initiated, power must be removed from the HUMS for 5 minutes and the data card must be removed and reinstalled. Power can be removed from the HUMS by either pulling the HUMS circuit breaker or shutting down all power on the helicopter."},{"t":"note","text":"Main rotor ground track must be within limits before commencing ground balance."},{"t":"note","text":"Tracking space limit only applies to initial blade tracking during ground runs. There is no blade track limit once inflight tuning commences."},{"t":"h","id":"2.16.1","text":"GROUND TRACK"},{"t":"step","lvl":1,"n":"1","text":"Select HLTH→HUMS→TRACK BAL→MAIN RTR."},{"t":"step","lvl":1,"n":"2","text":"Set 105% Nr at flat pitch."},{"t":"step","lvl":1,"n":"3","text":"Select the GRND RGMES."},{"t":"step","lvl":1,"n":"4","text":"Select FLAT TRACK."},{"t":"step","lvl":2,"n":"a","text":"When data is displayed, verify that the track spacing is within 20mm."},{"t":"step","lvl":1,"n":"5","text":"If within limits, continue with ground balancing."},{"t":"step","lvl":1,"n":"6","text":"If out of limits, select VIEW TRACK."},{"t":"step","lvl":1,"n":"7","text":"Select FLTTRK SOLN."},{"t":"step","lvl":1,"n":"8","text":"Note solution and predictions."},{"t":"h","id":"2.16.2","text":"GROUND BALANCE"},{"t":"step","lvl":1,"n":"1","text":"Select HLTH→HUMS→TRACK BAL→MAIN RTR."},{"t":"step","lvl":1,"n":"2","text":"Select AVC ON."},{"t":"step","lvl":1,"n":"3","text":"Set 105% Nr."},{"t":"step","lvl":1,"n":"4","text":"Set flat pitch."},{"t":"step","lvl":1,"n":"5","text":"Select the GRND RGMES soft bezel key."},{"t":"step","lvl":1,"n":"6","text":"Select GROUND."},{"t":"step","lvl":2,"n":"a","text":"When data is displayed, verify that the helicopter is within limits."},{"t":"step","lvl":1,"n":"7","text":"Select GRD WT SOLN."},{"t":"step","lvl":1,"n":"8","text":"Note solution and predictions."},{"t":"p","text":"Acceptable Main Rotor Ground 1P Vibration Limits:","lvl":2},{"t":"table","rows":[["","VERT","ROLL","FLR LAT","TRK SPC"],["Ground","None",".2 IPS",".25 IPS","20mm"]]},{"t":"step","lvl":1,"n":"9","text":"For subsequent data runs, perform a crew change, remove the HDC, and remove power from the HUMS for 5 minutes."}]},{"id":"2.17","chapter":"2","title":"TAIL ROTOR BALANCE","page":53,"blocks":[{"t":"note","text":"The HUMS will continue to average data unless power is removed from the HUMS for 5 minutes. Therefore, between data runs a CREW CHANGE must be initiated, power must be removed from the HUMS for 5 minutes and the data card must be removed and reinstalled. Power can be removed from the HUMS by either pulling the HUMS circuit breaker or shutting down all power on the helicopter."},{"t":"note","text":"The tail rotor is balanced to 0.2 IPS."},{"t":"note","text":"The tail rotor operational limit is 0.8 IPS."},{"t":"step","lvl":1,"n":"1","text":"Select HLTH→HUMS→TRACK BAL→TAIL RTR."},{"t":"step","lvl":1,"n":"2","text":"Select ACQ DATA."},{"t":"step","lvl":2,"n":"a","text":"When data is displayed, verify that the helicopter is within limits."},{"t":"step","lvl":1,"n":"3","text":"Select BAL SOLN."},{"t":"step","lvl":1,"n":"4","text":"Note solution and predictions."},{"t":"p","text":"Acceptable Tail Rotor Ground 1P Vibration Limits:","lvl":2},{"t":"table","rows":[["T/R Balance","0.2 IPS"]]}]},{"id":"2.18","chapter":"2","title":"ENGINE HIGH SPEED SHAFT BALANCE","page":54,"blocks":[{"t":"note","text":"Actual track and balance limits are in Chapter 18 in the Maintenance Manual. Limits in this FCP might not be the most current limits and should be used for pilot reference only."},{"t":"note","text":"Engine not being checked must be OFF for engine drive shaft check."},{"t":"note","text":"Engine being checked must drive the drive train exclusively for 5 minutes before data is taken."},{"t":"note","text":"The high speed shaft is balanced to 0.5 IPS."},{"t":"note","text":"The high speed shaft operational limit is 1.5 IPS."},{"t":"note","text":"If vibration level is above 4.0 IPS, the shaft must be indexed prior to another balance."},{"t":"note","text":"The HUMS will continue to average data unless power is removed from the HUMS for 5 minutes. Therefore, between data runs a CREW CHANGE must be initiated, power must be removed from the HUMS for 5 minutes and the data card must be removed and reinstalled. Power can be removed from the HUMS by either pulling the HUMS circuit breaker or shutting down all power on the helicopter."},{"t":"step","lvl":1,"n":"1","text":"With one engine running at 105% Nr and flat pitch."},{"t":"step","lvl":1,"n":"2","text":"Select HLTH→HUMS→ENG TRANS DIAG."},{"t":"step","lvl":1,"n":"3","text":"Select SHAFT BAL."},{"t":"h","id":"2.18.1","text":"NEW BALANCE"},{"t":"step","lvl":1,"n":"1","text":"Select ENG 1 or 2 NEW BALANCE."},{"t":"step","lvl":1,"n":"2","text":"Select CLEAR ALL WEIGHTS."},{"t":"step","lvl":2,"n":"a","text":"Verify all fields are NO. (XX are not NO)."},{"t":"step","lvl":1,"n":"3","text":"Select CONT."},{"t":"step","lvl":1,"n":"4","text":"After 30 seconds, select ACQ DATA."},{"t":"step","lvl":2,"n":"a","text":"When the data is displayed, if the vibration data is above 4.0 IPS, shut down engine and have maintenance crew index (rotate) the output shaft to the lowest achievable TIA in accordance with Chapter 18 of the AMM."},{"t":"step","lvl":2,"n":"b","text":"If the vibration data is below 4.0 IPS, continue the run-up."},{"t":"step","lvl":1,"n":"5","text":"After 5 minutes, select ACQ DATA."},{"t":"step","lvl":2,"n":"a","text":"When data is displayed, verify that the helicopter is within limits."},{"t":"step","lvl":1,"n":"6","text":"If not within limits, input number of adjustments and select ENTER."},{"t":"step","lvl":1,"n":"7","text":"Select CALC SOLN."},{"t":"step","lvl":1,"n":"8","text":"After solution calculations are completed, note predicted amplitude and phase."},{"t":"step","lvl":1,"n":"9","text":"Select VIEW SOLN."},{"t":"step","lvl":1,"n":"10","text":"Record solution."},{"t":"h","id":"2.18.2","text":"RESUME BALANCE"},{"t":"step","lvl":1,"n":"1","text":"Select ENG 1 or 2 RESUME BALANCE."},{"t":"step","lvl":2,"n":"a","text":"Verify that the weights in all the fields correspond to the actual weights on the shaft. If not, use instructions on screen to correct."},{"t":"step","lvl":1,"n":"2","text":"Select CONT."},{"t":"step","lvl":1,"n":"3","text":"After 5 minutes, select ACQ DATA."},{"t":"step","lvl":2,"n":"a","text":"When data is displayed, verify that the helicopter is within limits."},{"t":"step","lvl":1,"n":"4","text":"If not within limits, input number of adjustments and select ENTER."},{"t":"step","lvl":1,"n":"5","text":"Select CALC SOLN."},{"t":"step","lvl":1,"n":"6","text":"After solution calculations are completed, note predicted amplitude and phase."},{"t":"step","lvl":1,"n":"7","text":"Select VIEW SOLN."},{"t":"step","lvl":1,"n":"8","text":"Record solution."},{"t":"p","text":"Acceptable High Speed Shaft Balance Vibration Limit","lvl":2},{"t":"table","rows":[["Engine Drive Shafts","0.5 IPS"]]}]},{"id":"2.19","chapter":"2","title":"ENGINE HIGH SPEED SHAFT DIAGNOSTIC","page":56,"blocks":[{"t":"note","text":"This procedure can be used to verify high speed shaft operational limits without removing the engine inlets."},{"t":"note","text":"Engine not being checked must be at ground IDLE or OFF for Engine Drive Shaft check."},{"t":"note","text":"Engine being checked must drive the drive train exclusively for 5 minutes before data is taken (other engine at 0% Q)."},{"t":"note","text":"No balance solution is provided."},{"t":"note","text":"The high speed shaft operational limit is 1.5 IPS."},{"t":"step","lvl":1,"n":"1","text":"Set the #2 engine at ground IDLE or OFF."},{"t":"step","lvl":1,"n":"2","text":"With #1 engine running at 105% Nr and flat pitch, wait 5 minutes."},{"t":"step","lvl":1,"n":"3","text":"Select HLTH→HUMS→ENG TRANS DIAG→LEFT MOD MD."},{"t":"step","lvl":1,"n":"4","text":"Select FORCE."},{"t":"step","lvl":1,"n":"5","text":"After computations are complete and displayed, verify that the #1 Engine high speed shaft is within limits."},{"t":"step","lvl":1,"n":"6","text":"Repeat for #2 Engine using the RIGHT MOD MD."}]},{"id":"2.20","chapter":"2","title":"ENGINE ANTI-ICE","page":57,"blocks":[{"t":"note","text":"The TRN INLT A-1 ON caution light will illuminate when the OAT is less than 41°F and either of the engine anti-ice switches are in the OFF position."},{"t":"step","lvl":1,"n":"1","text":"Select ANTI-ICE - ENGINE 1 switch – ON."},{"t":"step","lvl":2,"n":"a","text":"Verify that the INLT 1 A-ICE advisory light illuminates."},{"t":"step","lvl":2,"n":"b","text":"Verify that the INLT 1 A-ICE FAIL caution light is extinguished."},{"t":"step","lvl":2,"n":"c","text":"Verify that the ENG 1 A-ICE DGRD caution light is extinguished."},{"t":"step","lvl":1,"n":"2","text":"Select ANTI-ICE - ENGINE 1 switch – OFF."},{"t":"step","lvl":1,"n":"3","text":"Repeat for #2 engine."}]},{"id":"2.21","chapter":"2","title":"FUEL SELECTOR AND SHUTOFF VALVE","page":57,"blocks":[{"t":"caution","text":"Engine shutdowns shall be performed from the IDLE position."},{"t":"note","text":"Each engine will be shut down twice; once with the main fuel valve switch and another with FIRE/ARM pushbutton. These switches both activate the main fuel selector/shutoff valve at the engine fire wall."},{"t":"note","text":"From IDLE, allow approximately 20 seconds for the engine to shut down."},{"t":"note","text":"The APU shuts down almost immediately upon depressing the FIRE/ARM pushbutton."},{"t":"note","text":"The FADEC may generate an ENG OVSP TEST caution light when an engine is shut down using the fuel selector or fuel shutoff valve. The FADEC will reset the caution light after two successive engine starts."},{"t":"h","id":"2.21.1","text":"MAIN FUEL SHUTOFF"},{"t":"step","lvl":1,"n":"1","text":"Place the NO. 1 ENG throttle – IDLE."},{"t":"step","lvl":1,"n":"2","text":"Select NO. 1 FUEL – OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that the #1 engine green fuel indication line on the EICAS disappears."},{"t":"step","lvl":2,"n":"b","text":"Verify that the #1 engine shuts down from fuel starvation."},{"t":"step","lvl":1,"n":"3","text":"Select NO. 1 ENG throttle – OFF."},{"t":"step","lvl":1,"n":"4","text":"Repeat for NO. 2 engine."},{"t":"h","id":"2.21.2","text":"FIRE/ARM SWITCHES"},{"t":"step","lvl":1,"n":"1","text":"Place the NO. 1 ENG throttle – IDLE."},{"t":"step","lvl":1,"n":"2","text":"Press the NO. 1 ENG FIRE/ARM button."},{"t":"step","lvl":2,"n":"a","text":"Verify that the ARM light illuminates."},{"t":"step","lvl":2,"n":"b","text":"Verify that the #1 engine shuts down from fuel starvation."},{"t":"step","lvl":1,"n":"3","text":"Place NO.1 ENG Throttle – STOP."},{"t":"step","lvl":1,"n":"4","text":"Deselect the NO. 1 ENG FIRE/ARM button."},{"t":"step","lvl":2,"n":"a","text":"Verify that the ARM light extinguishes."},{"t":"step","lvl":1,"n":"5","text":"Repeat for NO. 2 Engine."},{"t":"step","lvl":1,"n":"6","text":"Select APU GEN – OFF."},{"t":"step","lvl":1,"n":"7","text":"Press APU FIRE pushbutton."},{"t":"step","lvl":2,"n":"a","text":"Verify that the ARM light illuminates."},{"t":"step","lvl":2,"n":"b","text":"Verify that the APU shuts down from fuel starvation immediately."},{"t":"step","lvl":1,"n":"8","text":"Select APU CONT switch – OFF."},{"t":"step","lvl":1,"n":"9","text":"Deselect APU FIRE pushbutton."},{"t":"step","lvl":2,"n":"a","text":"Verify that the ARM light extinguishes."}]},{"id":"2.22","chapter":"2","title":"DOOR","page":59,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Have crew close the cabin door."},{"t":"step","lvl":2,"n":"a","text":"Verify that the DOOR OPEN advisory light extinguishes."},{"t":"step","lvl":1,"n":"2","text":"Have the crew open the cabin door."},{"t":"step","lvl":2,"n":"a","text":"Verify that the DOOR OPEN advisory light illuminates."},{"t":"step","lvl":1,"n":"3","text":"With the cabin door closed, have the crew open the external power door."},{"t":"step","lvl":2,"n":"a","text":"Verify that the DOOR OPEN advisory light illuminates."},{"t":"step","lvl":1,"n":"4","text":"Have the crew close the external power door."},{"t":"step","lvl":2,"n":"a","text":"Verify that the DOOR OPEN advisory light extinguishes."}]},{"id":"2.23","chapter":"2","title":"RAMP","page":59,"blocks":[{"t":"caution","text":"Ensure ramp area is clear before actuating ramp."},{"t":"step","lvl":1,"n":"1","text":"Have the crew open the upper ramp door with the lower ramp door closed."},{"t":"step","lvl":2,"n":"a","text":"Verify that the RAMP OPEN advisory light illuminates."},{"t":"step","lvl":1,"n":"2","text":"Have the crew close the upper ramp door."},{"t":"step","lvl":2,"n":"a","text":"Verify that the RAMP OPEN advisory light extinguishes."},{"t":"step","lvl":1,"n":"3","text":"Have the crew open and close the lower ramp door with the upper door closed using the cabin ramp control switches."},{"t":"step","lvl":2,"n":"a","text":"Verify that the RAMP OPEN advisory light illuminated when the ramp is open."},{"t":"step","lvl":2,"n":"b","text":"Verify that the RAMP OPEN advisory light extinguishes when the ramp is closed."},{"t":"step","lvl":1,"n":"4","text":"Open and close the lower ramp door using the cockpit control switches."},{"t":"step","lvl":2,"n":"a","text":"Verify that the RAMP OPEN advisory light illuminated when the ramp is open."},{"t":"step","lvl":2,"n":"b","text":"Verify that the RAMP OPEN advisory light extinguishes when the ramp is closed."}]},{"id":"2.24","chapter":"2","title":"ROTOR BRAKE BREAK-IN","page":60,"blocks":[{"t":"note","text":"The purpose of the rotor brake break-in procedure is to ensure proper mating of components. It is required when components (rotor brake disc, pucks or housing) are changed or serviced."},{"t":"step","lvl":1,"n":"1","text":"Shut down both engines."},{"t":"step","lvl":1,"n":"2","text":"As Nr decreases to below 40%, apply the rotor brake using a pressure of 150 – 180 psi."},{"t":"step","lvl":1,"n":"3","text":"After a 15-minute cool-down period, repeat this procedure two additional times to complete the break-in cycle."},{"t":"step","lvl":1,"n":"4","text":"After break-in cycle is completed:"},{"t":"step","lvl":2,"n":"a","text":"Verify that the rotor brake will hold with both engines at IDLE."}]},{"id":"2.25","chapter":"2","title":"MAINTENANCE DATA COMPUTER","page":60,"blocks":[{"t":"note","text":"The status of a system that is not OPERATIONAL can be NOT CONFIGURED, OFF, INOPERATIVE, MAINTENANCE, NO COMMUNICATION, or WEAK SIGNAL. Only one FUEL PUMP is operative at any one time."},{"t":"step","lvl":1,"n":"1","text":"Verify that the following systems are OPERATIONAL by selecting HLTH on any MFD:"},{"t":"p","text":"HYDRAULICS","lvl":2},{"t":"p","text":"RIPS (if installed)","lvl":2},{"t":"p","text":"AFCS","lvl":2},{"t":"p","text":"AFCS 1","lvl":2},{"t":"p","text":"AFCS 2","lvl":2},{"t":"p","text":"AVC","lvl":2},{"t":"p","text":"AVIONICS","lvl":2},{"t":"p","text":"ELECTRICAL","lvl":2},{"t":"p","text":"DRIVE TRAIN","lvl":2},{"t":"p","text":"PROPULSION","lvl":2},{"t":"p","text":"AIRFRAME","lvl":2},{"t":"p","text":"FUEL","lvl":2},{"t":"p","text":"PUMP 1","lvl":2},{"t":"p","text":"PUMP 2","lvl":2},{"t":"p","text":"HUMS","lvl":2},{"t":"step","lvl":1,"n":"2","text":"If a system cannot be made OPERATIONAL, select SUB STAT and note the status and the fault code of the inoperative subsystem."}]},{"id":"2.26","chapter":"2","title":"GROUND ENGINE POWER ASSURANCE CHECK","page":61,"blocks":[{"t":"note","text":"The EPAC history data is stored in the DCU. Each DCU stores historical EPAC data for both engines."},{"t":"note","text":"After replacing an engine, use the administration functions on the EPAC page to clear data from the previous engine. After replacing a DCU, use the administration functions to cross fill data from the other DCU."},{"t":"note","text":"The EPAC administrative functions are only available on APU or external power prior to starting the engines."},{"t":"note","text":"The XFILL function on the EPAC display should be used when a DCU is replaced. If DCU 2 is replaced, on the ground activate XFILL 1 TO 2. If the DCUs are swapped for troubleshooting, no XFILL action is required. If a FADEC is replaced or the FADECs are swapped, no XFILL action is required."},{"t":"note","text":"If an engine is replaced, the CLEAR ENG and CONFIRM CLEAR functions should be used."},{"t":"note","text":"Do not replace both DCUs at the same time, EPAC data will be lost. Replace one at a time and XFILL."},{"t":"note","text":"A light helicopter and/or a maladjusted WOW switch might initiate an In Flight EPAC instead of a Ground EPAC."},{"t":"note","text":"The minimum TGT margin for a new engine is 30°C."},{"t":"note","text":"The TGT margin for a removed and reinstalled engine should be the same margin as before the engine was removed."},{"t":"step","lvl":1,"n":"1","text":"Position the helicopter into the wind."},{"t":"step","lvl":1,"n":"2","text":"Select CABIN and COCKPIT HEATER – OFF."},{"t":"step","lvl":1,"n":"3","text":"Select UTIL hard bezel on an MFD."},{"t":"step","lvl":1,"n":"4","text":"Select EPAC soft bezel."},{"t":"step","lvl":1,"n":"5","text":"Set the NO. 2 Throttle to IDLE (0% Torque)."},{"t":"step","lvl":1,"n":"6","text":"Set the NO. 1 Throttle to FLY at 105% Np."},{"t":"step","lvl":1,"n":"7","text":"Increase collective to 50% torque."},{"t":"step","lvl":1,"n":"8","text":"Select INIT #1."},{"t":"step","lvl":1,"n":"9","text":"Upon completion of test, select ACCEPT ENG 1 if PASSED (See Note)."},{"t":"step","lvl":2,"n":"a","text":"Verify data logged on EPAC page."},{"t":"step","lvl":1,"n":"10","text":"Set NO. 2 Throttle to FLY."},{"t":"step","lvl":1,"n":"11","text":"Set NO. 1 Throttle to IDLE."},{"t":"step","lvl":2,"n":"a","text":"Verify that torque is within 6% of the original setting (50%)."},{"t":"step","lvl":1,"n":"12","text":"Adjust collective to 50% torque."},{"t":"step","lvl":1,"n":"13","text":"Select INIT #2."},{"t":"step","lvl":1,"n":"14","text":"Upon completion of test, select ACCEPT ENG 2 if PASSED (See Note)."},{"t":"step","lvl":2,"n":"a","text":"Verify data logged on EPAC page."},{"t":"step","lvl":1,"n":"15","text":"Reduce collective to flat pitch."},{"t":"step","lvl":1,"n":"16","text":"Set the NO. 1 throttle to FLY."}]},{"id":"2.27","chapter":"2","title":"FADEC TRAINING MODE","page":63,"blocks":[{"t":"step","lvl":1,"n":"1","text":"With both engines in FLY, set collective at Flat Pitch."},{"t":"step","lvl":1,"n":"2","text":"Note torque and TGT for each engine."},{"t":"step","lvl":1,"n":"3","text":"Without moving the collective, on the OEI TRAIN panel place the Dual Training switch to DUAL TRAIN."},{"t":"step","lvl":2,"n":"a","text":"Verify that TRAIN is displayed with a blue background on the PFD."},{"t":"step","lvl":2,"n":"b","text":"Verify that TRAIN is displayed with a blue background on the EICAS over both engine pods."},{"t":"step","lvl":2,"n":"c","text":"Verify that both torques increase approximately 15%."},{"t":"step","lvl":2,"n":"d","text":"Verify that both TGTs increase approximately 35° - 110°."},{"t":"step","lvl":1,"n":"4","text":"Place the TRNG IDLE switch to #1."},{"t":"step","lvl":2,"n":"a","text":"Verify that the #1 engine Np drops to approximately 92 - 95%."},{"t":"step","lvl":2,"n":"b","text":"Verify that the #1 engine torque drops."},{"t":"step","lvl":2,"n":"c","text":"Verify on the PFD that the #2 engine 30S TGT is armed."},{"t":"step","lvl":2,"n":"d","text":"Verify that the Nr green arc changes to 100 - 106%."},{"t":"step","lvl":1,"n":"5","text":"Using the pilot collective OEI switch, select 2 minute power by pushing aft on the switch."},{"t":"step","lvl":2,"n":"a","text":"Verify on the PFD that the #2 engine 2M TGT is armed."},{"t":"step","lvl":1,"n":"6","text":"Using the pilot collective OEI switch, select maximum continuous power by pushing down on the switch."},{"t":"step","lvl":2,"n":"a","text":"Verify on the PFD that the #2 engine indicates nothing is armed (Max Continuous)."},{"t":"step","lvl":1,"n":"7","text":"Select TRNG IDLE."},{"t":"step","lvl":2,"n":"a","text":"Verify that both engines regain training power."},{"t":"step","lvl":1,"n":"8","text":"Place the TRNG IDLE switch to #2."},{"t":"step","lvl":2,"n":"a","text":"Verify that neither engine loses power."},{"t":"step","lvl":1,"n":"9","text":"Select TRNG IDLE."},{"t":"step","lvl":1,"n":"10","text":"Select DUAL TRAIN switch to OFF."},{"t":"step","lvl":1,"n":"11","text":"Repeat for #2 engine and the copilot OEI collective switch."}]},{"id":"2.28","chapter":"2","title":"BMS","page":64,"blocks":[{"t":"note","text":"Oil cooler and hangar bearings temperature/vibration exceedances, as well as swashplate vibration exceedances, only activate the CHECK BMS advisory."},{"t":"note","text":"The CHECK BMS advisory is not initially displayed in the air (i.e., it is not displayed until landing)."},{"t":"note","text":"Swashplate temperature exceedances activate the S/P TEMP caution."},{"t":"step","lvl":1,"n":"1","text":"Select the HLTH status page."},{"t":"step","lvl":1,"n":"2","text":"Select DRIVE TRAIN→SUB SYS→X BEARING."},{"t":"step","lvl":1,"n":"3","text":"Select XCEED (if displayed)."},{"t":"step","lvl":1,"n":"4","text":"Record any exceedance."}]},{"id":"2.29","chapter":"2","title":"HUMS","page":64,"blocks":[{"t":"note","text":"HUMS exceedances will automatically be displayed on the HLTH page after touchdown."},{"t":"note","text":"Active exceedances are listed on the top of the Exceedance page. Details of each exceedance such as duration and maximum/minimum value are listed at the bottom of the page for the selected exceedance."},{"t":"note","text":"The most common cause of a COLD START exceedance is the HUMS being powered down without a CREW CHANGE on the previous flight."},{"t":"step","lvl":1,"n":"1","text":"To view exceedances, select HLTH and HUMS."},{"t":"step","lvl":1,"n":"2","text":"Select ACTIVE EXCD."},{"t":"step","lvl":1,"n":"3","text":"Select exceedance and record details of any Exceedance Message except COLD START."}]},{"id":"2.30","chapter":"2","title":"WHEEL BRAKE BREAK-IN","page":65,"blocks":[{"t":"note","text":"The purpose of the wheel brake break-in procedure is to ensure proper mating of components."},{"t":"note","text":"Wait 5 minutes after last application of brakes before applying the parking brake."},{"t":"step","lvl":1,"n":"1","text":"On a flat surface, ground taxi between 8 to 10 knots ground speed."},{"t":"step","lvl":1,"n":"2","text":"Lower the collective."},{"t":"step","lvl":1,"n":"3","text":"Start timing."},{"t":"step","lvl":1,"n":"4","text":"From the pilot position, very slowly apply brakes evenly and steadily to come to a complete stop in 15 to 20 seconds."},{"t":"step","lvl":2,"n":"a","text":"Verify that the brake pressure is even between the right and left pedals."},{"t":"step","lvl":2,"n":"b","text":"Verify that the brake system efficiently stops the helicopter."},{"t":"step","lvl":1,"n":"5","text":"Repeat three more times."},{"t":"step","lvl":1,"n":"6","text":"From the copilot’s position, apply both breaks."},{"t":"step","lvl":2,"n":"a","text":"Verify that the brake pressure is even between the right and left pedals."},{"t":"step","lvl":2,"n":"b","text":"Verify that the brake system efficiently stops the helicopter."}]},{"id":"3.1","chapter":"3","title":"FLIGHT MAIN ROTOR TRACK","page":66,"blocks":[{"t":"note","text":"Actual 1P, 2P and 3P track and balance limits are in Chapter 18 of the S-92 Maintenance Manual. Limits in this FCP might not be the most current limits and should be used for pilot reference only."},{"t":"note","text":"The HUMS will continue to take and process data anytime the flight conditions are satisfied."},{"t":"note","text":"2P and 3P data is taken in the background during the 1P acquisition and only accessible through the ground station."},{"t":"note","text":"2P corrections can be included in the 1P corrections if selected during ground station rotor tuning setup – see Chapter 18 of the S-92 Maintenance Manual."},{"t":"note","text":"If a 3P limit is exceeded, contact Sikorsky Engineering for a correction."},{"t":"note","text":"The aircraft is limited to 86% torque above 100 KIAS. If 150 KIAS cannot be achieved, set 86% torque and accept the airspeed to take data."},{"t":"h","id":"3.1.1","text":"MAIN ROTOR 1P, 2P AND 3P"},{"t":"step","lvl":1,"n":"1","text":"Select HLTH→HUMS→TRACK BAL→MAIN RTR."},{"t":"step","lvl":1,"n":"2","text":"Select AVC ON."},{"t":"step","lvl":1,"n":"3","text":"Set flat pitch with the helicopter on the ground."},{"t":"step","lvl":1,"n":"4","text":"Select the GROUND soft bezel key."},{"t":"step","lvl":2,"n":"a","text":"When data is displayed, verify that the helicopter is within limits."},{"t":"p","text":"Acceptable Main Rotor Ground 1P Vibration Limits:","lvl":3},{"t":"table","rows":[["","VERT","ROLL","FLR LAT","TRK SPC"],["Ground","None",".2 IPS",".25 IPS","None"]]},{"t":"step","lvl":1,"n":"5","text":"Hover the helicopter."},{"t":"step","lvl":1,"n":"6","text":"Select FLT RGMES."},{"t":"step","lvl":1,"n":"7","text":"Select HOVER."},{"t":"step","lvl":2,"n":"a","text":"When data is displayed, verify that the helicopter is within limits."},{"t":"step","lvl":1,"n":"8","text":"Fly helicopter straight and level."},{"t":"step","lvl":1,"n":"9","text":"Repeat for 80 KIAS, 120 KIAS, 140 KIAS and 150 KIAS."},{"t":"p","text":"Acceptable Main Rotor Flight 1P Vibration Limits:","lvl":2},{"t":"table","rows":[["","VERT","OH LAT","TRK SPC"],["Hover",".2",".25","None"],["80 KIAS",".2",".25","None"],["120 KIAS",".2",".25","None"],["140 KIAS",".2",".25","None"],["150 KIAS",".2",".25","None"]]},{"t":"p","text":"Acceptable Main Rotor Flight 2P and 3P Vibration Limits:","lvl":2},{"t":"table","rows":[["","2P Cockpit Vertical","3P Cockpit Vertical"],["Hover",".2",".2"],["80 KIAS",".2",".2"],["120 KIAS",".2",".2"],["140 KIAS",".2",".2"],["150 KIAS",".2",".2"]]}]},{"id":"3.2","chapter":"3","title":"WEIGHT ON WHEELS CHECK","page":67,"blocks":[{"t":"note","text":"The flight time recorder will not indicate flight time until after 1 minute airborne."},{"t":"note","text":"The right WOW switch controls the clock and weather radar."},{"t":"note","text":"The left WOW switch controls the FMS 1 and Transponder 1."},{"t":"step","lvl":1,"n":"1","text":"Select WX on the weather radar."},{"t":"step","lvl":1,"n":"2","text":"Select WX overlay on the NAV display."},{"t":"step","lvl":2,"n":"a","text":"Verify that the weather radar is in FSTBY."},{"t":"step","lvl":1,"n":"3","text":"Select FT on the clock."},{"t":"step","lvl":1,"n":"4","text":"Select DATA 2/4 on the FMS."},{"t":"step","lvl":2,"n":"a","text":"Verify that the VOR, ADC, and DME are deselected (D)."},{"t":"step","lvl":1,"n":"5","text":"Lift helicopter into a hover."},{"t":"step","lvl":2,"n":"a","text":"Verify that the WX display changes from the FSTBY to WX."},{"t":"step","lvl":2,"n":"b","text":"Verify that the flight time counter starts recording flight time."},{"t":"step","lvl":2,"n":"c","text":"Verify that the VOR, ADC, and DME switch from DESEL to SELECT on DATA 2/4 on the FMS."},{"t":"step","lvl":2,"n":"d","text":"Verify that the transient Nr droop is 1% or less."}]},{"id":"3.3","chapter":"3","title":"INITIAL HOVER CHECKS","page":68,"blocks":[{"t":"note","text":"Momentary oil pressure fluctuations may occur during transient maneuvers (e.g., pitch low takeoffs, hover checks, gusty wind conditions). These types of fluctuations are acceptable even when oil pressure drops into the yellow range (below 45 psi)."},{"t":"step","lvl":1,"n":"1","text":"Hover helicopter into the wind."},{"t":"step","lvl":2,"n":"a","text":"Verify that Nr is set to 105% Nr."},{"t":"step","lvl":2,"n":"b","text":"Verify that the helicopter can be controlled in pitch, roll, yaw and altitude."},{"t":"step","lvl":2,"n":"c","text":"Verify that the hydraulic, main gear box and engine instruments on the EICAS page are in the green."},{"t":"step","lvl":2,"n":"d","text":"During steady state hover conditions, verify that the MGB oil pressure is between 55 and 60 psi."},{"t":"step","lvl":2,"n":"e","text":"Verify that the aircraft exhibits no unusual vibration."},{"t":"step","lvl":2,"n":"f","text":"Verify that the #1 and #2 torques are matched within 5%."},{"t":"step","lvl":2,"n":"g","text":"Verify that both airspeed indicators on PFD and backup airspeed indicator read zero plus wind speed."}]},{"id":"3.4","chapter":"3","title":"HOVER CONTROL POSITION CHECK","page":69,"blocks":[{"t":"note","text":"For reference, the large nuts securing the pedals are 1.3125″ from flat to flat."},{"t":"note","text":"The autorotation Nr must be within limits to get a valid pedal position check. Do not continue with the flight checks past the Autorotation Check unless the Hover Control Position Check is within limits as described below."},{"t":"note","text":"This pedal check gives the pilot an indication the tail rotor is safely rigged. It is not intended as a precise rigging check."},{"t":"step","lvl":1,"n":"1","text":"Hover the helicopter into the wind."},{"t":"step","lvl":2,"n":"a","text":"Verify that the cyclic position is approximately 1″ forward of neutral."},{"t":"step","lvl":2,"n":"b","text":"Verify that the left pedal is 11⁄2″ ±3⁄4″ forward of the right pedal."}]},{"id":"3.5","chapter":"3","title":"COMPASS AND HSI CHECK","page":69,"blocks":[{"t":"note","text":"The FAA requires that standby compass calibration correction be less than 10° from actual magnetic heading."},{"t":"step","lvl":1,"n":"1","text":"Initiate a pedal turn stopping at the four cardinal (N, E, S and W) headings."},{"t":"step","lvl":2,"n":"a","text":"Verify the smooth operation of pilot and copilot HSI."},{"t":"step","lvl":2,"n":"b","text":"Verify the smooth operation of the standby compass."},{"t":"step","lvl":1,"n":"2","text":"Compare standby magnetic compass with the HSI."},{"t":"step","lvl":2,"n":"a","text":"Note the compass corrections on the compass calibration card."},{"t":"step","lvl":2,"n":"b","text":"Verify that the standby compass is within ±10° of the actual magnetic heading."}]},{"id":"3.6","chapter":"3","title":"AFCS HOVER CHECKS","page":70,"blocks":[{"t":"h","id":"3.6.1","text":"SAS"},{"t":"note","text":"Control input should be crisp, allowing the cyclic to return to the trimmed position in a controlled/guarded manner. Input rate should be such that the desired attitude change is obtained and the cyclic returned to the trimmed position in approximately one second."},{"t":"note","text":"A properly functioning PSAS/SSAS will dampen the induced pitch/roll rate but will not necessarily return the helicopter to the trimmed attitude. Therefore, the tendency of the helicopter to stop pitching/rolling during single SAS checks rather than pitch/roll back to the original attitude confirms that PSAS/SSAS is functioning properly."},{"t":"note","text":"If helicopter loading/configuration results in a left wing down hover attitude of approximately 2° or more, the roll proportional stability contribution of the SAS will be saturated. However, the roll rate damping function of the SAS should still function properly. Consequently, the helicopter should exhibit a damped response to a left control input but will not exhibit a tendency to return to trim. The tendency to return to trim should not be confused with a damped roll response."},{"t":"step","lvl":1,"n":"1","text":"Select YAW, CYCLIC and COLL TRIM – ON."},{"t":"step","lvl":1,"n":"2","text":"#1 PSAS Check:"},{"t":"step","lvl":2,"n":"a","text":"Select SAS 1 and SAS 1 PRI – ON."},{"t":"step","lvl":2,"n":"b","text":"Select AP2, AP1 and SAS 2 – OFF."},{"t":"step","lvl":2,"n":"c","text":"Verify that the SAS 2 PRES caution light illuminates."},{"t":"step","lvl":2,"n":"d","text":"Introduce a forward 3° pitch attitude pulse (push cyclic forward and release). Verify that the pitch rate is damped (slows down or stops)."},{"t":"step","lvl":2,"n":"e","text":"Repeat using an aft 3° pitch attitude pulse."},{"t":"step","lvl":2,"n":"f","text":"Repeat using a left 5° roll attitude pulse."},{"t":"step","lvl":2,"n":"g","text":"Repeat using a right 5° roll attitude pulse."},{"t":"step","lvl":1,"n":"3","text":"#2 PSAS Check:"},{"t":"step","lvl":2,"n":"a","text":"Select SAS 2 and SAS 2 PRI – ON."},{"t":"step","lvl":2,"n":"b","text":"Select AP1, AP2 and SAS 1 – OFF."},{"t":"step","lvl":2,"n":"c","text":"Verify that the SAS 1 PRES caution light illuminates."},{"t":"step","lvl":2,"n":"d","text":"Introduce a forward 3° pitch attitude pulse (push cyclic forward and release). Verify that the pitch rate is damped (slows down or stops)."},{"t":"step","lvl":2,"n":"e","text":"Repeat using an aft 3° pitch attitude pulse."},{"t":"step","lvl":2,"n":"f","text":"Repeat using a left 5° roll attitude pulse."},{"t":"step","lvl":2,"n":"g","text":"Repeat using a right 5° roll attitude pulse."},{"t":"step","lvl":1,"n":"4","text":"#1 SSAS Check:"},{"t":"step","lvl":2,"n":"a","text":"Select SAS 1 and SAS 1 SEC – ON."},{"t":"step","lvl":2,"n":"b","text":"Select AP2, AP1 and SAS2 – OFF."},{"t":"step","lvl":2,"n":"c","text":"Verify that the SAS 2 PRES caution light illuminates."},{"t":"step","lvl":2,"n":"d","text":"Introduce a forward 3° pitch attitude pulse (push cyclic forward and release). Verify that the pitch rate is damped (slows down or stops)."},{"t":"step","lvl":2,"n":"e","text":"Repeat using an aft 3° pitch attitude pulse."},{"t":"step","lvl":2,"n":"f","text":"Repeat using a left 5° roll attitude pulse."},{"t":"step","lvl":2,"n":"g","text":"Repeat using a right 5° roll attitude pulse."},{"t":"step","lvl":1,"n":"5","text":"#2 SSAS Check:"},{"t":"step","lvl":2,"n":"a","text":"Select SAS 2 and SAS2 SEC – ON."},{"t":"step","lvl":2,"n":"b","text":"Select AP1, AP2 and SAS1 – OFF."},{"t":"step","lvl":2,"n":"c","text":"Verify that the SAS 1 PRES caution light illuminates."},{"t":"step","lvl":2,"n":"d","text":"Introduce a forward 3° pitch attitude pulse (push cyclic forward and release)."},{"t":"step","lvl":2,"n":"e","text":"Verify that the pitch rate is damped (slows down or stops)."},{"t":"step","lvl":2,"n":"f","text":"Repeat using an aft 3° pitch attitude pulse."},{"t":"step","lvl":2,"n":"g","text":"Repeat using a left 5° roll attitude pulse."},{"t":"step","lvl":2,"n":"h","text":"Repeat using a right 5° roll attitude pulse."},{"t":"step","lvl":1,"n":"6","text":"Select ATT, AP 1, AP 2, SAS 1 PRI, and SAS 2 PRI – ON."},{"t":"h","id":"3.6.2","text":"AUTOPILOT"},{"t":"note","text":"Control input should be crisp, allowing the cyclic to return to the trimmed position in a controlled/guarded manner. Input rate should be such that the desired attitude change is obtained and the cyclic returned to the trimmed position in approximately one second."},{"t":"step","lvl":1,"n":"1","text":"Select YAW, CYCLIC and COLL TRIM – ON."},{"t":"step","lvl":1,"n":"2","text":"Select ATT, AP 1, SAS 1, and PRI – ON."},{"t":"step","lvl":1,"n":"3","text":"Select SAS 2 and PRI – ON."},{"t":"step","lvl":1,"n":"4","text":"Select AP 2 – OFF."},{"t":"step","lvl":1,"n":"5","text":"In a steady state hover:"},{"t":"step","lvl":2,"n":"a","text":"Verify that the hands-off attitude retention is ±1°."},{"t":"step","lvl":2,"n":"b","text":"Verify that the heading hold is within ±2°."},{"t":"step","lvl":1,"n":"6","text":"Introduce a forward 5° pitch attitude pulse (push cyclic forward and release)."},{"t":"step","lvl":2,"n":"a","text":"Verify that the helicopter returns to the trimmed attitude with no more than one overshoot."},{"t":"step","lvl":2,"n":"b","text":"Verify that the cyclic moves in response to the inputs to return the helicopter to a trimmed attitude."},{"t":"step","lvl":1,"n":"7","text":"Repeat using an aft 5° pitch attitude pulse."},{"t":"step","lvl":1,"n":"8","text":"Introduce a left 10° roll attitude pulse (push cyclic left and release)."},{"t":"step","lvl":2,"n":"a","text":"Verify that the helicopter returns to the trimmed attitude with no more than one overshoot."},{"t":"step","lvl":2,"n":"b","text":"Verify that the cyclic moves in response to the inputs to return the helicopter to a trimmed attitude."},{"t":"step","lvl":1,"n":"9","text":"Repeat using a right 10° roll attitude pulse."},{"t":"step","lvl":1,"n":"10","text":"Make a 20% TRQ change with feet off the pedals."},{"t":"step","lvl":2,"n":"a","text":"Verify that the helicopter maintains ±2° of initial heading (heading hold)."},{"t":"step","lvl":2,"n":"b","text":"Verify that the pedals move during TRQ change to maintain heading."},{"t":"step","lvl":1,"n":"11","text":"Select AP 2 – ON."},{"t":"step","lvl":1,"n":"12","text":"Select AP 1 – OFF."},{"t":"step","lvl":1,"n":"13","text":"Repeat checks for AP 2."},{"t":"h","id":"3.6.3","text":"RADAR ALTITUDE HOLD"},{"t":"step","lvl":1,"n":"1","text":"YAW, CYCLIC, and COLL TRIM – ON."},{"t":"step","lvl":1,"n":"2","text":"ATT, AP 1, SAS 1, and PRI – ON."},{"t":"step","lvl":1,"n":"3","text":"AP 2, SAS 2, and PRI – ON."},{"t":"step","lvl":1,"n":"4","text":"Select FD 2 on the AFCS control panel."},{"t":"step","lvl":1,"n":"5","text":"Hover helicopter at an altitude between 50 and 75 feet (selected altitude)."},{"t":"step","lvl":1,"n":"6","text":"Select RALT on the pilot FD MODE SEL panel and confirm the following:"},{"t":"step","lvl":2,"n":"a","text":"The COUPLE light illuminates on the AFCS control panel."},{"t":"step","lvl":2,"n":"b","text":"CPL is displayed in green under FD 2 on the PFD."},{"t":"step","lvl":2,"n":"c","text":"RALT ON is displayed on both MODE SEL panels."},{"t":"step","lvl":2,"n":"d","text":"RALT is displayed in green on top of the PFD by the C label (collective channel)."},{"t":"step","lvl":2,"n":"e","text":"The selected radar altitude is displayed in magenta over the VSI and a magenta bug appears on the radar altimeter display (for helicopters equipped with AMS 4.1)."},{"t":"step","lvl":2,"n":"f","text":"The helicopter maintains the selected altitude ±4 feet."},{"t":"step","lvl":1,"n":"7","text":"Without depressing the collective trim, push collective down to descend 5 feet and release collective. Helicopter should return to selected altitude within ±4 feet and with no more than a 4-foot overshoot."},{"t":"step","lvl":1,"n":"8","text":"Depress the collective trim and slowly change the hover altitude by at least 10 feet."},{"t":"step","lvl":1,"n":"9","text":"Releasing the collective trim, the helicopter should maintain the altitude at which the trim was released within ±4 feet."},{"t":"step","lvl":1,"n":"10","text":"Use the pilot collective beeper to change altitude by at least 10 feet."},{"t":"step","lvl":1,"n":"11","text":"Change the helicopter heading by 5° using the pilot’s collective HDG TRIM switch."},{"t":"step","lvl":1,"n":"12","text":"Depress the pilot cyclic Flight Director Standby button to decouple FD 2."},{"t":"step","lvl":2,"n":"a","text":"Verify that FD 2 decouples."},{"t":"step","lvl":2,"n":"b","text":"Verify that the ″DECOUPLE″ aural alert is heard."},{"t":"step","lvl":1,"n":"13","text":"Select FD 1 on the AFCS control panel."},{"t":"step","lvl":1,"n":"14","text":"Repeat on the copilot’s side using the copilot’s PFD, HDG TRIM switch, cyclic FD standby button, collective beeper and MODE SEL panel."}]},{"id":"4.1","chapter":"4","title":"FLIGHT INSTRUMENTS","page":75,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Check the pilot, copilot and backup airspeed indicators."},{"t":"step","lvl":2,"n":"a","text":"Maximum allowable difference among pilot, copilot and backup airspeed indicators is ±5 knots."},{"t":"step","lvl":2,"n":"b","text":"Maximum allowable fluctuation per indicator in straight and level flight is ±3 knots."},{"t":"step","lvl":1,"n":"2","text":"Check the pilot HSI, copilot HSI, and standby compass for smooth operation and agreement."},{"t":"step","lvl":1,"n":"3","text":"Check the standby attitude indicator for smooth operation and agreement with the PDFs."},{"t":"step","lvl":1,"n":"4","text":"Check the VSI and altimeters for smooth operation."}]},{"id":"4.2","chapter":"4","title":"AUTOROTATION","page":75,"blocks":[{"t":"warning","text":"If an Nr of at least 90% cannot be maintained, di
