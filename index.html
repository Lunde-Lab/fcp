<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080d11">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="S-92 FCP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>S-92 FCP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Design: samme tokens som ground-run. Tilpasset iPad mini 4 (768 × 1024, Safari 15) */
:root {
  --bg: #e9eef1;
  --panel: #ffffff;
  --panel2: #f1f6f8;
  --fg: #0e1b23;
  --muted: #566772;
  --grid: #c5d0d7;
  --grid-strong: #6a7d89;
  --line: #d3dce2;
  --accent: #007f94;
  --good: #14935c;
  --warn: #c97a00;
  --crit: #d02b2b;
  --accent-rgb: 0,127,148; --good-rgb: 20,147,92; --warn-rgb: 201,122,0; --crit-rgb: 208,43,43; --muted-rgb: 86,103,114;
  --fig-filter: none;
  --font-ui: "Barlow", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080d11; --panel: #0f1820; --panel2: #0b1319; --fg: #e3edf2; --muted: #8499a5;
    --grid: #22323d; --grid-strong: #5d7787; --line: #1f2d37; --accent: #35d4ea;
    --good: #3fdc98; --warn: #ffb43a; --crit: #ff6464; color-scheme: dark; --accent-rgb: 53,212,234; --good-rgb: 63,220,152; --warn-rgb: 255,180,58; --crit-rgb: 255,100,100; --muted-rgb: 132,153,165;
    --fig-filter: invert(.9) hue-rotate(180deg);
  }
}
:root[data-theme="dark"] {
  --bg: #080d11; --panel: #0f1820; --panel2: #0b1319; --fg: #e3edf2; --muted: #8499a5;
  --grid: #22323d; --grid-strong: #5d7787; --line: #1f2d37; --accent: #35d4ea;
  --good: #3fdc98; --warn: #ffb43a; --crit: #ff6464; color-scheme: dark; --accent-rgb: 53,212,234; --good-rgb: 63,220,152; --warn-rgb: 255,180,58; --crit-rgb: 255,100,100; --muted-rgb: 132,153,165;
  --fig-filter: invert(.9) hue-rotate(180deg);
}
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-bottom: max(22px, env(safe-area-inset-bottom, 0px)); -webkit-tap-highlight-color: transparent; }
.wrap { width: 100%; max-width: 1000px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.card { background: linear-gradient(160deg, var(--panel), var(--panel2)); border: 1px solid var(--line); border-radius: 14px; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.01em; margin: 0; }
h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0; font-weight: 600; }
.sub { color: var(--muted); font-size: .95rem; margin: 0; }
.fine { font-size: .8rem; color: var(--muted); margin: 0; line-height: 1.45; }

button { font: inherit; font-size: 1rem; font-weight: 500; min-height: 46px; padding: 10px 18px; border-radius: 10px; touch-action: manipulation; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); cursor: pointer; }
button:hover { border-color: var(--grid-strong); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
button.danger { background: var(--crit); border-color: var(--crit); color: var(--panel); font-weight: 700; }
button:disabled { opacity: .4; cursor: default; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }

/* Topplinje (sticky) */
.bar { position: sticky; top: 0; z-index: 20; margin-inline: -16px; padding: max(10px, env(safe-area-inset-top, 0px)) 16px 10px; background: rgba(var(--bar-rgb, 233,238,241), .92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
:root { --bar-rgb: 233,238,241; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bar-rgb: 8,13,17; } }
:root[data-theme="dark"] { --bar-rgb: 8,13,17; }
.bar-in { max-width: 1000px; margin-inline: auto; display: flex; align-items: center; gap: 10px; min-height: 52px; }
.bar-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bar-t b { font-size: 1.15rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-t b .num { font-family: var(--font-data); color: var(--accent); margin-right: 8px; }
.bar-t small { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { min-height: 52px; padding: 8px 16px 8px 12px; font-weight: 700; font-size: 1.05rem; display: inline-flex; align-items: center; gap: 6px; border-color: var(--accent); color: var(--accent); background: rgba(var(--accent-rgb), .1); flex: none; }
.back svg { width: 20px; height: 20px; }
.navbtn { min-width: 52px; min-height: 52px; padding: 0; font-size: 1.4rem; font-weight: 700; flex: none; }
@media (max-width: 560px) { .bar .navbtn { display: none; } }

/* Fremside */
.head { display: flex; flex-direction: column; gap: 4px; padding-top: 12px; }
.sum { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.sum-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-family: var(--font-data); font-size: 1.6rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--c, var(--fg)); }
.stats small { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.prog { height: 8px; border-radius: 999px; background: var(--grid); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 999px; transition: width .3s; }
.seg { display: inline-flex; gap: 4px; padding: 3px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); }
.seg button { min-height: 44px; padding: 6px 16px; border: 0; background: transparent; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.good { --c: var(--good); --cr: var(--good-rgb); } .warn { --c: var(--warn); --cr: var(--warn-rgb); } .crit { --c: var(--crit); --cr: var(--crit-rgb); } .acc { --c: var(--accent); --cr: var(--accent-rgb); }

.chap { overflow: hidden; }
.chap-h { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; background: var(--panel2); border-bottom: 1px solid var(--line); }
.chap-h h3 { margin: 0; flex: 1; font-size: 1rem; font-weight: 700; letter-spacing: .02em; }
.chap-h h3 span { font-family: var(--font-data); color: var(--accent); margin-right: 10px; }
.chap-h .cnt { font-family: var(--font-data); font-size: .85rem; color: var(--muted); white-space: nowrap; }
.chap-h button { min-height: 40px; padding: 4px 12px; font-size: .85rem; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: stretch; border-top: 1px solid var(--line); min-height: 56px; }
.row:first-child { border-top: 0; }
.rows.dim .row:not(.sel) .go { opacity: .5; }
.chk { flex: none; width: 60px; min-height: 56px; padding: 0; border: 0; border-radius: 0; background: transparent; display: grid; place-items: center; }
.chk i { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--grid-strong); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.chk i svg { width: 18px; height: 18px; opacity: 0; }
.chk[aria-checked="true"] i { background: var(--accent); border-color: var(--accent); }
.chk[aria-checked="true"] i svg { opacity: 1; stroke: var(--bg); }
.go { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 8px 6px; color: var(--fg); text-decoration: none; }
.go .n { font-family: var(--font-data); font-weight: 700; font-size: 1.05rem; color: var(--accent); min-width: 48px; padding: 6px 8px; border-radius: 8px; background: rgba(var(--accent-rgb), .1); text-align: center; font-variant-numeric: tabular-nums; }
.go .t { flex: 1; min-width: 0; font-weight: 600; font-size: 1rem; line-height: 1.25; }
.go .t small { display: block; font-weight: 500; font-size: .8rem; color: var(--muted); margin-top: 2px; }
.go .chev { color: var(--grid-strong); font-size: 1.3rem; padding-right: 4px; }
.go:active { background: rgba(var(--accent-rgb), .06); }
.row.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { background: rgba(var(--accent-rgb), .18); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .row.flash { animation: none; } }
.st { flex: none; display: flex; align-items: center; padding: 6px 10px 6px 4px; }
.sign { min-height: 44px; padding: 6px 14px; font-size: .92rem; font-weight: 700; color: var(--accent); border-color: rgba(var(--accent-rgb), .5); background: transparent; white-space: nowrap; }
.signed { min-height: 44px; padding: 4px 12px; display: inline-flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; border-color: rgba(var(--good-rgb), .5); background: rgba(var(--good-rgb), .14); color: var(--good); font-weight: 700; font-size: .9rem; line-height: 1.15; text-align: left; white-space: nowrap; }
.signed small { font-family: var(--font-data); font-weight: 500; font-size: .72rem; color: var(--muted); }
.empty { padding: 18px 16px; color: var(--muted); font-size: .92rem; }
.foot { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-block: 8px 24px; }
.foot .btns { justify-content: center; }
.foot button { min-height: 44px; padding: 6px 16px; font-size: .9rem; }

/* Prosedyreside */
.doc { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 12px; font-size: 1.05rem; line-height: 1.5; }
.doc .ch { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; margin: 0; }
.doc h1 { display: flex; gap: 12px; align-items: baseline; font-size: 1.5rem; }
.doc h1 span { font-family: var(--font-data); color: var(--accent); }
.doc h3 { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 1.1rem; font-weight: 700; display: flex; gap: 10px; }
.doc h3 span { font-family: var(--font-data); color: var(--accent); font-weight: 700; }
.step { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 0 4px; margin-left: calc((var(--l, 1) - 1) * 2.2em); }
.step > b { font-family: var(--font-data); font-weight: 700; color: var(--muted); font-size: .95em; text-align: right; padding-right: 6px; }
.step.l1 > b { color: var(--fg); }
.para { margin: 0; }
.para.ann { font-family: var(--font-data); font-size: .92em; font-weight: 500; }
.adm { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px 12px 16px; border-radius: 12px; border: 1px solid rgba(var(--cr), .5); background: rgba(var(--cr), .1); border-left: 6px solid var(--c); }
.adm b { font-size: .8rem; letter-spacing: .14em; color: var(--c); font-weight: 700; }
.adm p { margin: 0; }
.adm.warning p, .adm.caution p { font-weight: 600; }
.adm.note { --c: var(--accent); --cr: var(--accent-rgb); }
.adm.caution { --c: var(--warn); --cr: var(--warn-rgb); }
.adm.warning { --c: var(--crit); --cr: var(--crit-rgb); }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); align-self: flex-start; max-width: 100%; }
.tablewrap table { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; font-size: .95rem; }
.tablewrap td { padding: 8px 14px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); white-space: nowrap; }
.tablewrap tr > *:last-child { border-right: 0; }
.tablewrap tr:last-child > * { border-bottom: 0; }
.tablewrap tr.th td { background: var(--panel2); font-size: .8rem; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.tablewrap td.ann { font-family: var(--font-data); font-size: .85rem; }
.figs { display: flex; flex-direction: column; gap: 16px; }
.fig { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.fig img { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); background: #fff; filter: var(--fig-filter); }
.fig figcaption { font-size: .9rem; color: var(--muted); text-align: center; font-weight: 600; }
.rec { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.recgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.recgrid label { display: flex; flex-direction: column; gap: 5px; font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.recgrid input { -webkit-appearance: none; appearance: none; font: inherit; font-family: var(--font-data); font-size: 1.05rem; letter-spacing: 0; text-transform: none; color: var(--fg); min-height: 48px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-width: 0; width: 100%; }
.recsum { font-family: var(--font-data); font-size: .78rem; color: var(--muted); font-weight: 500; }
.signcard { padding: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.signcard .who { display: flex; flex-direction: column; gap: 2px; }
.signcard .who b { font-size: 1.1rem; }
.signcard .who small { font-family: var(--font-data); font-size: .85rem; color: var(--muted); }
.signcard.done { border-color: rgba(var(--good-rgb), .55); background: rgba(var(--good-rgb), .1); }
.signcard.done .who b { color: var(--good); }
.bigsign { min-height: 56px; padding: 10px 26px; font-size: 1.1rem; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pn button { min-height: 56px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left; padding: 8px 14px; min-width: 0; }
.pn button.nx { align-items: flex-end; text-align: right; }
.pn button small { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.pn button span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.pn button span b { font-family: var(--font-data); color: var(--accent); margin-right: 6px; }
.selrow { display: flex; align-items: center; gap: 4px; }
.selrow .chk { width: 48px; }
.selrow label { font-weight: 600; }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
@media (min-width: 560px) { .modal { align-items: center; } }
.sheet { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--grid-strong); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
.sheet h3 { margin: 0; font-size: 1.1rem; font-weight: 700; line-height: 1.3; }
.sheet h3 span { font-family: var(--font-data); color: var(--accent); margin-right: 8px; }
.sheet p { margin: 0; line-height: 1.45; }
.fld { display: flex; flex-direction: column; gap: 5px; font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.fld input { -webkit-appearance: none; appearance: none; display: block; width: 100%; font: inherit; font-family: var(--font-data); font-size: 1.3rem; text-transform: uppercase; letter-spacing: .04em; color: var(--fg); min-height: 56px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.fld input.bad { border-color: var(--crit); }
.sheet .btns { justify-content: flex-end; }
.sheet .btns button { min-width: 110px; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; padding: 12px 18px; border-radius: 12px; background: var(--fg); color: var(--bg); font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
</style>
</head>
<body>

<header class="bar" id="bar">
  <div class="bar-in" id="barHome">
    <div class="bar-t"><b>S-92A FCP</b><small id="barSum"></small></div>
    <div class="seg" role="group" aria-label="Show">
      <button type="button" id="fAll" aria-pressed="true">All</button>
      <button type="button" id="fSel" aria-pressed="false">Selected</button>
    </div>
  </div>
  <div class="bar-in" id="barSec" hidden>
    <button type="button" class="back" id="backBtn" aria-label="Back to front page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>FCP</button>
    <div class="bar-t"><b id="barTitle"></b><small id="barCh"></small></div>
    <button type="button" class="navbtn" id="prevBtn" aria-label="Previous">‹</button>
    <button type="button" class="navbtn" id="nextBtn" aria-label="Next">›</button>
    <span id="barSign"></span>
  </div>
</header>

<main class="wrap">
  <section id="home">
    <div class="wrap">
      <div class="head">
        <h1>S-92A Flight Check Procedures</h1>
        <p class="sub" id="docInfo"></p>
      </div>
      <div class="card sum">
        <div class="sum-row">
          <div class="stats">
            <div class="acc"><b id="nSel">0</b><small>Selected</small></div>
            <div class="good"><b id="nDone">0</b><small>Performed</small></div>
            <div class="warn"><b id="nLeft">0</b><small>Remaining</small></div>
          </div>
          <p class="fine" id="selHint">Tick the tests to perform. Tap a number to open it.</p>
        </div>
        <div class="prog" aria-hidden="true"><i id="progBar"></i></div>
      </div>
      <div id="chapters" class="wrap"></div>
      <div class="foot">
        <div class="btns">
          <button type="button" id="shareBtn">Share summary</button>
          <button type="button" id="resetBtn">New FCP</button>
          <button type="button" id="themeBtn">Light mode</button>
        </div>
        <p class="fine">Not verified. Support tool only – always follow the current FCP and AMM. Data is stored on this device only.</p>
      </div>
    </div>
  </section>

  <section id="sec" hidden>
    <div class="wrap" style="padding-top: 14px">
      <article class="card doc" id="doc"></article>
      <div id="recCard"></div>
      <div id="signCard"></div>
      <div class="pn"><button type="button" id="prev2"></button><button type="button" class="nx" id="next2"></button></div>
    </div>
  </section>
</main>

<div class="modal" id="signModal" role="dialog" aria-modal="true" aria-labelledby="smTitle" hidden>
  <form class="sheet" id="signForm" autocomplete="off">
    <h3 id="smTitle"></h3>
    <div id="smBody"></div>
    <div class="btns" id="smBtns"></div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script id="fcp-data" type="application/json">{"doc":"SA S92A-FCP-000","title":"S-92A Flight Check Procedures Checklist","rev":"Revised: October 18, 2013","index":[{"id":"1","title":"GROUND TEST PROCEDURES","items":[{"id":"1.1","title":"EXTERNAL EMERGENCY LIGHTS","sign":true},{"id":"1.2","title":"FUEL SELECTORS","sign":true},{"id":"1.3","title":"STANDBY ATTITUDE INDICATOR","sign":true},{"id":"1.4","title":"BATTERY CHECKS","sign":true},{"id":"1.5","title":"SEAT BELT AND SHOULDER HARNESS","sign":true},{"id":"1.6","title":"SEAT ADJUSTMENT","sign":true},{"id":"1.7","title":"TAIL ROTOR PEDAL ADJUSTMENT","sign":true},{"id":"1.8","title":"THROTTLE QUADRANT","sign":true},{"id":"1.9","title":"PLACARDS","sign":true},{"id":"1.10","title":"EXTERNAL POWER","sign":true},{"id":"1.11","title":"APU START","sign":true},{"id":"1.12","title":"PARKING BRAKE","sign":true},{"id":"1.13","title":"ROTOR BRAKE","sign":true},{"id":"1.14","title":"HUMS","sign":true},{"id":"1.15","title":"CLOCK","sign":true},{"id":"1.16","title":"AIRCRAFT CONFIGURATION","sign":true},{"id":"1.17","title":"FLIGHT MANAGEMENT SYSTEM","sign":true},{"id":"1.18","title":"MULTIFUNCTION FLIGHT DISPLAYS","sign":true},{"id":"1.19","title":"SLEW CONTROLLER","sign":true},{"id":"1.20","title":"DISPLAY CONTROL PANEL","sign":true},{"id":"1.21","title":"REMOTE INSTRUMENT CONTROLLER","sign":true},{"id":"1.22","title":"REVERSION CONTROL PANEL","sign":true},{"id":"1.23","title":"MFD REVERSION","sign":true},{"id":"1.24","title":"CAUTION/ADVISORY CHECK","sign":true},{"id":"1.25","title":"AIRCRAFT GROSS WEIGHT","sign":true},{"id":"1.26","title":"FIRE DETECTION TEST","sign":true},{"id":"1.27","title":"FIRE EXTINGUISHER TEST","sign":true},{"id":"1.28","title":"ICS","sign":true},{"id":"1.29","title":"LIGHTS","sign":true},{"id":"1.30","title":"PITOT-STATIC AND OAT","sign":true},{"id":"1.31","title":"VHF RADIO","sign":true},{"id":"1.32","title":"GUARD RADIO","sign":true},{"id":"1.33","title":"ENHANCED GROUND PROXIMITY WARNING SYSTEM","sign":true},{"id":"1.34","title":"COCKPIT VOICE RECORDER/FLIGHT DATA RECORDER","sign":true},{"id":"1.35","title":"RADAR ALTIMETER","sign":true},{"id":"1.36","title":"HYDRAULIC LEAK ISOLATION TEST","sign":true},{"id":"1.37","title":"FLIGHT CONTROL LIMIT CHECK","sign":true},{"id":"1.38","title":"PRIMARY SERVOS CHECK","sign":true},{"id":"1.39","title":"BOOST SERVOS CHECK","sign":true},{"id":"1.40","title":"TRIM CHECKS","sign":true},{"id":"1.41","title":"AFCS PREFLIGHT BIT CHECK","sign":true},{"id":"1.42","title":"WINDSHIELD WIPER/WASHER","sign":true},{"id":"1.43","title":"PITOT-HEATER","sign":true},{"id":"1.44","title":"ENVIRONMENTAL CONTROL SYSTEM","sign":true}]},{"id":"2","title":"RUN-UP TEST PROCEDURE","items":[{"id":"2.1","title":"STARTER SYSTEM","sign":true},{"id":"2.2","title":"ENGINE START","sign":true},{"id":"2.3","title":"ENGINE CROSSBLEED START","sign":true},{"id":"2.4","title":"ENGINE CROSSBLEED MOTORING","sign":true},{"id":"2.5","title":"ROTOR ENGAGEMENT","sign":true},{"id":"2.6","title":"HYDRAULIC SYSTEM CHECK","sign":true},{"id":"2.7","title":"INITIAL RUN-UP CHECKS","sign":true},{"id":"2.8","title":"MGB OIL BYPASS CHECK","sign":true},{"id":"2.9","title":"DRIVE SYSTEM LEAK CHECK","sign":false},{"id":"2.10","title":"ENGINE ACCELERATION CHECK","sign":true},{"id":"2.11","title":"ENGINE BREAK-IN","sign":true},{"id":"2.12","title":"ELECTRICAL SYSTEM","sign":true},{"id":"2.13","title":"WINDSHIELD ANTI-ICE","sign":true},{"id":"2.14","title":"AFCS GROUND RUN CHECK","sign":true},{"id":"2.15","title":"AUTOMATIC VIBRATION CONTROL","sign":true},{"id":"2.16","title":"GROUND MAIN ROTOR TRACK AND BALANCE","sign":true},{"id":"2.17","title":"TAIL ROTOR BALANCE","sign":true},{"id":"2.18","title":"ENGINE HIGH SPEED SHAFT BALANCE","sign":true},{"id":"2.19","title":"ENGINE HIGH SPEED SHAFT DIAGNOSTIC","sign":true},{"id":"2.20","title":"ENGINE ANTI-ICE","sign":true},{"id":"2.21","title":"FUEL SELECTOR AND SHUTOFF VALVE","sign":true},{"id":"2.22","title":"DOOR","sign":true},{"id":"2.23","title":"RAMP","sign":true},{"id":"2.24","title":"ROTOR BRAKE BREAK-IN","sign":true},{"id":"2.25","title":"MAINTENANCE DATA COMPUTER","sign":true},{"id":"2.26","title":"GROUND ENGINE POWER ASSURANCE CHECK","sign":true},{"id":"2.27","title":"FADEC TRAINING MODE","sign":true},{"id":"2.28","title":"BMS","sign":true},{"id":"2.29","title":"HUMS","sign":true},{"id":"2.30","title":"WHEEL BRAKE BREAK-IN","sign":true}]},{"id":"3","title":"HOVER CHECKS","items":[{"id":"3.1","title":"FLIGHT MAIN ROTOR TRACK","sign":true},{"id":"3.2","title":"WEIGHT ON WHEELS CHECK","sign":true},{"id":"3.3","title":"INITIAL HOVER CHECKS","sign":true},{"id":"3.4","title":"HOVER CONTROL POSITION CHECK","sign":true},{"id":"3.5","title":"COMPASS AND HSI CHECK","sign":true},{"id":"3.6","title":"AFCS HOVER CHECKS","sign":true}]},{"id":"4","title":"FLIGHT CHECKS","items":[{"id":"4.1","title":"FLIGHT INSTRUMENTS","sign":true},{"id":"4.2","title":"AUTOROTATION","sign":true,"fields":["COLLECTIVE SETTING 10%","COLLECTIVE SETTING 15%","COLLECTIVE SETTING 20%","HP","OAT","DENSITY ALTITUDE","FUEL","GROSS WEIGHT","ACTUAL NR","TARGET NR"]},{"id":"4.3","title":"LANDING GEAR CHECK","sign":true},{"id":"4.4","title":"FLIGHT ENGINE POWER ASSURANCE CHECK","sign":true},{"id":"4.5","title":"AFCS FLIGHT CHECKS","sign":true},{"id":"4.6","title":"ENHANCED GROUND PROXIMITY WARNING SYSTEM","sign":true},{"id":"4.7","title":"VH CHECK","sign":true}]},{"id":"5","title":"EQUIPMENT CHECKS","items":[{"id":"5.1","title":"TCAS","sign":true},{"id":"5.2","title":"FLOTATION","sign":true},{"id":"5.3","title":"LIFE RAFT","sign":true},{"id":"5.4","title":"RESCUE HOIST","sign":true},{"id":"5.5","title":"CARGO HOOK","sign":true},{"id":"5.6","title":"RIPS","sign":true},{"id":"5.7","title":"WEATHER RADAR","sign":true},{"id":"5.8","title":"LIGHTNING STRIKE SENSOR","sign":true},{"id":"5.9","title":"DIGMAP","sign":true},{"id":"5.10","title":"SAR AFCS","sign":true},{"id":"5.11","title":"RIG APPROACH","sign":true}]}],"chapters":{"1":{"title":"GROUND TEST PROCEDURES","blocks":[{"t":"warning","text":"The pilot should inspect all appropriate maintenance records prior to any ground run or flight."},{"t":"warning","text":"A thorough preflight briefing and preflight inspection should be conducted prior to any ground run or flight."}]},"2":{"title":"RUN-UP TEST PROCEDURE","blocks":[]},"3":{"title":"HOVER CHECKS","blocks":[]},"4":{"title":"FLIGHT CHECKS","blocks":[]},"5":{"title":"EQUIPMENT CHECKS","blocks":[]}},"sections":[{"id":"1.1","chapter":"1","title":"EXTERNAL EMERGENCY LIGHTS","page":1,"blocks":[{"t":"step","lvl":1,"n":"1","text":"With no power (BATT – OFF) on the helicopter, place EXT EMERG light switch to ARM."},{"t":"step","lvl":2,"n":"a","text":"Verify all six white external emergency lights illuminate."}]},{"id":"1.2","chapter":"1","title":"FUEL SELECTORS","page":1,"blocks":[{"t":"warning","text":"The FUEL SELECTOR switch must have a positive detent from XFD to OFF. The pilot must pull down on the switch to move the switch from XFD to OFF."},{"t":"step","lvl":1,"n":"1","text":"With no power (BATT – OFF) on the helicopter, place fuel selector switch for the #1 Engine in DIRECT and XFD."},{"t":"step","lvl":2,"n":"a","text":"Verify that the switch activates by listening for the valve to move."},{"t":"step","lvl":2,"n":"b","text":"Verify that each position has positive lock."},{"t":"step","lvl":2,"n":"c","text":"Verify that the switch can be moved from XFD to DIRECT with only forward pressure and vice versa."},{"t":"step","lvl":2,"n":"d","text":"Verify that the switch CANNOT be moved from XFD to OFF with ONLY aft pressure."},{"t":"step","lvl":1,"n":"2","text":"Repeat for #2 Engine."}]},{"id":"1.3","chapter":"1","title":"STANDBY ATTITUDE INDICATOR","page":2,"blocks":[{"t":"step","lvl":1,"n":"1","text":"With no power (BATT – OFF) on the helicopter, push the EMER PWR pushbutton next to the standby attitude indicator."},{"t":"step","lvl":2,"n":"a","text":"Verify that the ARM and EMER PWR lights illuminate."},{"t":"step","lvl":2,"n":"b","text":"Verify that the beeping tone is heard in the cockpit."},{"t":"step","lvl":2,"n":"c","text":"Verify that the BATTERY TEST light illuminates."},{"t":"step","lvl":1,"n":"2","text":"Push the EMER PWR pushbutton."},{"t":"step","lvl":2,"n":"a","text":"Verify that the ARM and EMER PWR lights extinguish."},{"t":"step","lvl":2,"n":"b","text":"Verify that the beeping tone is silent."},{"t":"step","lvl":2,"n":"c","text":"Verify that the BATTERY TEST light extinguishes."}]},{"id":"1.4","chapter":"1","title":"BATTERY CHECKS","page":2,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Select BATT – ON."},{"t":"step","lvl":2,"n":"a","text":"Verify that only the pilot inboard and outboard MFDs are powered."},{"t":"step","lvl":2,"n":"b","text":"Verify internal communication among the pilot, copilot, external, forward ramp, and aft ramp positions are functional."},{"t":"step","lvl":2,"n":"c","text":"Verify that the copilot’s RTU is powered."},{"t":"step","lvl":2,"n":"d","text":"Verify that the #1 communication radio is functional."},{"t":"step","lvl":1,"n":"2","text":"Rotate the TEST FIRE DET switch to the INBD position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the master FIRE warning light illuminates on the pilot’s master warning panel."},{"t":"step","lvl":2,"n":"b","text":"Verify that FIRE #1 ENG, FIRE #2 ENG and FIRE APU lights illuminate on the FIRE/ARM pushbuttons."},{"t":"step","lvl":1,"n":"3","text":"Rotate the TEST FIRE DET switch to the NORM position."},{"t":"step","lvl":1,"n":"4","text":"Push the EMER PWR pushbutton next to the standby attitude indicator."},{"t":"step","lvl":2,"n":"a","text":"Verify that the ARM and EMER PWR lights illuminate."},{"t":"step","lvl":2,"n":"b","text":"Verify that the beeping tone is heard in the cockpit."},{"t":"step","lvl":2,"n":"c","text":"Verify that the BATTERY TEST light illuminates."},{"t":"step","lvl":2,"n":"d","text":"Verify that the standby airspeed, standby altimeter, standby attitude and standby compass lighting illuminates."},{"t":"step","lvl":1,"n":"5","text":"Push and hold the BATTERY TEST light for at least 5 seconds."},{"t":"step","lvl":2,"n":"a","text":"Verify that the GOOD light illuminates."},{"t":"step","lvl":2,"n":"b","text":"Verify that the BATTERY TEST light remains illuminated."},{"t":"step","lvl":2,"n":"c","text":"Verify that the EMER PWR and ARM lights are illuminated."},{"t":"step","lvl":2,"n":"d","text":"Verify that the beeping tone is silent."},{"t":"step","lvl":2,"n":"e","text":"Verify that the standby airspeed, standby altimeter, standby attitude and standby compass lighting extinguishes."},{"t":"step","lvl":1,"n":"6","text":"Release the BATTERY TEST light."},{"t":"step","lvl":2,"n":"a","text":"Verify that the GOOD light extinguishes."},{"t":"step","lvl":2,"n":"b","text":"Verify that the BATTERY TEST light remains illuminated."},{"t":"step","lvl":2,"n":"c","text":"Verify that the ARM and EMER PWR lights remain illuminated."},{"t":"step","lvl":2,"n":"d","text":"Verify that the beeping tone is heard."},{"t":"step","lvl":2,"n":"e","text":"Verify that the standby airspeed, standby altimeter, standby attitude and standby compass lighting illuminates."},{"t":"step","lvl":1,"n":"7","text":"Erect the gyro by pulling the PULL TO CAGE knob."},{"t":"step","lvl":2,"n":"a","text":"Verify that the gyro is erect with the attitude of the helicopter."},{"t":"step","lvl":2,"n":"b","text":"Verify that the red OFF flag disappears."},{"t":"step","lvl":1,"n":"8","text":"Cage the gyro by pulling PULL TO CAGE lever and then rotating it clockwise."},{"t":"step","lvl":2,"n":"a","text":"Verify that the red OFF flag is visible."},{"t":"step","lvl":1,"n":"9","text":"Push the EMER PWR pushbutton."},{"t":"step","lvl":2,"n":"a","text":"Verify that all the lights extinguish."},{"t":"step","lvl":2,"n":"b","text":"Verify that the beeping tone is silent."}]},{"id":"1.5","chapter":"1","title":"SEATBELT AND SHOULDER HARNESS","page":3,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Attach the pilot’s seat belts and shoulder harness."},{"t":"step","lvl":2,"n":"a","text":"Verify that they are properly installed and easily adjusted."},{"t":"step","lvl":1,"n":"2","text":"Activate the inertia reel lock."},{"t":"step","lvl":2,"n":"a","text":"Verify that the lock releases."},{"t":"step","lvl":2,"n":"b","text":"Verify that the inertial lock engages with a quick pull of the shoulder harness."},{"t":"step","lvl":1,"n":"3","text":"Repeat for copilot’s position."}]},{"id":"1.6","chapter":"1","title":"SEAT ADJUSTMENT","page":4,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Adjust the pilot seat through full range of travel both fore and aft, and up and down."},{"t":"step","lvl":2,"n":"a","text":"Verify that the seat moves smoothly."},{"t":"step","lvl":2,"n":"b","text":"Verify that the seats lock in position at any increment of travel when the levers are released."},{"t":"step","lvl":1,"n":"2","text":"Repeat for copilot’s seat."}]},{"id":"1.7","chapter":"1","title":"TAIL ROTOR PEDAL ADJUSTMENT","page":4,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Pull the pilot pedals PED ADJ handle."},{"t":"step","lvl":2,"n":"a","text":"Verify that the pedals travel full range."},{"t":"step","lvl":2,"n":"b","text":"Verify that the lock holds the pedals at different positions throughout the full range."},{"t":"step","lvl":1,"n":"2","text":"With feet lightly on the pedals, verify that the pilot pedals travel to the full aft position when the PED ADJ is pulled due to spring action."},{"t":"step","lvl":1,"n":"3","text":"Repeat for copilot’s pedals."}]},{"id":"1.8","chapter":"1","title":"THROTTLE QUADRANT","page":4,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Move the #1 ENGINE THROTTLE through full range."},{"t":"step","lvl":2,"n":"a","text":"Verify that the THROTTLE moves smoothly with some friction but does not bind."},{"t":"step","lvl":2,"n":"b","text":"Verify that friction holds the THROTTLE in position when released."},{"t":"step","lvl":2,"n":"c","text":"Verify that the IDLE and FLY detents engage positively."},{"t":"step","lvl":2,"n":"d","text":"Verify that the THROTTLE must be pushed in when moving aft out of the FLY position."},{"t":"step","lvl":2,"n":"e","text":"Verify that the THROTTLE must be pushed in when moving from IDLE to STOP."},{"t":"step","lvl":1,"n":"2","text":"Repeat for #2 ENGINE THROTTLE."}]},{"id":"1.9","chapter":"1","title":"PLACARDS","page":5,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Verify that the placard above the copilot’s inboard MFD reads as follows:"},{"t":"p","text":"THIS HELICOPTER MUST BE OPERATED IN ACCORDANCE WITH THE OPERATING LIMITS SPECIFIED IN THE FAA APPROVED ROTORCRAFT FLIGHT MANUAL. THE AIRWORTHINESS LIMITATIONS SECTION OF THE ROTORCRAFT MAINTENANCE MANUAL MUST BE COMPLIED WITH. . . .","lvl":1},{"t":"step","lvl":1,"n":"2","text":"Verify that a radio call placard is installed on the instrument panel."},{"t":"step","lvl":1,"n":"3","text":"Verify that an MGB Pump Failed placard is installed on the instrument panel."},{"t":"step","lvl":1,"n":"4","text":"Verify that the standby compass calibration card is installed and filled out."},{"t":"step","lvl":1,"n":"5","text":"Verify that the two AHRS compass calibration cards are installed and filled out."}]},{"id":"1.10","chapter":"1","title":"EXTERNAL POWER","page":5,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Verify that the helicopter can accept AC power."},{"t":"step","lvl":1,"n":"2","text":"Verify that the helicopter can accept DC power."}]},{"id":"1.11","chapter":"1","title":"APU START","page":5,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Verify that the MAINT COMP FAIL caution light is NOT illuminated."},{"t":"step","lvl":1,"n":"2","text":"Place the APU CONTR switch to the ON position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the APU advisory light is illuminated when the APU is running normally."},{"t":"step","lvl":1,"n":"3","text":"Place the APU GEN switch to the ON position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the following advisory lights are illuminated on the EICAS:"},{"t":"p","text":"APU ON","lvl":2},{"t":"p","text":"APU GEN ON","lvl":2},{"t":"p","text":"APU ACCUM LOW (until APU accumulator is charged)","lvl":2},{"t":"p","text":"PRIME PUMP ON","lvl":2},{"t":"p","text":"HYD GRD PUMP ON","lvl":2},{"t":"p","text":"PARKING BRAKE (if set)","lvl":2},{"t":"p","text":"HYD 3 HI MODE","lvl":2},{"t":"p","text":"CHECK STATUS","lvl":2},{"t":"step","lvl":2,"n":"b","text":"Verify that only the #3 hydraulic pressure indicator is in the green range (if the ground pump is ON)."}]},{"id":"1.12","chapter":"1","title":"PARKING BRAKE","page":6,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Release the parking brake by depressing the pilot’s brake pedals."},{"t":"step","lvl":2,"n":"a","text":"Verify that the PARKING BRAKE handle moves full down."},{"t":"step","lvl":2,"n":"b","text":"Verify that the PARKING BRAKE advisory light is extinguished."},{"t":"step","lvl":1,"n":"2","text":"Without depressing the brake pedals, pull up on the PARKING BRAKE."},{"t":"step","lvl":2,"n":"a","text":"Verify that the handle does NOT move."},{"t":"step","lvl":2,"n":"b","text":"Verify that the PARKING BRAKE advisory light is extinguished."},{"t":"step","lvl":1,"n":"3","text":"Reset the brakes by depressing the pedals and pulling the brake handle to full up."},{"t":"step","lvl":2,"n":"a","text":"Verify that the PARKING BRAKE advisory light is illuminated."},{"t":"step","lvl":1,"n":"4","text":"Repeat for copilot position."}]},{"id":"1.13","chapter":"1","title":"ROTOR BRAKE","page":6,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Place rotor brake ON."},{"t":"step","lvl":2,"n":"a","text":"Verify that the minimum pressure on the gage is 450 psi."},{"t":"step","lvl":2,"n":"b","text":"Verify that the ROTOR BRAKE caution light is illuminated."},{"t":"step","lvl":1,"n":"2","text":"Release the rotor brake."},{"t":"step","lvl":2,"n":"a","text":"Verify that the pressure is zero."},{"t":"step","lvl":2,"n":"b","text":"Verify that the ROTOR BRAKE caution light is extinguished."}]},{"id":"1.14","chapter":"1","title":"HUMS","page":6,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Press HLTH hard bezel."},{"t":"step","lvl":1,"n":"2","text":"Select HUMS."},{"t":"step","lvl":1,"n":"3","text":"Insert HUMS Data Transfer Memory Unit (DTMU) into the Data Transfer Unit mounted on the right hand avionics rack."},{"t":"step","lvl":2,"n":"a","text":"Verify that DTMU is accepted by noting on the MFD the percent of the card used."},{"t":"step","lvl":1,"n":"4","text":"Select ADMIN→DATE CHANGE→ENTR."},{"t":"step","lvl":2,"n":"a","text":"Verify the correct date."},{"t":"step","lvl":1,"n":"5","text":"If date is incorrect, use INCR, DECR, LEFT, RIGHT and ENTER to set the correct date."},{"t":"step","lvl":1,"n":"6","text":"Select ADMIN→TIME CHANGE→ENTR."},{"t":"step","lvl":2,"n":"a","text":"Verify the correct time."},{"t":"step","lvl":1,"n":"7","text":"If time is incorrect, use INCR, DECR, LEFT, RIGHT and ENTER to set the correct time."},{"t":"step","lvl":1,"n":"8","text":"Select ADMIN→ACFT CONFIG→ENTR."},{"t":"step","lvl":2,"n":"a","text":"Verify the aircraft model and serial number."},{"t":"step","lvl":1,"n":"9","text":"If aircraft model is incorrect, enter S-92A using INCR, DECR, LEFT, RIGHT and ENTER."},{"t":"step","lvl":1,"n":"10","text":"If aircraft serial number is incorrect, enter the correct serial number as 920XXX (i.e., 920057) using INCR, DECR, LEFT, RIGHT and ENTER."}]},{"id":"1.15","chapter":"1","title":"CLOCK","page":7,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Verify the clock indicates the correct local and UTC time."},{"t":"step","lvl":1,"n":"2","text":"Set clock if necessary."},{"t":"step","lvl":1,"n":"3","text":"In either GMT or LT mode, press and hold the SEL button."},{"t":"step","lvl":2,"n":"a","text":"Verify that the display test indicates ″8888″."},{"t":"step","lvl":1,"n":"4","text":"Select the FT (flight time) mode."},{"t":"step","lvl":1,"n":"5","text":"While in the FT mode, press and hold the CTL button."},{"t":"step","lvl":2,"n":"a","text":"Verify that the display indicates ″9959″."},{"t":"step","lvl":1,"n":"6","text":"Release the CTL button."},{"t":"step","lvl":2,"n":"a","text":"Verify that the display will reset to ″0000″."},{"t":"step","lvl":1,"n":"7","text":"Select the ET (elapsed time) mode."},{"t":"step","lvl":1,"n":"8","text":"Press the CTL button."},{"t":"step","lvl":2,"n":"a","text":"Verify that the timer counts in seconds."},{"t":"step","lvl":1,"n":"9","text":"Press the CTL button."},{"t":"step","lvl":2,"n":"a","text":"Verify that the timer resets to ″0000″."}]},{"id":"1.16","chapter":"1","title":"AIRCRAFT CONFIGURATION","page":8,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Select the UTIL bezel key on the MFD."},{"t":"step","lvl":1,"n":"2","text":"Select the CONFIG bezel key."},{"t":"step","lvl":1,"n":"3","text":"Select the ACFT bezel key."},{"t":"step","lvl":2,"n":"a","text":"Verify that the CONFIG page represents the actual configuration of the helicopter."}]},{"id":"1.17","chapter":"1","title":"FLIGHT MANAGEMENT SYSTEM","page":8,"blocks":[{"t":"note","text":"ADC, DME and VOR navigation sensors are selected when the helicopter becomes airborne."},{"t":"step","lvl":1,"n":"1","text":"Select UNS-1 ON/OFF DIM button ON."},{"t":"step","lvl":2,"n":"a","text":"Verify that all FMS built in tests pass."},{"t":"step","lvl":2,"n":"b","text":"Confirm INIT 1/1 screen comes on after PASS indications for each subsystem."},{"t":"step","lvl":2,"n":"c","text":"Verify that the FMS navigation database is current."},{"t":"step","lvl":1,"n":"2","text":"Select any MSG and note discrepancies."},{"t":"step","lvl":1,"n":"3","text":"Select DATA 2/4."},{"t":"step","lvl":2,"n":"a","text":"Verify that the ADC, DME and VOR are DESEL (D)."},{"t":"step","lvl":1,"n":"4","text":"Select GNSS1 or SBAS."},{"t":"step","lvl":2,"n":"a","text":"Confirm FMS receiving satellites."},{"t":"step","lvl":1,"n":"5","text":"Check the Bright/Dim functions."},{"t":"step","lvl":1,"n":"6","text":"Initialize the FMS to the present location."}]},{"id":"1.18","chapter":"1","title":"MULTIFUNCTION FLIGHT DISPLAYS","page":9,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Verify that the slip ball on each MFD is centered with the helicopter level."},{"t":"step","lvl":1,"n":"2","text":"Select the LUM control on each MFD."},{"t":"step","lvl":2,"n":"a","text":"Verify that the display can be adjusted from full bright to dark."},{"t":"step","lvl":1,"n":"3","text":"Select the PFD, NAV, EICAS, HLTH, and UTIL hard bezels on each MFD."},{"t":"step","lvl":2,"n":"a","text":"Verify appropriate displays are available on each MFD."},{"t":"step","lvl":1,"n":"4","text":"Select the PFD display on each MFD."},{"t":"step","lvl":1,"n":"5","text":"Select FULL, COMP, ARC, CAT A and HOVER (if available) soft bezels."},{"t":"step","lvl":2,"n":"a","text":"Verify appropriate displays are available on each MFD."},{"t":"step","lvl":1,"n":"6","text":"Select NAV hard bezel on each MFD."},{"t":"step","lvl":1,"n":"7","text":"Select FULL and ARC."},{"t":"step","lvl":2,"n":"a","text":"Verify appropriate displays are available on each MFD."}]},{"id":"1.19","chapter":"1","title":"SLEW CONTROLLER","page":9,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Select the NAV display on the pilot’s MFD."},{"t":"step","lvl":1,"n":"2","text":"Move the thumb switch on the pilot’s Slew Controller."},{"t":"step","lvl":2,"n":"a","text":"Verify that the cursor on the NAV display moves with the thumb switch."},{"t":"step","lvl":2,"n":"b","text":"Verify that the Latitude/Longitude of the cursor appears on the MFD."},{"t":"step","lvl":1,"n":"3","text":"Activate the index finger hook button on the Slew Controller to send the hook position to the FMS."},{"t":"step","lvl":1,"n":"4","text":"Select DTO→LIST on the FMS."},{"t":"step","lvl":2,"n":"a","text":"Verify that the hook position is stored as a waypoint (Rx) at the top of the LIST."},{"t":"step","lvl":1,"n":"5","text":"Repeat with the copilot’s MFD and Slew Controller."}]},{"id":"1.20","chapter":"1","title":"DISPLAY CONTROL PANEL","page":9,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Rotate the pilot BRG 1 and 2 knobs from OFF, ADF, NAV and LNAV."},{"t":"step","lvl":2,"n":"a","text":"Verify that the bearing pointer on the pilot PFD changes and information is displayed on HSI."},{"t":"step","lvl":1,"n":"2","text":"Rotate REF SET knob through different settings:"},{"t":"step","lvl":2,"n":"a","text":"HVR RA"},{"t":"step","lvl":2,"n":"b","text":"BARO"},{"t":"step","lvl":2,"n":"c","text":"ALTP"},{"t":"step","lvl":2,"n":"d","text":"MIN"},{"t":"step","lvl":2,"n":"e","text":"RA"},{"t":"step","lvl":2,"n":"f","text":"TDP"},{"t":"step","lvl":2,"n":"g","text":"VTDP"},{"t":"step","lvl":1,"n":"3","text":"Pull up and rotate inner REF SET knob; ensure HVR RA, BARO, ALTP, MIN, RA, TDP and VTDP display changes on the PFD and CAT A display."},{"t":"step","lvl":1,"n":"4","text":"Rotate RANGE control knob."},{"t":"step","lvl":2,"n":"a","text":"Verify that the range on the PFD ARC, NAV FULL and NAV ARC displays change."},{"t":"step","lvl":1,"n":"5","text":"Select the CP/SC button."},{"t":"step","lvl":2,"n":"a","text":"Verify that the attitude display changes from cross pointer to single cue."},{"t":"step","lvl":1,"n":"6","text":"Select the NAV button."},{"t":"step","lvl":2,"n":"a","text":"Verify that the appropriate navigation source is displayed on bottom right side of PFD."},{"t":"step","lvl":1,"n":"7","text":"Select the LNAV button."},{"t":"step","lvl":2,"n":"a","text":"Verify that the appropriate LNAV navigation source is displayed on bottom right side of PFD."},{"t":"step","lvl":1,"n":"8","text":"Select the PREV button (3 times) while in LNAV mode."},{"t":"step","lvl":2,"n":"a","text":"Verify that the VOR 1, VOR 2 and P-ILS data appears within a dashed box above the LNAV navigation source label."},{"t":"step","lvl":1,"n":"9","text":"Select the LBS/KG button."},{"t":"step","lvl":2,"n":"a","text":"Verify that the fuel quantity toggles between LBS and KG."},{"t":"step","lvl":1,"n":"10","text":"Select the hPa/In Hg button."},{"t":"step","lvl":2,"n":"a","text":"Verify that the barometric altimeter setting toggles between hPa and in Hg."},{"t":"step","lvl":1,"n":"11","text":"Repeat for copilot Display Control Panel (DCP)."}]},{"id":"1.21","chapter":"1","title":"REMOTE INSTRUMENT CONTROLLER","page":11,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Select NAV and VOR as source."},{"t":"step","lvl":1,"n":"2","text":"Rotate COURSE 1 knob."},{"t":"step","lvl":2,"n":"a","text":"Verify that course changes on PFD in HSI mode."},{"t":"step","lvl":1,"n":"3","text":"Center course 1 by pushing the COURSE 1 knob."},{"t":"step","lvl":2,"n":"a","text":"Verify that the #1 Course indicator centers if a navigation source is being received."},{"t":"step","lvl":1,"n":"4","text":"Repeat for COURSE 2."},{"t":"step","lvl":1,"n":"5","text":"Rotate HEADING knob."},{"t":"step","lvl":2,"n":"a","text":"Verify that the heading bug moves."},{"t":"step","lvl":2,"n":"b","text":"Verify that the new heading is digitally displayed on upper left side of HSI."},{"t":"step","lvl":1,"n":"6","text":"Press the top of the HEADING knob."},{"t":"step","lvl":2,"n":"a","text":"Verify that the heading synchronizes to present heading."},{"t":"step","lvl":2,"n":"b","text":"Verify that the digital heading disappears in approximately 5 seconds."}]},{"id":"1.22","chapter":"1","title":"REVERSION CONTROL PANEL","page":11,"blocks":[{"t":"note","text":"Yellow text indicates that the cross side source is driving the display."},{"t":"note","text":"White text indicates that the on side source is driving the display."},{"t":"note","text":"A Yellow Box around the text indicates that a reversion mode has been selected."},{"t":"step","lvl":1,"n":"1","text":"Place AHRS switch from NORM to 1."},{"t":"step","lvl":2,"n":"a","text":"Verify that AHRS 1 reversion annunciation is displayed in yellow on the pilot PFD (off side) and displayed in white on the copilot PFD (on side), each within a yellow box."},{"t":"step","lvl":1,"n":"2","text":"Place AHRS switch from NORM to 2."},{"t":"step","lvl":2,"n":"a","text":"Verify that AHRS 2 reversion annunciation is displayed in yellow on the copilot PFD (off side) and displayed in white on the pilot PFD (on side), each within a yellow box."},{"t":"step","lvl":1,"n":"3","text":"Select AHRS NORM."},{"t":"step","lvl":2,"n":"a","text":"Verify that the AHRS reversion annunciations are removed from the PFDs."},{"t":"step","lvl":1,"n":"4","text":"Place the ADC switch from NORM to 1."},{"t":"step","lvl":2,"n":"a","text":"Verify that ADC 1 reversion annunciation is displayed in white on the copilot PFD (on side) and displayed in yellow on the pilot PFD (off side), each within a yellow box."},{"t":"step","lvl":1,"n":"5","text":"Place the ADC switch from NORM to 2."},{"t":"step","lvl":2,"n":"a","text":"Verify that ADC 2 reversion annunciation is displayed in yellow on the copilot PFD (off side) and displayed in white on the pilot PFD (on side), each within a yellow box."},{"t":"step","lvl":1,"n":"6","text":"Select ADC NORM."},{"t":"step","lvl":2,"n":"a","text":"Verify that the ADC reversion annunciations are removed from the PFDs."},{"t":"step","lvl":1,"n":"7","text":"Place DCU switch from NORM to 1."},{"t":"step","lvl":2,"n":"a","text":"Verify that DCU 1 reversion annunciation is displayed in yellow on the pilot PFD (off side) and displayed in white on the copilot PFD (on side), each within a yellow box."},{"t":"step","lvl":1,"n":"8","text":"Place DCU switch from NORM to 2."},{"t":"step","lvl":2,"n":"a","text":"Verify that DCU 2 reversion annunciation is displayed in white on the pilot PFD (on side) and displayed in yellow on the copilot PFD (off side), each within a yellow box."},{"t":"step","lvl":1,"n":"9","text":"Select DCU NORM."},{"t":"step","lvl":2,"n":"a","text":"Verify that DCU reversion annunciations are removed from the PFDs."}]},{"id":"1.23","chapter":"1","title":"MFD REVERSION","page":12,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Select PFD on pilot and copilot outboard MFDs."},{"t":"step","lvl":1,"n":"2","text":"Select non-PFD pages on pilot and copilot inboard MFDs."},{"t":"step","lvl":1,"n":"3","text":"Turn off the pilot MFD by pulling the following circuit breakers:"},{"t":"step","lvl":2,"n":"a","text":"PLT MFD OBD – BATT HOLD UP Bus (overhead circuit breaker panel)."},{"t":"step","lvl":2,"n":"b","text":"PLT OBD MFD – DC ESSENTIAL Bus (pilot circuit breaker panel)."},{"t":"step","lvl":2,"n":"c","text":"Verify that the inboard pilot MFD automatically changes to the PFD."},{"t":"step","lvl":1,"n":"4","text":"Turn off the copilot MFD by pulling the following circuit breakers:"},{"t":"step","lvl":2,"n":"a","text":"C/P OBD MFD – NO. 1 DC PRI Bus (copilot circuit breaker panel)."},{"t":"step","lvl":2,"n":"b","text":"C/P OBD MFD – NO. 2 DC PRI Bus (pilot circuit breaker panel)."},{"t":"step","lvl":2,"n":"c","text":"Verify that the inboard copilot MFD automatically changes to the PFD."}]},{"id":"1.24","chapter":"1","title":"CAUTION/ADVISORY CHECK","page":13,"blocks":[{"t":"note","text":"Caution light order may vary slightly depending on power up conditions and bus reporting sequencing."},{"t":"step","lvl":1,"n":"1","text":"Select EICAS page in the cockpit."},{"t":"step","lvl":1,"n":"2","text":"Select SHOW OBE soft bezel key."},{"t":"step","lvl":2,"n":"a","text":"Verify that the following warning and caution lights are illuminated, if applicable:"},{"t":"table","rows":[["AC GEN 1 FAIL","MGB OIL PRES","AC GEN 2 FAIL"],["HYD 1 PUMP FAIL","MGB OIL OUT","HYD 2 PUMP FAIL"],["MGB PUMP 1 FAIL","","MGB PUMP 2 FAIL"],["ENG 1 OIL PRES","","ENG 2 OIL PRES"],["ENG 1 FUEL PRES","","ENG 2 FUEL PRES"]]},{"t":"step","lvl":2,"n":"b","text":"If the ground pump is not activated, verify that the following additional caution lights are illuminated:"},{"t":"table","rows":[["","BOOST PRES","HYD 3 PUMP FAIL"],["SAS 1 PRES","MR 1 SVO PRES","SAS 2 PRES"],["","MR 2 SVO PRES",""],["","TR SVO 1 PRES",""],["","TR SVO 2 PRES",""]]},{"t":"step","lvl":1,"n":"3","text":"Select HIDE OBE soft bezel key."},{"t":"step","lvl":2,"n":"a","text":"Verify that the above cautions are hidden."}]},{"id":"1.25","chapter":"1","title":"AIRCRAFT GROSS WEIGHT","page":13,"blocks":[{"t":"note","text":"A CHECK AGW advisory light will illuminate after takeoff if the pilots have not selected the AGW display. Selecting the display will extinguish the advisory light."},{"t":"note","text":"Pilots’ and passenger weights are entered as PASSENGER WEIGHT."},{"t":"note","text":"AGW data is stored in both DCUs. DCU #1 is the master. If DCU #1 is replaced, AGW data will need to be re-entered. If DCU #2 is replaced, DCU #1 will automatically update DCU #2."},{"t":"step","lvl":1,"n":"1","text":"Press UTIL hard bezel."},{"t":"step","lvl":1,"n":"2","text":"Select AGW."},{"t":"step","lvl":2,"n":"a","text":"Verify the basic weight and make corrections as required."},{"t":"step","lvl":2,"n":"b","text":"Verify that fuel weight corresponds with fuel gages."},{"t":"step","lvl":1,"n":"3","text":"Input the correct pilot, passenger and cargo weights."}]},{"id":"1.26","chapter":"1","title":"FIRE DETECTION TEST","page":14,"blocks":[{"t":"note","text":"When engine cowlings are open, a valid test may not be possible."},{"t":"note","text":"Once the VOICE CNCL button is pushed, the aural alert system will continue to speak until the current sentence is finished."},{"t":"note","text":"Either ″ENGINE #1″ or ″ENGINE #2″ may be the first aural alert heard during the test."},{"t":"step","lvl":1,"n":"1","text":"Rotate the FIRE DET switch from NORM to INBD."},{"t":"step","lvl":2,"n":"a","text":"Verify that the pilot and copilot master FIRE warning lights illuminate."},{"t":"step","lvl":2,"n":"b","text":"Verify that the FIRE #1 ENG, FIRE #2 ENG and APU pushbutton lights illuminate."},{"t":"step","lvl":2,"n":"c","text":"Verify that ″FIRE ENGINE ONE,″ ″FIRE ENGINE TWO″ and ″FIRE APU″ aural alerts are heard through the ICS."},{"t":"step","lvl":1,"n":"2","text":"Rotate the FIRE DET switch to NORM and wait for all the warning lights to extinguish."},{"t":"step","lvl":1,"n":"3","text":"Rotate the FIRE DET switch from NORM to OUTBD."},{"t":"step","lvl":2,"n":"a","text":"Verify that the pilot and copilot master FIRE warning lights illuminate."},{"t":"step","lvl":2,"n":"b","text":"Verify that the FIRE #1 ENG and FIRE #2 ENG pushbutton lights illuminate."},{"t":"step","lvl":2,"n":"c","text":"Verify that ″FIRE ENGINE ONE″ and ″FIRE ENGINE TWO″ aural alerts are heard through the ICS."},{"t":"step","lvl":1,"n":"4","text":"Rotate the FIRE DET switch from OUTBD to SMOKE."},{"t":"step","lvl":2,"n":"a","text":"Verify that the SMOKE IN BAGGAGE warning illuminates on the EICAS page."},{"t":"step","lvl":2,"n":"b","text":"Verify that ″SMOKE IN BAGGAGE″ aural alert is heard through the ICS."},{"t":"step","lvl":1,"n":"5","text":"Rotate the FIRE DET switch to NORM."}]},{"id":"1.27","chapter":"1","title":"FIRE EXTINGUISHER TEST","page":15,"blocks":[{"t":"note","text":"The APU and #1 engine are tested together and the #1 and #2 engines are tested together."},{"t":"note","text":"The complete test can be conducted using AC external power without the APU or engines running."},{"t":"note","text":"With only the APU running, the #1 engine and #2 engine can be tested."},{"t":"note","text":"With the #2 engine running and the Main Generators online, the APU and #1 engine can be tested."},{"t":"step","lvl":1,"n":"1","text":"With the APU ON and the #1 and #2 engines not running, place the fuel control switches to DIR."},{"t":"step","lvl":2,"n":"a","text":"Verify that the green EICAS fuel lines are connected to the appropriate tanks and engines."},{"t":"step","lvl":1,"n":"2","text":"Place the fuel control switches to XFD."},{"t":"step","lvl":2,"n":"a","text":"Verify that the green EICAS fuel lines are connected to the appropriate tanks and engines."},{"t":"step","lvl":1,"n":"3","text":"Press the FIRE #1 ENG and FIRE #2 ENG guarded buttons on the fire control panel."},{"t":"step","lvl":2,"n":"a","text":"Verify that the ARM light illuminates on #1 engine and #2 engine buttons."},{"t":"step","lvl":2,"n":"b","text":"Verify that the EICAS fuel lines indicate OFF (disappear) to #1 engine and #2 engine."},{"t":"step","lvl":1,"n":"4","text":"Select the FIRE EXTG test switch to OPEN."},{"t":"step","lvl":2,"n":"a","text":"Verify that the WARN light on the FIRE EXTG TEST panel (next to the switch) illuminates."},{"t":"step","lvl":1,"n":"5","text":"Activate the fire extinguisher select switch to the MAIN position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the TEST light on the FIRE EXTG TEST panel illuminates."},{"t":"step","lvl":1,"n":"6","text":"Activate the fire extinguisher select switch to the RESERVE position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the TEST light on the FIRE EXTG TEST panel illuminates."},{"t":"step","lvl":1,"n":"7","text":"Place the FIRE EXTG test switch to SHORT."},{"t":"step","lvl":2,"n":"a","text":"Verify that the WARN light and the TEST light on the FIRE EXTG TEST panel illuminate."},{"t":"step","lvl":1,"n":"8","text":"Activate the fire extinguisher select switch to MAIN position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the WARN and TEST lights on the FIRE EXTG TEST panel remain illuminated."},{"t":"step","lvl":1,"n":"9","text":"Activate the fire extinguisher select switch to RESERVE position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the WARN and TEST lights on the FIRE EXTG TEST panel remain illuminated."},{"t":"step","lvl":1,"n":"10","text":"Place the FIRE EXTG switch to NORM."},{"t":"step","lvl":2,"n":"a","text":"Verify that the WARN and TEST lights extinguish."},{"t":"step","lvl":1,"n":"11","text":"Depress both FIRE #1 engine and FIRE #2 engine guarded buttons on the fire control panel."},{"t":"step","lvl":2,"n":"a","text":"Verify that the ARM light extinguishes on #1 engine and #2 engine buttons."},{"t":"step","lvl":2,"n":"b","text":"Verify that green EICAS fuel lines appear on the EICAS."},{"t":"step","lvl":1,"n":"12","text":"With only the #2 engine running and the main generators on line, repeat the test for APU and the #1 engine."}]},{"id":"1.28","chapter":"1","title":"ICS","page":16,"blocks":[{"t":"note","text":"The EMER function on the ICS control allows the pilot and copilot a direct (hard) line to the #1 Radio. Internal ICS is inoperative when EMER is selected."},{"t":"note","text":"The EMER function is only operational at the pilot and copilot positions."},{"t":"note","text":"The pilot’s audio controller controls what the forward ramp and aft ramp ICS stations monitors."},{"t":"note","text":"The copilot’s audio controller controls what the external ICS station monitors."},{"t":"note","text":"The right cabin audio controller controls what the left cabin ICS station monitors (if installed)."},{"t":"step","lvl":1,"n":"1","text":"Activate the pilot’s audio controller."},{"t":"step","lvl":2,"n":"a","text":"Verify VOL control."},{"t":"step","lvl":2,"n":"b","text":"Verify cyclic switch operations."},{"t":"step","lvl":2,"n":"c","text":"Verify VOX operations."},{"t":"step","lvl":2,"n":"d","text":"Verify HOT operations."},{"t":"step","lvl":2,"n":"e","text":"Verify foot switch operations."},{"t":"step","lvl":2,"n":"f","text":"Verify EMER operations."},{"t":"step","lvl":2,"n":"g","text":"Verify that the forward and aft ramp ICS stations monitor the pilot’s audio selections."},{"t":"step","lvl":1,"n":"2","text":"Repeat for the copilot’s audio controller."},{"t":"step","lvl":2,"n":"a","text":"Verify that the external ICS station monitors the copilot’s audio selections."},{"t":"step","lvl":1,"n":"3","text":"Repeat for the right cabin audio controller."},{"t":"step","lvl":2,"n":"a","text":"Verify that the left cabin ICS station monitors the right cabin audio selections."}]},{"id":"1.29","chapter":"1","title":"LIGHTS","page":17,"blocks":[{"t":"h","id":"1.29.1","text":"LANDING LIGHT"},{"t":"step","lvl":1,"n":"1","text":"Place the LANDING NO 1 switch to ON."},{"t":"step","lvl":2,"n":"a","text":"Verify the left landing light illuminates."},{"t":"step","lvl":1,"n":"2","text":"Place the LANDING NO 2 switch to ON."},{"t":"step","lvl":2,"n":"a","text":"Verify the right landing light illuminates."},{"t":"step","lvl":1,"n":"3","text":"Place LANDING NO 1 and NO 2 switches to OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that both landing lights extinguish."},{"t":"h","id":"1.29.2","text":"CONTROLLABLE SEARCHLIGHT"},{"t":"step","lvl":1,"n":"1","text":"Place both the pilot’s and copilot’s SRCHLT switches on the collective to OFF."},{"t":"step","lvl":1,"n":"2","text":"Place the pilot’s SRCHLT switch on the collective to ON."},{"t":"step","lvl":2,"n":"a","text":"Verify that the searchlight illuminates."},{"t":"step","lvl":1,"n":"3","text":"Extend, retract and swivel the searchlight using the SRCHLT SLEW controller on the collective."},{"t":"step","lvl":2,"n":"a","text":"Verify that the searchlight rotates through 360° and moves forward through a 120° arc from the stowed position."},{"t":"step","lvl":1,"n":"4","text":"Place the pilot’s SRCHLT switch on the collective to STOW."},{"t":"step","lvl":2,"n":"a","text":"Verify that the searchlight stows in proper position."},{"t":"step","lvl":1,"n":"5","text":"Place the pilot’s SRCHLT switch on the collective to OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that the searchlight extinguishes."},{"t":"step","lvl":1,"n":"6","text":"Repeat with the copilot’s switches."},{"t":"h","id":"1.29.3","text":"ANTI-COLLISION LIGHTS"},{"t":"step","lvl":1,"n":"1","text":"Place the ANTI COLL UPPER switch to ON."},{"t":"step","lvl":2,"n":"a","text":"Verify that the upper Anti-Collision light illuminates."},{"t":"step","lvl":1,"n":"2","text":"Place the ANTI COLL LWR switch to ON."},{"t":"step","lvl":2,"n":"a","text":"Verify that the lower Anti-Collision light illuminates."},{"t":"step","lvl":1,"n":"3","text":"Place both ANTI COLL switches to OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that the Anti-Collision lights extinguish."},{"t":"h","id":"1.29.4","text":"POSITION LIGHTS"},{"t":"step","lvl":1,"n":"1","text":"Place the POSN switch to ON."},{"t":"step","lvl":2,"n":"a","text":"Verify that the red (left), green (right) and white (tail) position lights illuminate."},{"t":"step","lvl":1,"n":"2","text":"Place the POSN switch to OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that the three position lights extinguish."},{"t":"h","id":"1.29.5","text":"COCKPIT LIGHTS CONTROL PANEL"},{"t":"step","lvl":1,"n":"1","text":"Rotate all the cockpit light controls (BACK-UP IND, INSTR PNL, CONSOLE SIDE/OVHD/LWR, P/B DIMMER and FLOOD) on the overhead COCKPIT LIGHTS panel from OFF to BRT."},{"t":"step","lvl":2,"n":"a","text":"Verify that the lights illuminate."},{"t":"step","lvl":2,"n":"b","text":"Verify that the lights go from bright to dim."},{"t":"h","id":"1.29.6","text":"PUSHBUTTON AND DIMMING LAMP TEST"},{"t":"step","lvl":1,"n":"1","text":"Rotate the P/B DIMMER to OFF."},{"t":"step","lvl":1,"n":"2","text":"Hold the P/B LAMP switch to TEST."},{"t":"step","lvl":1,"n":"3","text":"Verify the following illuminate:"},{"t":"step","lvl":2,"n":"a","text":"All pushbuttons on the AFCS control panel."},{"t":"step","lvl":2,"n":"b","text":"All 4 landing gear control panel lights and 2 filaments per light."},{"t":"step","lvl":2,"n":"c","text":"All lights on both master warning panels."},{"t":"step","lvl":2,"n":"d","text":"The 3 ARMED lights only on the engine fire control panel."},{"t":"step","lvl":2,"n":"e","text":"The IAS, ALT, HDG, and STBY lights on both mode select panels."},{"t":"step","lvl":2,"n":"f","text":"The ARMED, TEST and 2 L/R lights on the flotation control panel if installed."},{"t":"step","lvl":2,"n":"g","text":"The ARMED, TEST and L/R lights on the life raft panel if installed."},{"t":"step","lvl":2,"n":"h","text":"The ARMED, OFF, EXT PWR, GOOD and BATTERY TEST lights on the standby attitude indicator control."},{"t":"step","lvl":1,"n":"4","text":"Release the P/B LAMP switch."},{"t":"step","lvl":2,"n":"a","text":"Verify that the lights extinguish."},{"t":"step","lvl":2,"n":"b","text":"Note the audio ″DECOUPLE″ on the ICS."},{"t":"step","lvl":1,"n":"5","text":"Rotate the P/B DIMMER from OFF to BRT."},{"t":"step","lvl":2,"n":"a","text":"Verify that the above lights dim and brighten."},{"t":"step","lvl":1,"n":"6","text":"Rotate to the OFF position."},{"t":"h","id":"1.29.7","text":"BAGGAGE COMPARTMENT LIGHTS"},{"t":"step","lvl":1,"n":"1","text":"Place the BAG COMP switch to ON."},{"t":"step","lvl":2,"n":"a","text":"Verify the baggage compartment light illuminates."},{"t":"step","lvl":1,"n":"2","text":"Place the BAG COMP switch to CREW."},{"t":"step","lvl":1,"n":"3","text":"On the auxiliary light control panel have the crew select BAG COMP ON."},{"t":"step","lvl":2,"n":"a","text":"Verify the baggage compartment light illuminates."},{"t":"step","lvl":1,"n":"4","text":"Place all baggage compartment lighting switches OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify the baggage compartment light extinguishes."},{"t":"h","id":"1.29.8","text":"CARGO LOADING LIGHT"},{"t":"step","lvl":1,"n":"1","text":"Place the CARGO LOAD switch to ON."},{"t":"step","lvl":2,"n":"a","text":"Verify the cargo loading light illuminates."},{"t":"step","lvl":1,"n":"2","text":"Place the CARGO LOAD switch to CREW."},{"t":"step","lvl":1,"n":"3","text":"On the auxiliary light control panel have the crew select CARGO LOAD ON."},{"t":"step","lvl":2,"n":"a","text":"Verify that the cargo loading light illuminates."},{"t":"step","lvl":1,"n":"4","text":"Place all CARGO LOAD switches to OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that the cargo loading light extinguishes."},{"t":"h","id":"1.29.9","text":"HEELS LIGHTING"},{"t":"step","lvl":1,"n":"1","text":"Place the HEELS switch to ON."},{"t":"step","lvl":2,"n":"a","text":"Verify that the pilot and copilot cockpit HEELS lights illuminate."},{"t":"step","lvl":1,"n":"2","text":"Place the HEELS switch to OFF."},{"t":"step","lvl":2,"n":"a","text":"Verify that the pilot and copilot cockpit HEELS lights extinguish."},{"t":"h","id":"1.29.10","text":"EXTERNAL EMERGENCY LIGHTS"},{"t":"step","lvl":1,"n":"1","text":"Have the crew select OFF on the cabin control panel."},{"t":"step","lvl":1,"n":"2","text":"Place the EXT EMERG switch to ON."},{"t":"step","lvl":2,"n":"a","text":"Verify all six white external emergency lights illuminate."},{"t":"step","lvl":1,"n":"3","text":"Place the EXT EMERG switch to ARM."},{"t":"step","lvl":2,"n":"a","text":"Verify all six white external emergency lights extinguish."},{"t":"step","lvl":1,"n":"4","text":"On the cabin control panel, have crew select ON."},{"t":"step","lvl":2,"n":"a","text":"Verify all six white external emergency lights illuminate."},{"t":"step","lvl":1,"n":"5","text":"Place the cabin control panel switch to OFF."},{"t":"step","lvl":1,"n":"6","text":"Place the EXT EMERG switch to OFF."},{"t":"h","id":"1.29.11","text":"UTILITY LIGHTS"},{"t":"step","lvl":1,"n":"1","text":"On the pilot’s utility light, rotate the intensity from OFF-DIM to BRIGHT."},{"t":"step","lvl":2,"n":"a","text":"Verify the light illuminates and goes from dim to bright."},{"t":"step","lvl":1,"n":"2","text":"Change the light pattern from FLOOD to SPOT."},{"t":"step","lvl":1,"n":"3","text":"Change the light color from RED to WHITE."},{"t":"step","lvl":1,"n":"4","text":"Press the Morse Code button."},{"t":"step","lvl":2,"n":"a","text":"Verify the light illuminates at full intensity when the button is pressed."},{"t":"step","lvl":1,"n":"5","text":"Rotate the intensity to OFF."},{"t":"step","lvl":1,"n":"6","text":"Repeat for copilot’s utility light."}]},{"id":"1.30","chapter":"1","title":"PITOT-STATIC AND OAT","page":22,"blocks":[{"t":"h","id":"1.30.1","text":"BAROMETRIC ALTIMETER"},{"t":"step","lvl":1,"n":"1","text":"Obtain the current barometric altimeter setting from an outside source."},{"t":"step","lvl":1,"n":"2","text":"Adjust the standby altimeter to the current altimeter setting."},{"t":"step","lvl":1,"n":"3","text":"Input the current setting into the pilot and copilot MFD via the DCP by selecting BARO and adjusting the set knob."},{"t":"step","lvl":2,"n":"a","text":"Verify that all three helicopter’s altimeters are within 70 feet of field elevation."},{"t":"step","lvl":2,"n":"b","text":"Verify that the pilot, copilot and standby altimeters are within 50 feet of one another."},{"t":"h","id":"1.30.2","text":"VERTICAL VELOCITY INDICATOR"},{"t":"step","lvl":1,"n":"1","text":"Verify that the pilot and copilot VVI indicates zero vertical velocity when the helicopter is stationary on the ground."},{"t":"h","id":"1.30.3","text":"AIRSPEED INDICATORS"},{"t":"note","text":"The airspeed indicators will indicate approximately 28 KIAS on the ground with no wind."},{"t":"step","lvl":1,"n":"1","text":"Verify that the pilot and copilot PFDs display a valid airspeed."},{"t":"step","lvl":1,"n":"2","text":"Verify that the backup airspeed indicator displays a valid airspeed."},{"t":"h","id":"1.30.4","text":"OAT GAGE"},{"t":"note","text":"The OAT sensors for the ADC are located under the helicopter. The OAT sensors for the FADEC are located near the engine inlets. The temperature between the top and bottom of the helicopter may vary slightly."},{"t":"step","lvl":1,"n":"1","text":"Obtain an OAT from an outside source."},{"t":"step","lvl":2,"n":"a","text":"Verify that the OAT displayed on the pilot and copilot PFDs are ±1°C from the outside source."},{"t":"step","lvl":2,"n":"b","text":"Verify that the OAT displayed on the EPAC page is ±1°C from the outside source."}]},{"id":"1.31","chapter":"1","title":"VHF RADIO","page":23,"blocks":[{"t":"step","lvl":1,"n":"1","text":"From the pilot position, functionally check the #1 VHF radios with the tower."},{"t":"step","lvl":2,"n":"a","text":"Verify the cyclic switch is operational."},{"t":"step","lvl":2,"n":"b","text":"Verify the foot switch is operational."},{"t":"step","lvl":1,"n":"2","text":"Repeat for #2 VHF radio."},{"t":"step","lvl":1,"n":"3","text":"Repeat for copilot position."}]},{"id":"1.32","chapter":"1","title":"GUARD RADIO","page":23,"blocks":[{"t":"note","text":"Switch must be in NORMAL to transmit."},{"t":"step","lvl":1,"n":"1","text":"Select NO. 1 RADIO GUARD switch to GUARD, then NORMAL."},{"t":"step","lvl":2,"n":"a","text":"Verify that the #1 radio switches to 121.5."},{"t":"step","lvl":1,"n":"2","text":"Retune the #1 radio to the desired frequency."}]},{"id":"1.33","chapter":"1","title":"ENHANCED GROUND PROXIMITY WARNING SYSTEM","page":23,"blocks":[{"t":"note","text":"The FMS must be ON with a good current position to complete a valid EGPWS IBIT."},{"t":"note","text":"If ILS NAV is selected as the navigation source and the selected course is set for back course (B/C), the ″GLIDESLOPE″ aural alert will not activate during EGPWS IBIT."},{"t":"step","lvl":1,"n":"1","text":"Select PFD ARC on the pilot and copilot outboard MFDs."},{"t":"step","lvl":1,"n":"2","text":"Select NAV on the pilot’s inboard MFD."},{"t":"step","lvl":1,"n":"3","text":"Overlay the terrain on both the NAV and PFDs."},{"t":"step","lvl":1,"n":"4","text":"Select the HLTH page on the copilot inboard MFD."},{"t":"step","lvl":1,"n":"5","text":"Select AVIONICS, SUB STAT and EGPWS."},{"t":"step","lvl":1,"n":"6","text":"Press the IBIT bezel key on the left side of the MFD."},{"t":"step","lvl":2,"n":"a","text":"Verify that the amber EGPWS INOP and white TER TEST illuminate on the PFD and remain on for the duration of the test."},{"t":"step","lvl":2,"n":"b","text":"Verify that the white LOW ALT illuminates momentarily on the NAV page and PFD."},{"t":"step","lvl":2,"n":"c","text":"Verify that the ″GLIDESLOPE″ aural warning is annunciated in the headset."},{"t":"step","lvl":2,"n":"d","text":"Verify that the amber G/S CANCELLED illuminates momentarily on the NAV page and PFD ARC."},{"t":"step","lvl":2,"n":"e","text":"Verify that the ″PULL UP″ aural warning is annunciated in the headset."},{"t":"step","lvl":2,"n":"f","text":"Verify that the ″WARNING TERRAIN″ aural warning is annunciated in the headset."},{"t":"step","lvl":2,"n":"g","text":"Verify that the terrain display self-test pattern is displayed on the NAV page and the PFD ARC. The terrain display test pattern will be removed after several sweeps."},{"t":"step","lvl":2,"n":"h","text":"Verify that the GPWS-INOP and TER TEST labels are removed from the display at the completion of the test."},{"t":"step","lvl":2,"n":"i","text":"Verify that the TEST PASSED status is displayed on the HLTH page."}]},{"id":"1.34","chapter":"1","title":"COCKPIT VOICE RECORDER/FLIGHT DATA RECORDER","page":24,"blocks":[{"t":"note","text":"The CVR/FDR has an independent power supply that continues recording 10 minutes after loss of aircraft power. Therefore, the CVR/FDR will take 10 minutes to change status to INOPERATIONAL after initiating the test."},{"t":"step","lvl":1,"n":"1","text":"Select the HLTH page."},{"t":"step","lvl":1,"n":"2","text":"Select AVIONICS→SUB STAT→CVR/FDR."},{"t":"step","lvl":2,"n":"a","text":"Verify that the CVR/FDR status is OPERATIONAL."},{"t":"step","lvl":1,"n":"3","text":"Select IBIT."},{"t":"step","lvl":2,"n":"a","text":"Verify that the CVR/FDR status changes to TEST IN PROGRESS."},{"t":"step","lvl":2,"n":"b","text":"Verify that the CVR/FDR status changes to TEST PASS."},{"t":"step","lvl":2,"n":"c","text":"Verify that the CVR/FDR status changes to OPERATIONAL."},{"t":"step","lvl":1,"n":"4","text":"Select and momentarily hold IMRS on the CVR/FDR switch."},{"t":"step","lvl":2,"n":"a","text":"Verify that the CVR/FDR status changes to INOPERATIVE after 10 ±1 minutes."},{"t":"step","lvl":1,"n":"5","text":"Select OFF on the CVR/FDR switch."},{"t":"step","lvl":1,"n":"6","text":"Push the CVR/FDR RESET button for at least 2 seconds."},{"t":"step","lvl":2,"n":"a","text":"Verify that the CVR/FDR status changes to OPERATIONAL."},{"t":"step","lvl":1,"n":"7","text":"Select and momentarily hold INERTIA on the CVR/FDR switch."},{"t":"step","lvl":2,"n":"a","text":"Verify that the CVR/FDR status changes to INOPERATIVE after 10 ±1 minutes."},{"t":"step","lvl":1,"n":"8","text":"Select OFF on the CVR/FDR switch."},{"t":"step","lvl":1,"n":"9","text":"Push the CVR/FDR RESET button for at least 2 seconds."},{"t":"step","lvl":2,"n":"a","text":"Verify that the CVR/FDR status changes to OPERATIONAL."}]},{"id":"1.35","chapter":"1","title":"RADAR ALTIMETER","page":25,"blocks":[{"t":"note","text":"An altitude of more than ±5 feet on the ground will display OUT OF CAL as a CURR FAULT. The radar altimeter takes approximately 10 minutes to warm up and give the proper reading on the ground."},{"t":"step","lvl":1,"n":"1","text":"Select the HLTH page."},{"t":"step","lvl":1,"n":"2","text":"Select AVIONICS→SUB STAT→PAGE DOWN→RADALT 1."},{"t":"step","lvl":2,"n":"a","text":"Verify that the RADALT status is OPERATIONAL."},{"t":"step","lvl":1,"n":"3","text":"Select IBIT."},{"t":"step","lvl":2,"n":"a","text":"Verify that the RADALT status changes to TEST IN PROGRESS."},{"t":"step","lvl":2,"n":"b","text":"Verify that the radar altimeter display momentarily goes to 100 ft ±10 and two blue Ts display during the test."},{"t":"step","lvl":2,"n":"c","text":"Verify that the RADALT status changes to TEST PASSED."},{"t":"step","lvl":2,"n":"d","text":"Verify that the RADALT status changes to OPERATIONAL."},{"t":"step","lvl":1,"n":"4","text":"Repeat for RADALT 2, if installed."}]},{"id":"1.36","chapter":"1","title":"HYDRAULIC LEAK ISOLATION TEST","page":26,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Place the rotor brake ON."},{"t":"step","lvl":1,"n":"2","text":"Place the GND PUMP switch to ON."},{"t":"step","lvl":1,"n":"3","text":"Select the HLTH page."},{"t":"step","lvl":1,"n":"4","text":"Select HYDRAULICS."},{"t":"step","lvl":1,"n":"5","text":"Select LDI TEST."},{"t":"step","lvl":1,"n":"6","text":"On the HLTH page:"},{"t":"step","lvl":2,"n":"a","text":"Verify that the HYDRAULIC status changes to TEST IN PROCESS."},{"t":"step","lvl":2,"n":"b","text":"MFD will display various HYD failure indications."},{"t":"step","lvl":2,"n":"c","text":"Verify that the LDI indicated TEST PASSED."},{"t":"step","lvl":2,"n":"d","text":"Verify the HYDRAULIC status changes to OPERATIONAL."}]},{"id":"1.37","chapter":"1","title":"FLIGHT CONTROL LIMIT CHECK","page":26,"blocks":[{"t":"note","text":"This is a pilot’s ground flight control limit check. It is designed to verify that the controls hit the proper control stops or limiters. It does not replace the ground maintenance rigging check in the maintenance manuals. Each aircraft may be slightly different, but the movement of the flight controls as indicated in these procedures is a good indication that the control stops and limiters are set properly, that there are no unwanted restrictions to the flight controls and that the pilot has full range. However, these procedures do not completely verify that the aircraft is properly rigged."},{"t":"note","text":"The flight control system contains primary and secondary stops as well as limiters to restrict the range of motion of the swashplate and tail rotor servo. The cyclic stick stops are bolt stops located at the base of the pilot and copilot cyclic. The collective stick stops are bolt stops located at the base of the pilot and copilot collective. The yaw pedal stops are bolt stops located forward of the pilot and copilot pedals. The remaining stops are located and defined below:"},{"t":"table","rows":[["Channel","Primary Stop","Secondary Stop"],["Collective","High – Collective sticks","High – Mixer"],["","Low – Mixer","Low – Collective sticks"],["Pitch","Cyclic Stick","SAS/Boost output arm"],["Roll","Cyclic Stick","SAS/Boost output arm"],["Yaw","Fwd quadrant","Yaw pedals"]]},{"t":"note","text":"The two collective to pitch limiters are located in the mixer. These limiters restrict the pitch inputs at the rotor for the high and low collective positions."},{"t":"h","id":"1.37.1","text":"PEDALS"},{"t":"step","lvl":1,"n":"1","text":"Select GND PUMP ON."},{"t":"step","lvl":1,"n":"2","text":"Center cyclic."},{"t":"step","lvl":1,"n":"3","text":"Lower the collective full down."},{"t":"step","lvl":1,"n":"4","text":"Apply full left pedal."},{"t":"step","lvl":2,"n":"a","text":"The left pedal should contact the left bolt stop in the cockpit."},{"t":"step","lvl":1,"n":"5","text":"Center pedals."},{"t":"step","lvl":1,"n":"6","text":"Raise the collective full up."},{"t":"step","lvl":1,"n":"7","text":"Apply full right pedal."},{"t":"step","lvl":2,"n":"a","text":"The right pedal should contact the right bolt stop in the cockpit."},{"t":"step","lvl":1,"n":"8","text":"Center the pedals."},{"t":"step","lvl":2,"n":"a","text":"Verify that the pilots and copilots pedals are centered and matched."},{"t":"h","id":"1.37.2","text":"COLLECTIVE"},{"t":"step","lvl":1,"n":"1","text":"Center cyclic and pedals."},{"t":"step","lvl":1,"n":"2","text":"Lower the collective full down."},{"t":"step","lvl":2,"n":"a","text":"The collective should contact the collective mixer stop. However, with a little down pressure the system may deflect enough for the collective to contact the lower stick stop."},{"t":"step","lvl":1,"n":"3","text":"Raise the collective full up."},{"t":"step","lvl":2,"n":"a","text":"The collective should contact the collective upper stick stop."},{"t":"h","id":"1.37.3","text":"CYCLIC LONGITUDINAL"},{"t":"step","lvl":1,"n":"1","text":"Center cyclic and pedals."},{"t":"step","lvl":1,"n":"2","text":"Lower the collective to the full down position."},{"t":"step","lvl":1,"n":"3","text":"Move the cyclic to the full forward position and maintain slight forward pressure on the cyclic."},{"t":"step","lvl":1,"n":"4","text":"Slowly raise collective to full up."},{"t":"step","lvl":2,"n":"a","text":"Cyclic must move forward as the collective goes from bottom to mid position indicating operation of
