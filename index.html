scontinue the autorotation and land."},{"t":"caution","text":"Do not allow Nr to exceed 110% or go below 90% Nr during this check."},{"t":"caution","text":"Do not exceed 106.2% Np for more than 12 seconds."},{"t":"note","text":"To reduce the potential for Np or Nr overspeeds, select a collective setting (10%, 15%, or 20%) that will result in an Nr below 105% at the test AGW and density altitude. This will require retarding the throttles to achieve an autorotation state."},{"t":"h","id":"4.2.1","text":"GROUND RUN (ROTORS NOT TURNING)"},{"t":"step","lvl":1,"n":"1","text":"Select HLTH→HUMS→MAINT→PARAMS→ENTR→ANLG→ANLG2."},{"t":"step","lvl":1,"n":"2","text":"Raise collective full up."},{"t":"step","lvl":2,"n":"a","text":"Record collective position."},{"t":"step","lvl":1,"n":"3","text":"Lower collective full down."},{"t":"step","lvl":2,"n":"a","text":"Record collective position."},{"t":"step","lvl":1,"n":"4","text":"Determine the collective position number that corresponds to 10%, 15%, and 20% from the collective bottom by using the numbers determined during the ground run."},{"t":"p","text":"EXAMPLE:","lvl":2},{"t":"table","rows":[["Collective Up","55"],["Collective Down","-60"],["Range","115"],["10% (-60+11.5)","-48.5"],["15% (-60+17.25)","-42.75"],["20% (-60+23)","-37.0"]]},{"t":"h","id":"4.2.2","text":"FLIGHT CHECK"},{"t":"step","lvl":1,"n":"1","text":"Set barometric altimeter to 29.92."},{"t":"step","lvl":1,"n":"2","text":"Select HLTH→HUMS→MAINT→PARAMS→ENTR→ANLG→ANLG2."},{"t":"step","lvl":1,"n":"3","text":"Lower collective to establish 80 KIAS autorotation (airspeed hold may be used)."},{"t":"step","lvl":2,"n":"a","text":"Verify that Np 1 and Np 2 separate from Nr."},{"t":"step","lvl":1,"n":"4","text":"Retard throttles to obtain Np/Nr split, if required."},{"t":"step","lvl":1,"n":"5","text":"Set collective at 10%, 15%, or 20% to establish Nr between 90 – 110% Nr."},{"t":"step","lvl":1,"n":"6","text":"At check altitude, record Nr."},{"t":"step","lvl":1,"n":"7","text":"Return throttles to FLY."},{"t":"step","lvl":1,"n":"8","text":"Raise collective to recover from the autorotation."},{"t":"step","lvl":1,"n":"9","text":"Record OAT at check altitude."},{"t":"step","lvl":1,"n":"10","text":"Record aircraft gross weight, check altitude and collective setting used."},{"t":"step","lvl":1,"n":"11","text":"Calculate density altitude using pressure altitude (check altitude at 29.92), OAT, and Figure 1 in this FCP."},{"t":"step","lvl":1,"n":"12","text":"Using density altitude and aircraft gross weight, refer to the 10%, 15%, or 20% Autorotation Charts in this FCP to calculate acceptable Nr."},{"t":"step","lvl":1,"n":"13","text":"The maximum allowable difference between actual and chart Nr value is ±3%."}]},{"id":"4.3","chapter":"4","title":"LANDING GEAR CHECK","page":77,"blocks":[{"t":"step","lvl":1,"n":"1","text":"Place the LDG GEAR lever in the UP position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the landing gear retracts."},{"t":"step","lvl":2,"n":"b","text":"Verify that the landing gear position lights extinguish."},{"t":"step","lvl":1,"n":"2","text":"Place the LDG GEAR lever in the DN position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the landing gear extends."},{"t":"step","lvl":2,"n":"b","text":"Verify that the landing gear position lights illuminate green."}]},{"id":"4.4","chapter":"4","title":"FLIGHT ENGINE POWER ASSURANCE CHECK","page":77,"blocks":[{"t":"note","text":"TGT must be steady to avoid a FADEC ABORT. Hand flying might be steadier than coupled flight."},{"t":"note","text":"The minimum TGT margin for a new engine is 30°C."},{"t":"note","text":"The TGT margin for a removed and reinstalled engine should be the same margin as before the engine was removed."},{"t":"step","lvl":1,"n":"1","text":"Select CABIN and COCKPIT HEATER – OFF."},{"t":"step","lvl":1,"n":"2","text":"Select UTIL hard bezel on a MFD."},{"t":"step","lvl":1,"n":"3","text":"Select EPAC soft bezel."},{"t":"step","lvl":1,"n":"4","text":"Establish level flight at 120 TAS."},{"t":"step","lvl":1,"n":"5","text":"Select INIT #1."},{"t":"step","lvl":1,"n":"6","text":"Upon completion of test, select ACCEPT ENG 1 if PASSED (See Note)."},{"t":"step","lvl":2,"n":"a","text":"Verify data logged on EPAC page."},{"t":"step","lvl":1,"n":"7","text":"Select INIT #2."},{"t":"step","lvl":1,"n":"8","text":"Upon completion of test, select ACCEPT ENG 2 if PASSED (See Note)."},{"t":"step","lvl":2,"n":"a","text":"Verify data logged on EPAC page."}]},{"id":"4.5","chapter":"4","title":"AFCS FLIGHT CHECKS","page":78,"blocks":[{"t":"note","text":"AFCS checks should be performed in the smoothest possible flight conditions."},{"t":"h","id":"4.5.1","text":"AUTOPILOT – UNCOUPLED"},{"t":"step","lvl":1,"n":"1","text":"YAW, CYCLIC, and COLL TRIM – ON."},{"t":"step","lvl":1,"n":"2","text":"ATT, AP 2, SAS 2, and PRI – ON."},{"t":"step","lvl":1,"n":"3","text":"SAS 1 and PRI – ON."},{"t":"step","lvl":1,"n":"4","text":"AP 1 – OFF."},{"t":"step","lvl":1,"n":"5","text":"Establish 120 KIAS straight and level."},{"t":"step","lvl":1,"n":"6","text":"The steady state attitude/heading retention tolerances in smooth air is ±1° in pitch, roll, and heading."},{"t":"step","lvl":1,"n":"7","text":"Repeat with AP 1 – ON and AP 2 – OFF."},{"t":"h","id":"4.5.2","text":"AUTOPILOT – 2 CUE"},{"t":"h","id":"4.5.2.1","text":"STEEP TURNS"},{"t":"step","lvl":1,"n":"1","text":"YAW, CYCLIC, and COLL TRIM – ON."},{"t":"step","lvl":1,"n":"2","text":"ATT, AP2, SAS2, and PRI – ON."},{"t":"step","lvl":1,"n":"3","text":"SAS1 and PRI – ON."},{"t":"step","lvl":1,"n":"4","text":"AP 1 – OFF."},{"t":"step","lvl":1,"n":"5","text":"Establish 120 KIAS straight and level."},{"t":"step","lvl":1,"n":"6","text":"Select FD 2 on the AFCS control panel."},{"t":"step","lvl":1,"n":"7","text":"Select ALT and IAS on the pilot’s MODE SEL panel."},{"t":"step","lvl":1,"n":"8","text":"With feet off the pedals, roll the helicopter into a right 30° turn using the pilot’s cyclic beeper trim."},{"t":"step","lvl":1,"n":"9","text":"Make a 180° turn and note:"},{"t":"step","lvl":2,"n":"a","text":"The ball should stay within 1⁄2 ball width of the center during the turn."},{"t":"step","lvl":2,"n":"b","text":"The altitude should stay within ±50 ft."},{"t":"step","lvl":2,"n":"c","text":"The airspeed should stay within ±5 KIAS."},{"t":"step","lvl":1,"n":"10","text":"Using pilot’s cyclic trim, roll the helicopter to 0°."},{"t":"step","lvl":1,"n":"11","text":"With feet off the pedals, roll the helicopter into a left 30° turn against trim."},{"t":"step","lvl":1,"n":"12","text":"Make a 180° turn and note:"},{"t":"step","lvl":2,"n":"a","text":"The ball should stay within 1⁄2 ball width of the center during the turn."},{"t":"step","lvl":2,"n":"b","text":"The altitude should stay within ±50 ft."},{"t":"step","lvl":2,"n":"c","text":"The airspeed should stay within ±5 KIAS."},{"t":"step","lvl":1,"n":"13","text":"Roll the helicopter to 0°."},{"t":"step","lvl":1,"n":"14","text":"Decouple the autopilot by selecting STBY on the pilot’s MODE SEL panel; note the ″DECOUPLE″ aural alert."},{"t":"step","lvl":1,"n":"15","text":"Select AP 1 – ON and AP 2 – OFF."},{"t":"step","lvl":1,"n":"16","text":"Select FD1 on the AFCS control panel."},{"t":"step","lvl":1,"n":"17","text":"Repeat using copilot’s cyclic beeper trim and the copilot’s MODE SEL panel."},{"t":"h","id":"4.5.3","text":"VOR TRACKING"},{"t":"step","lvl":1,"n":"1","text":"Position the helicopter six to ten nautical miles from a VOR on a low altitude airway above the minimum enroute altitude."},{"t":"step","lvl":1,"n":"2","text":"Input VOR frequency into VOR 2."},{"t":"step","lvl":1,"n":"3","text":"Select VOR 2 as a navigation source on the pilot’s HSI."},{"t":"step","lvl":1,"n":"4","text":"Select YAW, CYCLIC, and COLL TRIM – ON."},{"t":"step","lvl":1,"n":"5","text":"Select ATT, AP 1, AP 2, SAS 1 and SAS 2, and PRIs – ON."},{"t":"step","lvl":1,"n":"6","text":"Establish 120 KIAS straight and level."},{"t":"step","lvl":1,"n":"7","text":"Select FD 2 on the AFCS control panel."},{"t":"step","lvl":1,"n":"8","text":"Press HDG PUSH TO SYNC on the remote instrument controller."},{"t":"step","lvl":1,"n":"9","text":"Select HDG and ALT on the pilots MODE SEL panel."},{"t":"step","lvl":1,"n":"10","text":"Set COURSE 2 to a radial 15° from the present radial."},{"t":"step","lvl":1,"n":"11","text":"With hands and feet off the controls, select a heading to intercept the course by rotating the heading control knob at least 45°."},{"t":"step","lvl":2,"n":"a","text":"Verify that the helicopter smoothly rolls into and out of the turn with no more than 2° of overshoot from the selected heading."},{"t":"step","lvl":2,"n":"b","text":"Verify the helicopter altitude retention is ±50 ft. from the selected altitude."},{"t":"step","lvl":2,"n":"c","text":"The roll attitude does not exceed 20°."},{"t":"step","lvl":1,"n":"12","text":"Select NAV on the pilot’s MODE SEL panel:"},{"t":"step","lvl":2,"n":"a","text":"Verify that NAV ARM is displayed on the MSP."},{"t":"step","lvl":2,"n":"b","text":"Verify that the helicopter executes an intercept when the CDI becomes active."},{"t":"step","lvl":2,"n":"c","text":"Verify that the intercept occurs with no more than one overshoot and no more than 20° angle of bank."},{"t":"step","lvl":2,"n":"d","text":"Verify that NAV CAP is displayed when the course is captured."},{"t":"step","lvl":1,"n":"13","text":"Track the inbound radial."},{"t":"step","lvl":2,"n":"a","text":"Verify that there is no lateral deviation greater than 1/3 dot."},{"t":"step","lvl":2,"n":"b","text":"Verify that the helicopter tracks smoothly."},{"t":"step","lvl":1,"n":"14","text":"Track the inbound radial over the VOR."},{"t":"step","lvl":2,"n":"a","text":"Verify that the helicopter tracks through station passage and transitions to the outbound radial."},{"t":"step","lvl":1,"n":"15","text":"Repeat using VOR 1, FD1, copilot’s MODE SEL panel and the COURSE 1."},{"t":"h","id":"4.5.4","text":"ALTITUDE MODE"},{"t":"step","lvl":1,"n":"1","text":"YAW, CYCLIC and COLL TRIM – ON."},{"t":"step","lvl":1,"n":"2","text":"ATT, AP 1, AP 2, SAS 1 and SAS 2, and PRIs – ON."},{"t":"step","lvl":1,"n":"3","text":"Establish 120 KIAS straight and level."},{"t":"step","lvl":1,"n":"4","text":"Engage HDG and ALT modes on the FD MODE SEL panel."},{"t":"step","lvl":2,"n":"a","text":"Confirm HDG and ALT ON light appear on the FD MODE SEL panel."},{"t":"step","lvl":2,"n":"b","text":"Verify that the altitude holds within ±50 feet at selected altitude."},{"t":"step","lvl":1,"n":"5","text":"On the DCP, rotate the REF SET knob to ALTP. Rotate the inner knob of the REF SET to select an altitude 500 feet above current altitude."},{"t":"step","lvl":2,"n":"a","text":"Confirm the selected altitude appears above the BARALT on the pilot PFD in white."},{"t":"step","lvl":1,"n":"6","text":"Engage ALTP on the pilot FD MODE SEL panel. Confirm the following:"},{"t":"step","lvl":2,"n":"a","text":"ALT light on the FD MODE SEL panel extinguishes."},{"t":"step","lvl":2,"n":"b","text":"ALTP ARM appears on the pilot FD MODE SEL panel."},{"t":"step","lvl":2,"n":"c","text":"VS ON is displayed on the pilot FD MODE SEL panel."},{"t":"step","lvl":2,"n":"d","text":"VS displayed in green on the pilot and copilot PFD next to the P label."},{"t":"step","lvl":2,"n":"e","text":"The selected climb rate is displayed both digitally and via a bug on the VSI."},{"t":"step","lvl":1,"n":"7","text":"Verify that the helicopter immediately starts a 500 fpm climb."},{"t":"step","lvl":1,"n":"8","text":"Confirm that vertical speed can be adjusted using the cyclic beeper trim."},{"t":"step","lvl":2,"n":"a","text":"The selected climb rate changes on the VSI."},{"t":"step","lvl":1,"n":"9","text":"At 300 feet prior to the preset altitude confirm:"},{"t":"step","lvl":2,"n":"a","text":"Aural alert sounds ″LEVEL OFF.″"},{"t":"step","lvl":1,"n":"10","text":"Approximately 100 feet prior to selected altitude (proportional to rate of climb or descent) confirm:"},{"t":"step","lvl":2,"n":"a","text":"ALTP ARM changes to ALTP CAP."},{"t":"step","lvl":2,"n":"b","text":"VS ON light extinguishes."},{"t":"step","lvl":2,"n":"c","text":"VS on pilot PFD is replaced by ALTP."},{"t":"step","lvl":1,"n":"11","text":"When altitude captures confirm:"},{"t":"step","lvl":2,"n":"a","text":"ALTP CAP light extinguishes."},{"t":"step","lvl":2,"n":"b","text":"ALT ON light on pilot FD MODE SEL panel."},{"t":"step","lvl":2,"n":"c","text":"ALT is displayed on pilot PFD."},{"t":"step","lvl":1,"n":"12","text":"Verify that the helicopter levels off within 50 feet of the selected altitude with no more than one overshoot."},{"t":"step","lvl":1,"n":"13","text":"Repeat using FD1 and copilot’s FD MODE SEL panel."},{"t":"h","id":"4.5.5","text":"AUTOPILOT – 3 CUE"},{"t":"h","id":"4.5.5.1","text":"ILS"},{"t":"note","text":"Course intercept should occur with no more than one overshoot and a maximum 22° commanded angle of bank at any point."},{"t":"step","lvl":1,"n":"1","text":"Position the helicopter six to ten nautical miles from an ILS station."},{"t":"step","lvl":1,"n":"2","text":"Select FD2 on the AFCS control panel."},{"t":"step","lvl":1,"n":"3","text":"Select NAV2, MIN and RA on the pilot display control panel."},{"t":"step","lvl":1,"n":"4","text":"Set a COURSE 2 and HEADING to intercept the ILS."},{"t":"step","lvl":1,"n":"5","text":"Engage IAS, ALT and HDG on the pilot FD MODE SEL panel."},{"t":"step","lvl":2,"n":"a","text":"Confirm proper indications on both FD MODE SEL panels and PFDs."},{"t":"note","text":"LOC must be armed or captured before selecting GS. GS must be armed or captured before selecting DCL. GS must be captured from below the GS. Adjusting airspeed after activating DCL will cancel that function and requires re-arming of DCL mode."},{"t":"step","lvl":1,"n":"6","text":"Select the APP hard bezel key on the FD MODE SEL panel."},{"t":"step","lvl":2,"n":"a","text":"Confirm ILS soft bezel key appears on the FD MODE SEL panel."},{"t":"step","lvl":2,"n":"b","text":"Select ILS soft bezel key on the FD MODE SEL panel."},{"t":"step","lvl":2,"n":"c","text":"Confirm APP ILS is displayed on the FD MODE SEL panel."},{"t":"step","lvl":1,"n":"7","text":"Select the LOC, GS and DCL soft bezel keys."},{"t":"step","lvl":2,"n":"a","text":"Confirm ARM appears in white for each mode (LOC, GS, DCL) on the FD MODE SEL panel."},{"t":"step","lvl":2,"n":"b","text":"Confirm that DCL, LOC and G/S are displayed in white under the P, R and C cues on the pilot PFD."},{"t":"step","lvl":1,"n":"8","text":"The helicopter will capture and fly the ILS. Confirm the following:"},{"t":"step","lvl":2,"n":"a","text":"Smooth capture of the localizer with no more than a 1⁄2 dot overshoot."},{"t":"step","lvl":2,"n":"b","text":"FD MODE SEL panel LOC turns from white ARM to green CAP."},{"t":"step","lvl":2,"n":"c","text":"HDG light on FD MODE SEL panel extinguishes."},{"t":"step","lvl":2,"n":"d","text":"HDG on PFD is replaced with green LOC."},{"t":"step","lvl":2,"n":"e","text":"The course deviation indicator on the HSI and the localizer indicator on the attitude indicator agree."},{"t":"step","lvl":2,"n":"f","text":"Marker beacon audio heard concurrently with OM displayed in blue on the PFD."},{"t":"step","lvl":2,"n":"g","text":"Smooth capture of the glideslope with no more than a 1⁄2 dot overshoot."},{"t":"step","lvl":2,"n":"h","text":"FD MODE SEL panel GS turns from white ARM to green CAP."},{"t":"step","lvl":2,"n":"i","text":"ALT light on FD MODE SEL panel extinguishes."},{"t":"step","lvl":2,"n":"j","text":"ALT on PFD is replaced with green G/S."},{"t":"step","lvl":2,"n":"k","text":"Deceleration from selected speed to 60 KIAS at 0.5 kts/sec."},{"t":"step","lvl":2,"n":"l","text":"FD MODE SEL panel DCL turns from white ARM to green CAP."},{"t":"step","lvl":2,"n":"m","text":"IAS on PFD is replaced with green DCL."},{"t":"step","lvl":2,"n":"n","text":"″MINIMUMS″ aural alert heard concurrently with MIN displayed in yellow on the PFD at the selected altitude (″EGPWS″ aural altitude alert)."},{"t":"step","lvl":2,"n":"o","text":"″ALTITUDE″ aural alert heard at the selected RA altitude (″EGPWS″ aural altitude alert)."},{"t":"note","text":"Auto level off and deceleration will not function unless the radar altimeter is on and providing a valid signal."},{"t":"step","lvl":2,"n":"p","text":"Helicopter levels off at 50 feet AGL while maintaining localizer and 60 KIAS. DCL is replaced with IAS on the PFD and MSP."},{"t":"step","lvl":1,"n":"9","text":"Select Go Around mode by pressing the GA button on the pilot cyclic. Confirm the following:"},{"t":"step","lvl":2,"n":"a","text":"Helicopter transitions to an 80 KIAS, 750 fpm climb on the last heading used to maintain localizer."},{"t":"step","lvl":2,"n":"b","text":"GA ON is displayed in green on both FD MODE SEL panel."},{"t":"step","lvl":2,"n":"c","text":"The pilot may then select HDG, IAS and VS or ALT at the desired values during GA."},{"t":"step","lvl":1,"n":"10","text":"Decouple by pressing the FD STBY button on the pilot cyclic."},{"t":"step","lvl":2,"n":"a","text":"Confirm the ″DECOUPLE″ aural alert is heard."},{"t":"h","id":"4.5.5.2","text":"P-ILS"},{"t":"step","lvl":1,"n":"1","text":"Position the helicopter to conduct an FMS approach to an airport with either a GPS or ILS approach."},{"t":"step","lvl":1,"n":"2","text":"Select FD1 on the AFCS control panel."},{"t":"step","lvl":1,"n":"3","text":"Create a flight plan on the FMS and add the desired FMS approach."},{"t":"step","lvl":1,"n":"4","text":"Select OVLY and then FPLN on the NAV display."},{"t":"step","lvl":2,"n":"a","text":"Verify that the FMS flight plan is overlaid on the NAV display."},{"t":"step","lvl":1,"n":"5","text":"Using the LNAV select key on the copilot DCP, select the FMS as the NAV source on the copilot PFD."},{"t":"step","lvl":1,"n":"6","text":"Set HEADING to intercept the flight plan track."},{"t":"step","lvl":1,"n":"7","text":"Engage IAS, ALT and HDG on the FD MODE SEL panel."},{"t":"step","lvl":1,"n":"8","text":"Confirm proper indications on the FD MODE SEL panel and PFD."},{"t":"step","lvl":1,"n":"9","text":"Select NAV on the copilot FD MODE SEL panel."},{"t":"step","lvl":2,"n":"a","text":"Confirm LNAV appears in green, replacing HDG on the FD MODE SEL panels."},{"t":"step","lvl":1,"n":"10","text":"Select P-ILS in a preview mode on the copilot PFD using the DCP."},{"t":"step","lvl":2,"n":"a","text":"Confirm P-ILS appears in white over the FMS selection."},{"t":"step","lvl":2,"n":"b","text":"Confirm P-ILS course is displayed in white dashed lines behind the selected FMS course on the copilot PFD."},{"t":"step","lvl":1,"n":"11","text":"Select the APP hard bezel key on the copilot FD MODE SEL panel."},{"t":"step","lvl":2,"n":"a","text":"Confirm ILS soft bezel key appears on the FD MODE SEL panel."},{"t":"step","lvl":1,"n":"12","text":"Select ILS soft bezel key on the FD MODE SEL panel."},{"t":"step","lvl":2,"n":"a","text":"Confirm APP P-ILS is displayed on the FD MODE SEL panel."},{"t":"note","text":"LOC must be armed or captured before selecting GS. GS must be captured from below the GS. GS must be armed or captured before selecting DCL. Adjusting airspeed after activating DCL will cancel that function and requires rearming the DCL mode."},{"t":"step","lvl":1,"n":"13","text":"Select the LOC, GS and DCL soft bezel keys."},{"t":"step","lvl":2,"n":"a","text":"Confirm ARM appears in white for each mode (LOC, GS and DCL) on the FD MODE SEL panel."},{"t":"step","lvl":2,"n":"b","text":"Confirm that PLOC and PG/S are displayed in white under the P, R and C cues on the pilot PFD."},{"t":"step","lvl":1,"n":"14","text":"The helicopter will capture and continue to fly the flight plan to include the initial portion of the basic FMS approach. Once the helicopter intercepts the P-ILS inbound course, the NAV mode will automatically switch from FMS to P-ILS and the helicopter will fly the P-ILS approach. Confirm the following:"},{"t":"step","lvl":2,"n":"a","text":"Smooth capture of the localizer with no more than a 1⁄2 dot overshoot."},{"t":"step","lvl":2,"n":"b","text":"FD MODE SEL panel LOC turns from white ARM to green CAP."},{"t":"step","lvl":2,"n":"c","text":"NAV light on FD MODE SEL panel extinguishes."},{"t":"step","lvl":2,"n":"d","text":"LNAV on PFD is replaced with yellow P-ILS."},{"t":"step","lvl":2,"n":"e","text":"The course deviation indicator on the HSI and the localizer indicator on the attitude indicator agree."},{"t":"step","lvl":2,"n":"f","text":"Smooth capture of the glideslope with no more than a 1⁄2 dot overshoot."},{"t":"step","lvl":2,"n":"g","text":"FD MODE SEL panel P-G/S turns from white ARM to green CAP."},{"t":"step","lvl":2,"n":"h","text":"ALT light on FD MODE SEL panel extinguishes."},{"t":"step","lvl":2,"n":"i","text":"ALT on PFD is replaced with green P-G/S."},{"t":"step","lvl":2,"n":"j","text":"″MINIMUMS″ aural alert is heard concurrently with MIN displayed in yellow on the PFD at the selected altitude (″EGPWS″ aural altitude alert)."},{"t":"step","lvl":2,"n":"k","text":"″ALTITUDE″ aural alert is heard at the selected RA altitude (″EGPWS″ aural altitude alert)."},{"t":"note","text":"Auto level off and deceleration will not function unless the radar altimeter is on and providing a valid signal."},{"t":"step","lvl":2,"n":"l","text":"Helicopter levels off at 50 feet AGL while maintaining localizer and 60 KIAS. DCL is replaced with IAS on the PFD and MSP."},{"t":"step","lvl":1,"n":"15","text":"Select Go Around mode by pressing the GA button on the pilot’s cyclic. Confirm the following:"},{"t":"step","lvl":2,"n":"a","text":"Helicopter transitions to an 80 KIAS, 750 fpm climb on the last heading used to maintain localizer."},{"t":"step","lvl":2,"n":"b","text":"GA ON is displayed in green on both FD MODE SEL panels."},{"t":"step","lvl":2,"n":"c","text":"The pilot may then select HDG, IAS and VS or ALT at the desired values during GA."},{"t":"step","lvl":1,"n":"16","text":"Decouple by pressing the FD STBY button on the copilot cyclic."},{"t":"step","lvl":2,"n":"a","text":"Confirm the ″DECOUPLE″ aural alert is heard."}]},{"id":"4.6","chapter":"4","title":"ENHANCED GROUND PROXIMITY WARNING SYSTEM","page":87,"blocks":[{"t":"h","id":"4.6.1","text":"ALTITUDE AURAL WARNINGS"},{"t":"note","text":"The ″ONE HUNDRED″ aural warning is a hard altitude warning."},{"t":"step","lvl":1,"n":"1","text":"Using the DCP, set MIN to 500 feet above landing zone."},{"t":"step","lvl":1,"n":"2","text":"Set RA to 250 feet AGL."},{"t":"step","lvl":1,"n":"3","text":"Conduct an approach to landing from greater than 650 feet AGL."},{"t":"step","lvl":2,"n":"a","text":"Verify that the aural warning ″MINIMUMS″ is heard on the ICS as the helicopter passes through the preset MIN ±10%."},{"t":"step","lvl":2,"n":"b","text":"Verify that the aural warning ″ALTITUDE″ is heard on the ICS as the helicopter passes through the preset RA ±10%."},{"t":"step","lvl":2,"n":"c","text":"Verify that the aural warning ″ONE HUNDRED″ is heard on the ICS as the helicopter passes through 100 ±10 feet."},{"t":"h","id":"4.6.2","text":"LANDING GEAR WARNINGS"},{"t":"note","text":"The helicopter needs to initially be above 400 AGL to activate the aural alert."},{"t":"step","lvl":1,"n":"1","text":"With the gear up and at an altitude above 150 feet AGL, slow below 60 KIAS."},{"t":"step","lvl":2,"n":"a","text":"Verify that no gear warning is heard."},{"t":"step","lvl":1,"n":"2","text":"Descend below 150 feet."},{"t":"step","lvl":2,"n":"a","text":"Verify that the red LNDG GEAR lights on both master warning panels illuminate."},{"t":"step","lvl":2,"n":"b","text":"Verify that the aural ″TOO LOW GEAR″ alert is heard."},{"t":"step","lvl":2,"n":"c","text":"Verify that each PFD displays GEAR."},{"t":"step","lvl":1,"n":"3","text":"Lower the landing gear."},{"t":"step","lvl":2,"n":"a","text":"Verify that the red UNLKD light on the landing gear panel illuminates while the landing gear is in transition."},{"t":"step","lvl":2,"n":"b","text":"Verify that the three green lights on the landing gear panel illuminate."},{"t":"step","lvl":2,"n":"c","text":"Verify that the red LNDG GEAR lights on the master warning panels extinguish."},{"t":"h","id":"4.6.3","text":"TERRAIN DISPLAY"},{"t":"note","text":"Refer to the EGPWS pilot manual for appropriate display color band and density definitions."},{"t":"step","lvl":1,"n":"1","text":"Select NAV display."},{"t":"step","lvl":1,"n":"2","text":"Select OVLY."},{"t":"step","lvl":1,"n":"3","text":"Select TER."},{"t":"step","lvl":1,"n":"4","text":"Select a display range of 2.5 to 25 nm on the DCP."},{"t":"step","lvl":2,"n":"a","text":"Verify that the terrain is displayed."},{"t":"step","lvl":2,"n":"b","text":"Verify that the terrain display pattern colors and densities change as the helicopter climbs or descends."},{"t":"h","id":"4.6.4","text":"OBSTACLE WARNING"},{"t":"note","text":"GPS look ahead modes are disabled under 70 KIAS."},{"t":"note","text":"The ″WARNING OBSTACLE″ aural alert will activate when the helicopter is within 20 seconds of flight time from the obstacle."},{"t":"step","lvl":1,"n":"1","text":"Configure cockpit MFDs so that no EGPWS overlay is displayed anywhere in the cockpit."},{"t":"step","lvl":1,"n":"2","text":"Select a local target obstacle such as a radio tower."},{"t":"step","lvl":1,"n":"3","text":"Position the helicopter 4-5 nm from the target obstacle."},{"t":"step","lvl":1,"n":"4","text":"Fly toward the obstacle at a ground speed greater than 70 KIAS and at an altitude lower than the target obstacle."},{"t":"step","lvl":1,"n":"5","text":"At approximately 30 seconds of flight time from the target obstacle:"},{"t":"step","lvl":2,"n":"a","text":"Verify that an MFD automatically displays a terrain display on a NAV page."},{"t":"step","lvl":2,"n":"b","text":"Verify that the terrain display range is automatically set to 5 nm."},{"t":"step","lvl":2,"n":"c","text":"Verify that the amber OBSTACLE is displayed on the PFD."},{"t":"step","lvl":2,"n":"d","text":"Verify that the aural warning ″CAUTION OBSTACLE″ is heard."},{"t":"step","lvl":2,"n":"e","text":"Verify that approximately 7 seconds after the initial aural alert, a second ″CAUTION OBSTACLE″ aural warning is heard."}]},{"id":"4.7","chapter":"4","title":"VH CHECK","page":89,"blocks":[{"t":"note","text":"In certain high hot conditions, a TGT limit of 935°C may be reached before the 86% torque limit."},{"t":"note","text":"In certain very cold conditions, a corrected Ng or fuel flow limit may be reached before the 86% torque limit."},{"t":"step","lvl":1,"n":"1","text":"Fly the helicopter straight and level and set engine torque 86%."},{"t":"step","lvl":2,"n":"a","text":"Verify that Nr is set to 105% Nr."},{"t":"step","lvl":2,"n":"b","text":"Verify that the hydraulic, main gear box and engine instruments on the EICAS page are in the green."},{"t":"step","lvl":2,"n":"c","text":"Verify that the aircraft exhibits no unusual vibration."},{"t":"step","lvl":2,"n":"d","text":"Verify that #1 and #2 torques are matched within 5%."},{"t":"step","lvl":1,"n":"2","text":"Select IAS and ALT on an AFCS MODE SEL panel."},{"t":"step","lvl":1,"n":"3","text":"Using the cyclic trim switch, increase desired airspeed to 155 KIAS."},{"t":"step","lvl":2,"n":"a","text":"Verify that engine torque is limited to 86% before the selected airspeed is achieved."},{"t":"step","lvl":1,"n":"4","text":"Deselect IAS and ALT and hand fly the helicopter."},{"t":"step","lvl":1,"n":"5","text":"Adjust power to maintain Vh."},{"t":"step","lvl":2,"n":"a","text":"Verify at least two inches of forward cyclic remain between the cyclic and the instrument panel."}]},{"id":"5.1","chapter":"5","title":"TCAS","page":90,"blocks":[{"t":"h","id":"5.1.1","text":"GROUND"},{"t":"step","lvl":1,"n":"1","text":"Select NAV on an inboard MFD."},{"t":"step","lvl":1,"n":"2","text":"Select TCAS overlay."},{"t":"step","lvl":1,"n":"3","text":"Set the display range ring to 5nm using the DCP."},{"t":"step","lvl":1,"n":"4","text":"Select the HLTH→AVIONICS→SUB STAT→TCAS on another MFD."},{"t":"step","lvl":2,"n":"a","text":"Verify that the status is OPERATIONAL."},{"t":"step","lvl":1,"n":"5","text":"Press the IBIT bezel key on the left side of the MFD."},{"t":"step","lvl":2,"n":"a","text":"Verify that the status changes to TEST IN PROGRESS."},{"t":"step","lvl":2,"n":"b","text":"Verify that the TCAS-TEST is indicated on the MFD."},{"t":"step","lvl":2,"n":"c","text":"Verify that these 3 targets appear on the NAV display:"},{"t":"p","text":"#1 – Traffic Advisory (yellow circle) will appear at 9 o’clock, range 2 miles, 200 feet below and climbing.","lvl":3},{"t":"p","text":"#2 – Proximity Traffic (solid cyan diamond) will appear at 1 o’clock, range 3.6 miles, 1000 feet below and descending.","lvl":3},{"t":"p","text":"#3 – Non-Threat Traffic (open cyan diamond) will appear at 11 o’clock, range 3.6 miles, flying level 1000 feet above.","lvl":3},{"t":"step","lvl":2,"n":"d","text":"Verify that the ″TCAS SYSTEM TEST OK″ aural alert is heard on the ICS."},{"t":"step","lvl":2,"n":"e","text":"Verify that the status changes to OPERATIONAL at the completion of the test."},{"t":"h","id":"5.1.2","text":"FLIGHT"},{"t":"note","text":"Display symbology is delineated in the Flight Manual."},{"t":"note","text":"Should TCAS 1 predict that certain safe boundaries might be violated, it will issue a Traffic Advisory as an aural alert and a display alert."},{"t":"note","text":"Depending upon TCAS I sensitivity level, TCAS I will issue a Traffic Advisory when time to closest point of approach is 15 to 30 seconds."},{"t":"step","lvl":1,"n":"1","text":"At altitude, select NAV on an MFD."},{"t":"step","lvl":1,"n":"2","text":"Select OVLY."},{"t":"step","lvl":1,"n":"3","text":"Select TCAS."},{"t":"step","lvl":1,"n":"4","text":"Select CTL to activate TCAS controls."},{"t":"step","lvl":1,"n":"5","text":"Select BAND then NORM."},{"t":"step","lvl":2,"n":"a","text":"Verify that TCAS INOP is not displayed on the MFD."},{"t":"step","lvl":1,"n":"6","text":"Using targets of opportunity, monitor aircraft traffic."},{"t":"step","lvl":2,"n":"a","text":"Verify proper symbology for intruder aircraft."},{"t":"step","lvl":2,"n":"b","text":"If possible, verify that intruder aircraft are not ghosted."},{"t":"step","lvl":2,"n":"c","text":"If possible, verify that no phantom aircraft are displayed."},{"t":"step","lvl":2,"n":"d","text":"If possible, verify that the aural alert ″TRAFFIC TRAFFIC″ is heard when an intruder aircraft is near and closing."},{"t":"step","lvl":2,"n":"e","text":"If possible, verify that the MFD displays TRAFFIC when an intruder aircraft is near and closing."}]},{"id":"5.2","chapter":"5","title":"FLOTATION","page":91,"blocks":[{"t":"warning","text":"To avoid possible injury in the event of inadvertent float deployment, clear the area around the nose, sponson (if installed) and tail floats prior to this test. All steps must be followed in sequence."},{"t":"h","id":"5.2.1","text":"ORIGINAL FLOTATION CONTROL PANEL"},{"t":"note","text":"This procedure is applicable to the original flotation control panel in accordance with the Rotorcraft Flight Manual, Part 1."},{"t":"caution","text":"To avoid possible injury in the event of inadvertent deployment, clear the area around the nose and tail floats prior to this test."},{"t":"step","lvl":1,"n":"1","text":"Primary FLOTATION toggle switch – TEST."},{"t":"step","lvl":2,"n":"a","text":"Confirm float ARMED (amber) and TEST (green) lights not illuminated."},{"t":"step","lvl":1,"n":"2","text":"FLOTATION TEST rotary switch – PRI."},{"t":"step","lvl":2,"n":"a","text":"Confirm float TEST (green) light illuminated."},{"t":"caution","text":"Continue test only if the green TEST light is illuminated."},{"t":"step","lvl":1,"n":"3","text":"AUX FLOTATION toggle switch – ARM."},{"t":"step","lvl":2,"n":"a","text":"Confirm float ARMED (amber) light not illuminated."},{"t":"step","lvl":2,"n":"b","text":"Confirm float TEST (green) light remains illuminated."},{"t":"caution","text":"Continue test only if the green TEST light is illuminated and neither L/R indicators are illuminated. Illumination of any L/R indicators may be an indication of a faulty immersion switch. With the ARMED (amber) light illuminated, a faulty immersion switch may cause immediate float deployment."},{"t":"step","lvl":1,"n":"4","text":"Pilot collective EMER FLOATS – Push."},{"t":"step","lvl":2,"n":"a","text":"Confirm the two L and two R (green) lights illuminated."},{"t":"step","lvl":1,"n":"5","text":"Copilot collective EMER FLOATS – Push."},{"t":"step","lvl":2,"n":"a","text":"Confirm the two L and two R (green) lights illuminated."},{"t":"step","lvl":1,"n":"6","text":"FLOTATION TEST rotary switch – SEC."},{"t":"step","lvl":2,"n":"a","text":"Confirm float ARMED (amber) light remains not illuminated."},{"t":"step","lvl":2,"n":"b","text":"Confirm the TEST (green) light remains illuminated."},{"t":"step","lvl":1,"n":"7","text":"Pilot collective EMER FLOATS – Push."},{"t":"step","lvl":2,"n":"a","text":"Confirm the two L and two R (green) lights illuminated."},{"t":"step","lvl":1,"n":"8","text":"Copilot collective EMER FLOATS – Push."},{"t":"step","lvl":2,"n":"a","text":"Confirm the two L and two R (green) lights illuminated."},{"t":"step","lvl":1,"n":"9","text":"FLOTATION TEST rotary switch – R IMMRS."},{"t":"step","lvl":2,"n":"a","text":"Confirm float ARMED (amber) light remains not illuminated."},{"t":"step","lvl":2,"n":"b","text":"Confirm the TEST (green) light remains illuminated."},{"t":"step","lvl":2,"n":"c","text":"Confirm the two L and two R (green) lights illuminated."},{"t":"step","lvl":1,"n":"10","text":"FLOTATION TEST rotary switch – L IMMRS."},{"t":"step","lvl":2,"n":"a","text":"Confirm float ARMED (amber) light remains not illuminated."},{"t":"step","lvl":2,"n":"b","text":"Confirm the TEST (green) light remains illuminated."},{"t":"step","lvl":2,"n":"c","text":"Confirm the two L and two R (green) lights illuminated."},{"t":"step","lvl":1,"n":"11","text":"FLOTATION TEST rotary switch – NORM."},{"t":"step","lvl":2,"n":"a","text":"Confirm all TEST (green) lights extinguished."},{"t":"step","lvl":1,"n":"12","text":"FLOTATION toggle switch – SAFE."},{"t":"step","lvl":2,"n":"a","text":"Confirm float ARMED (amber) light illuminated."},{"t":"step","lvl":1,"n":"13","text":"AUX FLOTATION toggle switch – SAFE."},{"t":"step","lvl":2,"n":"a","text":"Confirm float ARMED (amber) light extinguished."},{"t":"step","lvl":1,"n":"14","text":"Primary FLOTATION toggle switch – ARM."},{"t":"step","lvl":2,"n":"a","text":"Confirm float ARMED (amber) light illuminated."},{"t":"step","lvl":1,"n":"15","text":"Primary FLOTATION toggle switch – SAFE."},{"t":"step","lvl":2,"n":"a","text":"Confirm float ARMED (amber) light extinguished."},{"t":"h","id":"5.2.2","text":"IMPROVED FLOTATION CONTROL PANEL"},{"t":"note","text":"This procedure is applicable to the improved flotation control panel in accordance with the Rotorcraft Flight Manual Supplement No. 1, Revision 2, Part 1."},{"t":"caution","text":"To avoid possible injury in the event of inadvertent float deployment, clear the area around the nose, sponson (if installed) and tail floats prior to this test. All steps must be followed in sequence."},{"t":"step","lvl":1,"n":"1","text":"FLOTATION ARMING switch (center console) – SAFE."},{"t":"step","lvl":1,"n":"2","text":"FLOTATION TEST rotary switch (pilot overhead console) – OFF."},{"t":"step","lvl":1,"n":"3","text":"FLOTATION TEST switch (pilot overhead console) – TEST."},{"t":"note","text":"Three sets of L and R lights on the flotation test panel are designed to identify the forward, aft and sponson float bags. When the sponson float bags are not installed, the middle L and R lights will not illuminate during the following test."},{"t":"step","lvl":1,"n":"4","text":"FLOTATION TEST rotary switch – PRI."},{"t":"step","lvl":2,"n":"a","text":"Confirm both float ARMED (amber) and EICAS FLOAT ARMED advisory or caution extinguished."},{"t":"step","lvl":2,"n":"b","text":"Confirm float TEST (green) light illuminated."},{"t":"warning","text":"Continue test only if the green TEST light is illuminated."},{"t":"step","lvl":1,"n":"5","text":"Pilot collective EMER FLOATS – Push."},{"t":"step","lvl":2,"n":"a","text":"Confirm the three L and three R (green) lights illuminated."},{"t":"step","lvl":1,"n":"6","text":"Copilot collective EMER FLOATS – Push."},{"t":"step","lvl":2,"n":"a","text":"Confirm the three L and three R (green) lights illuminated."},{"t":"step","lvl":1,"n":"7","text":"FLOTATION TEST rotary switch – R IMMRS."},{"t":"step","lvl":2,"n":"a","text":"Confirm the three L and three R (green) lights illuminated."},{"t":"step","lvl":1,"n":"8","text":"FLOTATION TEST rotary switch – SEC."},{"t":"step","lvl":2,"n":"a","text":"Confirm float ARMED (amber) light remains extinguished."},{"t":"step","lvl":2,"n":"b","text":"Confirm EICAS FLOAT ARMED advisory or caution remains extinguished."},{"t":"step","lvl":2,"n":"c","text":"Confirm float TEST (green) light remains illuminated."},{"t":"step","lvl":1,"n":"9","text":"Pilot collective EMER FLOATS – Push."},{"t":"step","lvl":2,"n":"a","text":"Confirm the three L and three R (green) lights illuminated."},{"t":"step","lvl":1,"n":"10","text":"Copilot collective EMER FLOATS – Push."},{"t":"step","lvl":2,"n":"a","text":"Confirm the three L and three R (green) lights illuminated."},{"t":"step","lvl":1,"n":"11","text":"FLOTATION TEST rotary switch – L IMMRS."},{"t":"step","lvl":2,"n":"a","text":"Confirm the three L and three R (green) lights illuminated."},{"t":"step","lvl":1,"n":"12","text":"FLOTATION TEST rotary switch – OFF."},{"t":"step","lvl":1,"n":"13","text":"FLOTATION TEST switch – NORMAL."},{"t":"step","lvl":2,"n":"a","text":"Confirm both float ARMED (amber) lights extinguished."},{"t":"step","lvl":2,"n":"b","text":"Confirm EICAS FLOAT ARMED advisory or caution remains extinguished."},{"t":"step","lvl":1,"n":"14","text":"FLOTATION ARMING switch – ARM."},{"t":"step","lvl":2,"n":"a","text":"Confirm both float ARMED (amber) lights illuminated."},{"t":"step","lvl":2,"n":"b","text":"Confirm EICAS FLOAT ARMED caution illuminated."},{"t":"step","lvl":1,"n":"15","text":"Primary FLOTATION toggle switch – SAFE."},{"t":"step","lvl":2,"n":"a","text":"Confirm both float ARMED (amber) lights extinguished."},{"t":"step","lvl":2,"n":"b","text":"Confirm EICAS FLOAT ARMED advisory or caution extinguished."}]},{"id":"5.3","chapter":"5","title":"LIFE RAFT","page":96,"blocks":[{"t":"warning","text":"To avoid possible injury in the event of inadvertent deployment, clear the area around the left hand and right hand forward sponson life raft compartment prior to these tests."},{"t":"h","id":"5.3.1","text":"ORIGINAL LIFE RAFT CONTROL PANEL"},{"t":"note","text":"This procedure is applicable to the original life raft control panel in accordance with the Rotorcraft Flight Manual, Part 2."},{"t":"step","lvl":1,"n":"1","text":"LIFE RAFT TEST switch – PRI."},{"t":"step","lvl":2,"n":"a","text":"Confirm raft ARMED (amber) light not illuminated."},{"t":"step","lvl":2,"n":"b","text":"Confirm raft TEST (green) light not illuminated."},{"t":"step","lvl":1,"n":"2","text":"LIFE RAFT switch – ARM."},{"t":"step","lvl":2,"n":"a","text":"Confirm raft ARMED (amber) light illuminated."},{"t":"step","lvl":2,"n":"b","text":"Confirm raft TEST (green) light illuminated."},{"t":"warning","text":"Continue test only if the green TEST light is illuminated."},{"t":"step","lvl":1,"n":"3","text":"JETT switch – Actuate."},{"t":"step","lvl":2,"n":"a","text":"Confirm the L and R (green) lights illuminated."},{"t":"step","lvl":1,"n":"4","text":"JETT switch – Release."},{"t":"step","lvl":2,"n":"a","text":"Confirm the L and R (green) lights extinguish."},{"t":"step","lvl":1,"n":"5","text":"LIFE RAFT TEST switch – SEC."},{"t":"step","lvl":2,"n":"a","text":"Confirm raft ARMED (amber) light illuminated."},{"t":"step","lvl":2,"n":"b","text":"Confirm raft TEST (green) light illuminated."},{"t":"step","lvl":1,"n":"6","text":"JETT switch – Actuate."},{"t":"step","lvl":2,"n":"a","text":"Confirm the L and R (green) lights illuminated."},{"t":"step","lvl":1,"n":"7","text":"JETT switch – Release."},{"t":"step","lvl":2,"n":"a","text":"Confirm the L and R (green) lights extinguish."},{"t":"step","lvl":1,"n":"8","text":"LIFE RAFT TEST switch – NORM."},{"t":"step","lvl":2,"n":"a","text":"Confirm raft ARMED (amber) light illuminated."},{"t":"step","lvl":2,"n":"b","text":"Confirm raft TEST (green) light not illuminated."},{"t":"step","lvl":1,"n":"9","text":"LIFE RAFT switch – SAFE."},{"t":"step","lvl":2,"n":"a","text":"Confirm raft ARMED (amber) light not illuminated."},{"t":"step","lvl":2,"n":"b","text":"Confirm raft TEST (green) light not illuminated."},{"t":"h","id":"5.3.2","text":"IMPROVED LIFE RAFT CONTROL PANEL"},{"t":"note","text":"This procedure is applicable to the improved life raft control panel in accordance with the Rotorcraft Flight Manual, Supplement No. 1, Part 2."},{"t":"step","lvl":1,"n":"1","text":"LIFE RAFT toggle switch – TEST."},{"t":"step","lvl":1,"n":"2","text":"Rotary TEST switch – PRI."},{"t":"step","lvl":2,"n":"a","text":"Confirm raft TEST (green) light illuminated."},{"t":"step","lvl":2,"n":"b","text":"Confirm raft green ARM light and MFD RAFT ARM cautions are extinguished."},{"t":"warning","text":"Do not continue if either ARM light or RAFT ARM caution is illuminated or the TEST light is not illuminated."},{"t":"step","lvl":1,"n":"3","text":"JETT switch – Actuate."},{"t":"step","lvl":2,"n":"a","text":"Confirm the L and R (green) lights illuminated."},{"t":"step","lvl":1,"n":"4","text":"JETT switch – Release."},{"t":"step","lvl":2,"n":"a","text":"Confirm the L and R (green) lights extinguish."},{"t":"step","lvl":1,"n":"5","text":"Rotary TEST switch – SEC."},{"t":"step","lvl":2,"n":"a","text":"Confirm raft TEST (green) light illuminated."},{"t":"step","lvl":2,"n":"b","text":"Confirm raft green ARM light and MFD RAFT ARM cautions are extinguished."},{"t":"step","lvl":1,"n":"6","text":"JETT switch – Actuate."},{"t":"step","lvl":2,"n":"a","text":"Confirm the L and R (green) lights illuminated."},{"t":"step","lvl":1,"n":"7","text":"JETT switch – Release."},{"t":"step","lvl":2,"n":"a","text":"Confirm the L and R (green) lights extinguish."},{"t":"step","lvl":1,"n":"8","text":"Rotary TEST switch – OFF."},{"t":"step","lvl":1,"n":"9","text":"LIFE RAFT toggle switch – SAFE."},{"t":"step","lvl":2,"n":"a","text":"Confirm raft TEST light extinguished."},{"t":"step","lvl":2,"n":"b","text":"Confirm both ARM light and the MFD RAFT ARM cautions are extinguished."},{"t":"step","lvl":1,"n":"10","text":"LIFE RAFT toggle switch – ARM."},{"t":"step","lvl":2,"n":"a","text":"Confirm both ARM light and the MFD RAFT ARM cautions are illuminated."},{"t":"step","lvl":1,"n":"11","text":"LIFE RAFT toggle switch – SAFE."},{"t":"step","lvl":2,"n":"a","text":"Confirm both ARM light and the MFD RAFT ARM cautions are extinguished."}]},{"id":"5.4","chapter":"5","title":"RESCUE HOIST","page":98,"blocks":[{"t":"note","text":"These procedures are applicable to single or dual rescue hoist installation, and single or dual pendant installation."},{"t":"note","text":"If connected both pendants should be active at the same time and operate the active hoist."},{"t":"h","id":"5.4.1","text":"HOIST SYSTEM SHEAR TEST"},{"t":"step","lvl":1,"n":"1","text":"REQ HST switch – ALL."},{"t":"note","text":"The yellow CAUTION light on the pendent will illuminate whenever the selected hoist hook is within 15.5 feet from the hoist motor (near fully retracted) or when only 7 – 7.5 wraps of cable remain on the storage deum (near fully extended)."},{"t":"step","lvl":1,"n":"2","text":"HOIST ACTIVE – INBOARD."},{"t":"step","lvl":1,"n":"3","text":"SHEAR TEST switch – PRI."},{"t":"step","lvl":2,"n":"a","text":"Confirm SHEAR STATUS – TEST."},{"t":"caution","text":"To prevent cable shear, do not activate any SHEAR control unless the SHEAR TEST switch is in either the PRI or SEC position and the green SHEAR STATUS – TEST light is illuminated."},{"t":"note","text":"The SHEAR STATUS – ARMED light will remain illuminated during the shear test."},{"t":"step","lvl":1,"n":"4","text":"Rescue hoist panel HOIST SHEAR switch – Activate."},{"t":"step","lvl":2,"n":"a","text":"Confirm SHEAR TEST – PRI light illuminates."},{"t":"step","lvl":1,"n":"5","text":"Pilot cyclic HOIST SHEAR switch – Activate."},{"t":"step","lvl":2,"n":"a","text":"Confirm SHEAR TEST – PRI light illuminates."},{"t":"step","lvl":1,"n":"6","text":"Copilot cyclic HOIST SHEAR switch – Activate."},{"t":"step","lvl":2,"n":"a","text":"Confirm SHEAR TEST – PRI light illuminates."},{"t":"step","lvl":1,"n":"7","text":"SHEAR TEST switch – SEC."},{"t":"step","lvl":2,"n":"a","text":"Confirm SHEAR STATUS – TEST."},{"t":"step","lvl":1,"n":"8","text":"Rescue hoist panel HOIST SHEAR switch – Activate."},{"t":"step","lvl":2,"n":"a","text":"Confirm SHEAR TEST – SEC light illuminates."},{"t":"step","lvl":1,"n":"9","text":"Pilot cyclic HOIST SHEAR switch – Activate."},{"t":"step","lvl":2,"n":"a","text":"Confirm SHEAR TEST – SEC light illuminates."},{"t":"step","lvl":1,"n":"10","text":"Copilot cyclic HOIST SHEAR switch – Activate."},{"t":"step","lvl":2,"n":"a","text":"Confirm SHEAR TEST – SEC light illuminates."},{"t":"step","lvl":1,"n":"11","text":"SHEAR TEST switch – NORM."},{"t":"step","lvl":2,"n":"a","text":"Confirm SHEAR STATUS – ARMED."},{"t":"step","lvl":2,"n":"b","text":"Confirm SHEAR TEST light not illuminated."},{"t":"step","lvl":1,"n":"12","text":"For dual hoist installation: HOIST ACTIVE – OUTBOARD."},{"t":"step","lvl":1,"n":"13","text":"For dual hoist installation: Repeat steps 3. – 11. above."},{"t":"step","lvl":1,"n":"14","text":"RSQ HST – OFF."},{"t":"h","id":"5.4.2","text":"HOIST SYSTEM OPERATIONAL TEST"},{"t":"step","lvl":1,"n":"1","text":"HOIST ACTIVE – INBOARD."},{"t":"step","lvl":1,"n":"2","text":"Confirm that the hoist shear test has been successfully completed by either maintenance personnel or pilots."},{"t":"step","lvl":1,"n":"3","text":"Place the RSQ HST switch in the ALL position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the HOIST ARMED advisory light illuminates."},{"t":"step","lvl":2,"n":"b","text":"Verify that the ARMED light illuminates on the cabin rescue hoist panel."},{"t":"step","lvl":1,"n":"4","text":"Extend and retract the cable using the hoist operator’s control panel."},{"t":"step","lvl":1,"n":"5","text":"Extend the cable using the rescue hoist pendant."},{"t":"step","lvl":1,"n":"6","text":"While crewman is extending, push the RSQ HOIST switch on the pilot’s cyclic UP."},{"t":"step","lvl":2,"n":"a","text":"Verify that the cable retracts, overriding the crewmember’s DOWN command."},{"t":"step","lvl":1,"n":"7","text":"While crewman is extending, push the RSQ HOIST switch on the copilot’s cyclic UP."},{"t":"step","lvl":2,"n":"a","text":"Verify that the cable retracts, overriding the crewmember’s DOWN command."},{"t":"step","lvl":1,"n":"8","text":"Have a crewmember fully retract the cable."},{"t":"step","lvl":1,"n":"9","text":"For dual pendant installation, extend the cable using the other rescue hoist pendant."},{"t":"step","lvl":1,"n":"10","text":"For dual pendant installation, repeat steps 6. – 8."},{"t":"step","lvl":1,"n":"11","text":"Place the RSQ HST switch in the OFF position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the HOIST ARMED advisory light extinguishes."},{"t":"step","lvl":2,"n":"b","text":"Verify that the ARMED light extinguishes."},{"t":"step","lvl":1,"n":"12","text":"For dual hoist installation: HOIST ACTIVE – OUTBOARD."},{"t":"step","lvl":1,"n":"13","text":"For dual hoist installation: repeat steps 2. – 11. above."}]},{"id":"5.5","chapter":"5","title":"CARGO HOOK","page":101,"blocks":[{"t":"note","text":"There are three manual cargo hook releases. One release is on top of the hook (accessible from the cabin), the second is on the side of the hook (accessible from under the helicopter) and the third is the copilot’s manual CARGO RELEASE."},{"t":"step","lvl":1,"n":"1","text":"Place the CARGO HK switch in the ARM position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the HOOK ARMED advisory light illuminates."},{"t":"step","lvl":1,"n":"2","text":"Place approximately 20 lbs download pressure on the hook."},{"t":"step","lvl":1,"n":"3","text":"Press and release the CRG REL button on the pilot’s cyclic."},{"t":"step","lvl":2,"n":"a","text":"Verify that the HOOK OPEN advisory light momentarily illuminates."},{"t":"step","lvl":2,"n":"b","text":"Verify that the cargo hook opens."},{"t":"step","lvl":1,"n":"4","text":"Repeat for the copilot’s cyclic release."},{"t":"step","lvl":1,"n":"5","text":"Place the CARGO HK switch in the SAFE position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the HOOK ARMED advisory light extinguishes."},{"t":"step","lvl":1,"n":"6","text":"Place approximately 20 lbs download pressure on the hook."},{"t":"step","lvl":1,"n":"7","text":"Pull the cockpit CARGO HOOK RELEASE handle."},{"t":"step","lvl":2,"n":"a","text":"Verify that the HOOK OPEN advisory light momentarily illuminates."},{"t":"step","lvl":2,"n":"b","text":"Verify that the cargo hook opens."},{"t":"step","lvl":1,"n":"8","text":"Repeat using the manual cargo release lever located on the cargo hook assembly."}]},{"id":"5.6","chapter":"5","title":"RIPS","page":102,"blocks":[{"t":"note","text":"The Rotor Ice Protection System (RIPS) IBIT may be conducted with RIPS in OFF, AUTO or MANUAL mode."},{"t":"note","text":"The RIPS IBIT heats the blades for a short period of time. There is no OAT limit for the RIPS IBIT. However, a lockout function inhibits a subsequent IBIT if requested within approximately 90 seconds of the last IBIT. The system status will display TEST INHIBIT if this lockout function is activated."},{"t":"note","text":"A RIPS system RESET may be initiated before a subsequent IBIT if the RIPS IBIT fails. RESET removes all power from the system (like pulling CB) and initiates PBIT. The PBIT takes approximately 90 seconds. An IBIT cannot be conducted until the PBIT is completed."},{"t":"note","text":"Both engines must be in FLY to successfully complete an IBIT."},{"t":"note","text":"Engine inlets with ice detectors must be installed to conduct a RIPS IBIT."},{"t":"step","lvl":1,"n":"1","text":"Set 105% Nr at flat pitch with both engines in FLY."},{"t":"step","lvl":1,"n":"2","text":"Select both main generators ON."},{"t":"step","lvl":1,"n":"3","text":"Select the HLTH page."},{"t":"step","lvl":1,"n":"4","text":"Select RIPS."},{"t":"step","lvl":1,"n":"5","text":"Select IBIT."},{"t":"step","lvl":2,"n":"a","text":"Note a momentary display of the ice rate meter on the MFD."},{"t":"step","lvl":2,"n":"b","text":"Verify that the RIPS system status is TEST IN PROGRESS."},{"t":"step","lvl":2,"n":"c","text":"Verify that the TEST indication illuminates under ICE on MFD."},{"t":"step","lvl":1,"n":"6","text":"When the IBIT is complete (approximately 1 min 15 sec):"},{"t":"step","lvl":2,"n":"a","text":"Verify that the TEST indication under ICE on MFD changes to OFF, AUTO, or MANUAL depending on the mode selected when the test was initiated."},{"t":"step","lvl":2,"n":"b","text":"Verify that the RIPS status changes to TEST PASSED."},{"t":"step","lvl":2,"n":"c","text":"Verify that the RIPS system status changes to OPERATIONAL."}]},{"id":"5.7","chapter":"5","title":"WEATHER RADAR","page":103,"blocks":[{"t":"caution","text":"The weather radar has a weight on wheels override that forces the system into standby when the aircraft is on the ground. Unless STBY or OFF are selected, the weather radar will radiate as soon as the helicopter lifts to a hover. If an active radar mode is selected, ensure all people are at least 100 feet away from the forward 270° arc of the aircraft prior to takeoff."},{"t":"note","text":"These weather radar procedures are to be conducted when the helicopter is airborne. Range displayed on inner range ring is one-half range."},{"t":"note","text":"A time delay prevents the transmitter from operating until the magnetron has warmed up. The radar displays WAIT and does not transmit or scan the antenna for the approximate 90-second warm-up period. It then automatically becomes operational in the selected mode or goes to FSBY if the helicopter is on the ground."},{"t":"note","text":"In the TST mode, the transmitter output power radiates only if FSBY is defeated. Observe the display and verify that TEST is displayed in the WxR MODE field and the range and alphanumeric marks are displayed in white."},{"t":"step","lvl":1,"n":"1","text":"Select NAV on one MFD."},{"t":"step","lvl":1,"n":"2","text":"Select OVLY and WXR from soft bezel keys."},{"t":"step","lvl":1,"n":"3","text":"Set the weather radar mode switch to TST."},{"t":"step","lvl":2,"n":"a","text":"Verify test pattern appears and radar begins scanning. Also note alternate scanning of the pilot side vs. copilot side ARC displays (this verifies proper configuration strapping)."},{"t":"step","lvl":1,"n":"4","text":"Set the weather radar mode switch to WX."},{"t":"step","lvl":1,"n":"5","text":"Push the radar control panel GAIN knob in to select automatic gain."},{"t":"step","lvl":1,"n":"6","text":"Adjust TILT on the weather radar control panel and RANGE on the DCP."},{"t":"step","lvl":2,"n":"a","text":"Verify WX is displayed on the MFD."},{"t":"step","lvl":1,"n":"7","text":"Pull the weather radar control panel GAIN knob to select manual gain."},{"t":"step","lvl":1,"n":"8","text":"Rotate the radar control panel GAIN knob."},{"t":"step","lvl":2,"n":"a","text":"Verify that gain value adjusts on the display."},{"t":"step","lvl":1,"n":"9","text":"Push the weather radar control panel GAIN control knob in to re-select automatic gain."},{"t":"step","lvl":1,"n":"10","text":"Rotate the radar control panel TILT control knob from full clockwise to full counterclockwise."},{"t":"step","lvl":2,"n":"a","text":"Verify that the digital TILT annunciation on the display changes smoothly from 15 at the full clockwise position to –15 at the full counterclockwise position."},{"t":"step","lvl":2,"n":"b","text":"Verify the antenna transitions from approximately +15 to −15° by observing the display."},{"t":"step","lvl":1,"n":"11","text":"Select different ranges (2.5, 5, 12.5, 25, 50, 100, 150) using the RANGE knob on the DCP."},{"t":"step","lvl":2,"n":"a","text":"Verify that the ranges change on the MFD."},{"t":"step","lvl":1,"n":"12","text":"On the radar control panel, push the SECT button."},{"t":"step","lvl":2,"n":"a","text":"Verify the displayed scan is reduced to a 60° sector with a scan rate of approximately one sweep every 2.5 seconds."},{"t":"step","lvl":1,"n":"13","text":"Push the radar control panel SECT button again."},{"t":"step","lvl":2,"n":"a","text":"Verify that the scan is restored to the 120° scan rate of approximately one sweep every 5 seconds."},{"t":"step","lvl":1,"n":"14","text":"Push the radar control panel TGT button."},{"t":"step","lvl":2,"n":"a","text":"Verify that TGT (Target Alert Mode) appears on the MFD."},{"t":"step","lvl":1,"n":"15","text":"Push the radar control panel TGT button again."},{"t":"step","lvl":2,"n":"a","text":"Verify that the TGT disappears."}]},{"id":"5.8","chapter":"5","title":"LIGHTNING STRIKE SENSOR","page":104,"blocks":[{"t":"note","text":"This procedure is for the Honeywell LSZ-860 displayed on a Collins MFD."},{"t":"note","text":"The IBIT performs a full verification of the system by generating a known signal in the antenna and displaying the results on the weather radar display."},{"t":"note","text":"The IBIT can be conducted with either weather or terrain overlaid on the NAV display."},{"t":"step","lvl":1,"n":"1","text":"Select NAV and FULL on one MFD."},{"t":"step","lvl":1,"n":"2","text":"Set the weather radar mode switch to WX."},{"t":"step","lvl":1,"n":"3","text":"Select 50 NM or greater range."},{"t":"step","lvl":1,"n":"4","text":"Select OVLY and WX or TER."},{"t":"step","lvl":1,"n":"5","text":"Select LTNG."},{"t":"step","lvl":1,"n":"6","text":"Select HLTH on another MFD."},{"t":"step","lvl":1,"n":"7","text":"Select AVIONICS, SUB STAT and LSS."},{"t":"step","lvl":2,"n":"a","text":"Verify that the Lightning Strike Sensor (LSS) status is OPERATIONAL."},{"t":"step","lvl":1,"n":"8","text":"Select the IBIT bezel key."},{"t":"step","lvl":2,"n":"a","text":"Verify that the LSS status changes to TEST IN PROGRESS."},{"t":"step","lvl":2,"n":"b","text":"Verify that any active lightning rate symbols are erased from the WX display."},{"t":"step","lvl":2,"n":"c","text":"Verify that the LSS mode is in LTNG TEST."},{"t":"note","text":"A simulated lightning test pulse is sent to the antenna after 3 to 4 seconds. It then takes 5 to 7 seconds to build the rate 3 symbol on the display."},{"t":"step","lvl":2,"n":"d","text":"Verify that a rate 3 (white) lightning symbol is displayed at 25 ±5 NM and at 45° to the right of the nose."},{"t":"step","lvl":2,"n":"e","text":"Verify that a rate 1 (magenta) lightning alert symbol is displayed and remains on for 3 to 7 seconds at the maximum selected range and at 45° to the right of the nose."},{"t":"step","lvl":2,"n":"f","text":"Verify that the LSS status changes to TEST PASSED."},{"t":"step","lvl":2,"n":"g","text":"Verify that the LSS status returns to OPERATIONAL."}]},{"id":"5.9","chapter":"5","title":"DIGMAP","page":106,"blocks":[{"t":"note","text":"The DigMap consists of 2 independent systems; one on the pilot’s side and the other on the copilot’s side."},{"t":"note","text":"DigMap can be displayed on any of the MFDs."},{"t":"note","text":"DigMap is not FAA certified for navigation."},{"t":"note","text":"The display of the range rings confirms all the DigMap interfaces (FMS and AHRS) are inputted properly."},{"t":"note","text":"A Clear BIT Fail Flag must be initiated to erase any stored faults before a BIT check is run."},{"t":"step","lvl":1,"n":"1","text":"On the pilot’s inboard MFD, select VIDEO."},{"t":"step","lvl":1,"n":"2","text":"Select DigMap."},{"t":"step","lvl":2,"n":"a","text":"Verify that the display is clear and consistent with the range selected."},{"t":"step","lvl":1,"n":"3","text":"Using the RANGE control knob on the pilot’s DCP, verify that the range can be changed."},{"t":"step","lvl":1,"n":"4","text":"Using the pilot’s DigMap control panel, select MEN."},{"t":"step","lvl":1,"n":"5","text":"Using the arrow cursor, select Maintenance→ENT."},{"t":"step","lvl":1,"n":"6","text":"Select BIT→ENT."},{"t":"step","lvl":1,"n":"7","text":"Select Clear BIT Fail Flag→ENT→ENT (Yes)."},{"t":"step","lvl":1,"n":"8","text":"Select Run BIT→ENT. The BIT takes approximately 15 seconds to complete."},{"t":"step","lvl":1,"n":"9","text":"When the BIT is complete, select View BIT Log→ENT."},{"t":"step","lvl":1,"n":"10","text":"If no file is logged, the BIT has passed."},{"t":"step","lvl":1,"n":"11","text":"If a file is logged, note the fault."},{"t":"step","lvl":1,"n":"12","text":"Select ESC to exit menu."},{"t":"step","lvl":1,"n":"13","text":"Repeat for the copilot’s side."}]},{"id":"5.10","chapter":"5","title":"SAR AFCS","page":107,"blocks":[{"t":"h","id":"5.10.1","text":"SAR HOVER CHECKS"},{"t":"step","lvl":1,"n":"1","text":"Select YAW, CYCLIC, and COLL TRIM ON."},{"t":"step","lvl":1,"n":"2","text":"Select ATT, AP2, SAS2, and PRI ON."},{"t":"step","lvl":1,"n":"3","text":"Select SAS1 and PRI ON."},{"t":"step","lvl":1,"n":"4","text":"Select AP1 OFF."},{"t":"step","lvl":1,"n":"5","text":"Select FD2 on the AFCS control panel."},{"t":"step","lvl":1,"n":"6","text":"Select a target hover altitude by adjusting HVR RA on the pilot’s DCP to 50 feet."},{"t":"step","lvl":2,"n":"a","text":"Verify that the radar altitude bug appears on the radar altimeter display."},{"t":"step","lvl":1,"n":"7","text":"Establish stable hover with minimal drift."},{"t":"step","lvl":1,"n":"8","text":"Select HOV on the PFD."},{"t":"step","lvl":1,"n":"9","text":"Select SAR→VHLD→PHLD on an FD MODE SEL panel."},{"t":"step","lvl":2,"n":"a","text":"Verify that FD2, P HOV, R HOV, C RALT and S PHLD display on the PFD header."},{"t":"step","lvl":2,"n":"b","text":"Verify that drift velocities are displayed on the PFD below the hover display."},{"t":"step","lvl":2,"n":"c","text":"Verify that the aircraft maintains 50 feet."},{"t":"step","lvl":2,"n":"d","text":"Verify that the aircraft hovers over the selected position."},{"t":"step","lvl":1,"n":"10","text":"Without depressing any trim, displace cyclic to drag the aircraft at least 30 feet away from the target hover position."},{"t":"step","lvl":2,"n":"a","text":"Verify that the target star and range (RNG) display correctly on the PFD."},{"t":"step","lvl":1,"n":"11","text":"Release cyclic."},{"t":"step","lvl":2,"n":"a","text":"Verify that the aircraft smoothly returns to the target hover position."},{"t":"step","lvl":1,"n":"12","text":"Initiate a 5 knot forward drift using the pilot cyclic beeper trim."},{"t":"step","lvl":2,"n":"a","text":"Verify that VHLD replaces PHLD on the PFD header."},{"t":"step","lvl":2,"n":"b","text":"Verify that the velocity vector and the acceleration ball on the hover display respond correctly."},{"t":"step","lvl":1,"n":"13","text":"Push down on the pilot cyclic beeper."},{"t":"step","lvl":2,"n":"a","text":"Verify that PHLD re-engages."},{"t":"step","lvl":2,"n":"b","text":"Verify that the aircraft slows to less than 2 knots and then the AHRS determines a new target hover position."},{"t":"step","lvl":2,"n":"c","text":"Verify that the aircraft hovers at the new target position."},{"t":"step","lvl":1,"n":"14","text":"Repeat initiate 5 knot drift in aft, left and right directions."},{"t":"step","lvl":1,"n":"15","text":"From a coupled hover, depress collective trim and descend to below 30 feet."},{"t":"step","lvl":2,"n":"a","text":"Verify that the ″HOVER ALTITUDE″ aural alert is heard continuously by both pilots."},{"t":"step","lvl":1,"n":"16","text":"Return to hover altitude."},{"t":"step","lvl":1,"n":"17","text":"From a coupled hover at a selected altitude, without depressing the collective trim, descend 5 feet and slowly release collective."},{"t":"step","lvl":2,"n":"a","text":"Verify that the helicopter returns to selective altitude within ±4 feet with no more than a 4 foot overshoot."},{"t":"step","lvl":1,"n":"18","text":"Select another altitude by adjusting the collective beeper."},{"t":"step","lvl":2,"n":"a","text":"Verify that the aircraft climbs/descends to the new altitude."},{"t":"step","lvl":1,"n":"19","text":"Select ALT on the FD MODE SEL panel."},{"t":"step","lvl":2,"n":"a","text":"Verify that ALT (barometric altimeter) replaces RALT on the PFD header."},{"t":"step","lvl":2,"n":"b","text":"Verify that the aircraft maintains hover altitude."},{"t":"step","lvl":1,"n":"20","text":"Repeat the entire procedure using AP1, FD1 and the copilot cyclic/collective beepers."},{"t":"h","id":"5.10.2","text":"SAR DEPARTURE"},{"t":"step","lvl":1,"n":"1","text":"Select YAW, CYCLIC, and COLL TRIM ON."},{"t":"step","lvl":1,"n":"2","text":"Select ATT, AP2, SAS2, and PRI ON."},{"t":"step","lvl":1,"n":"3","text":"Select SAS1 and PRI ON."},{"t":"step","lvl":1,"n":"4","text":"Select AP1 OFF."},{"t":"step","lvl":1,"n":"5","text":"Select FD 2 on the AFCS control panel."},{"t":"step","lvl":1,"n":"6","text":"Establish a stable hover."},{"t":"step","lvl":1,"n":"7","text":"Push the DPT/GA button on the pilot’s cyclic."},{"t":"step","lvl":2,"n":"a","text":"Verify that FD2, P DPT, R (blank), C DPT and S DPT display on the PFD header."},{"t":"step","lvl":2,"n":"b","text":"Verify that the aircraft climbs at approximately 200 fpm and slowly accelerates (2.5 kts/sec)."},{"t":"step","lvl":2,"n":"c","text":"Verify that the aircraft transitions to GA at 65 KIAS."},{"t":"step","lvl":1,"n":"8","text":"Repeat with AP1, FD1, and copilot’s cyclic."},{"t":"h","id":"5.10.3","text":"SAR APPROACH TO POINT"},{"t":"note","text":"This check can be conducted over a long runway or over water. When using a runway, designate a target point at the end of the runway and initiate a straight-in ATPT over the approach end of the runway at a low enough altitude to arrive at the target point."},{"t":"step","lvl":1,"n":"1","text":"Select YAW, CYCLIC, and COLL TRIM ON."},{"t":"step","lvl":1,"n":"2","text":"Select ATT, AP2, SAS2, and PRI ON."},{"t":"step","lvl":1,"n":"3","text":"Select SAS1 and PRI ON."},{"t":"step","lvl":1,"n":"4","text":"Select AP1 OFF."},{"t":"step","lvl":1,"n":"5","text":"Select FD2 on the AFCS control panel."},{"t":"step","lvl":1,"n":"6","text":"Select NAV display."},{"t":"step","lvl":1,"n":"7","text":"Select bearing pointer information on the PFD (do not select the PFD analog radar altimeter)."},{"t":"step","lvl":1,"n":"8","text":"Designate an approach to hover point using either the FMS or the middle button on the slew controller."},{"t":"step","lvl":1,"n":"9","text":"Select the desired hover altitude by adjusting HVR RA on the pilot display control panel."},{"t":"step","lvl":2,"n":"a","text":"Verify that the desired hover height appears on the PFD."},{"t":"step","lvl":1,"n":"10","text":"Position the aircraft for the approach (straight-in over a runway or anywhere over the water)."},{"t":"note","text":"If the aircraft is to high or fast to intercept the approach, IAS and RALT will engage and the aircraft will continue straight ahead with no ATPT symbology."},{"t":"step","lvl":1,"n":"11","text":"Set airspeed above 60 KIAS and altitude between 200 and 2000 feet AGL."},{"t":"step","lvl":1,"n":"12","text":"Select SAR→ATPT on the FD MODE SEL panel."},{"t":"note","text":"IAS and RALT might initially engage until the aircraft decelerates and/or descends."},{"t":"step","lvl":2,"n":"a","text":"Verify that FD2, P APP, R APP, C APP (RALT underneath), and S ATPT appears on the PFD header."},{"t":"step","lvl":2,"n":"b","text":"Verify that navigation information appears on the PFD and NAV page."},{"t":"step","lvl":2,"n":"c","text":"Verify that the analog radar altimeter automatically appears on the PFD."},{"t":"step","lvl":2,"n":"d","text":"Verify that the HOV display on the PDF automatically appears below 50 knot ground speed."},{"t":"step","lvl":2,"n":"e","text":"Verify that the aircraft intercepts the approach line and ends up in a hover directly over the target position at the selected altitude."},{"t":"step","lvl":2,"n":"f","text":"Verify that the aircraft transitions to PHLD over the target position."},{"t":"step","lvl":1,"n":"13","text":"Repeat with AP1 and FD1."},{"t":"h","id":"5.10.4","text":"SAR MARK ON TOP"},{"t":"step","lvl":1,"n":"1","text":"Select YAW, CYCLIC and COLL TRIM ON."},{"t":"step","lvl":1,"n":"2","text":"Select ATT, AP2, SAS2 and PRI ON."},{"t":"step","lvl":1,"n":"3","text":"Select SAS1 and PRI ON."},{"t":"step","lvl":1,"n":"4","text":"Select AP1 OFF."},{"t":"step","lvl":1,"n":"5","text":"Select FD2 on the AFCS control panel."},{"t":"step","lvl":1,"n":"6","text":"Select the desired hover altitude by adjusting HVR RA on the pilot DCP."},{"t":"step","lvl":2,"n":"a","text":"Verify that the desired hover height displays on the PFD."},{"t":"step","lvl":1,"n":"7","text":"Set airspeed above 80 KIAS and altitude between 300’ and 2,000’ AGL."},{"t":"step","lvl":1,"n":"8","text":"Position the aircraft to fly over the target."},{"t":"step","lvl":1,"n":"9","text":"When over target, select SAR→MOT on the FD MODE SEL panel."},{"t":"step","lvl":2,"n":"a","text":"Verify that FD2, P APP, R APP, C APP (RALT underneath) and S MOT display on the PFD header."},{"t":"step","lvl":2,"n":"b","text":"Verify that APP1 mode is activated on the FD MODE SEL panel."},{"t":"step","lvl":2,"n":"c","text":"Verify that the previous FMS flight plan is removed from the NAV display and replaced with the MOT pattern, with the approach final approach path into the prevailing wind."},{"t":"step","lvl":2,"n":"d","text":"Confirm that the aircraft descends to 200’ AGL, slows to 80 KIAS and follows the MOT pattern."},{"t":"step","lvl":2,"n":"e","text":"Verify that IAS mode is activated on the FD MODE SEL panel when aircraft reaches 80 KIAS."},{"t":"step","lvl":2,"n":"f","text":"Verify that RALT engages on the FD MODE SEL panel at 200’ AGL."},{"t":"step","lvl":2,"n":"g","text":"Confirm that the aircraft intercepts the approach line."},{"t":"step","lvl":2,"n":"h","text":"Confirm that the aircraft begins to descend and slows after the final approach fix."},{"t":"step","lvl":2,"n":"i","text":"Verify that C APP (RALT underneath) label displays on the PFD header on the FD MODE SEL panel."},{"t":"step","lvl":2,"n":"j","text":"Verify that APP2 mode is activated on the FD MODE SEL panel."},{"t":"step","lvl":2,"n":"k","text":"Verify that the HOV display on the PFD automatically displays below 50 knot ground speed."},{"t":"step","lvl":2,"n":"l","text":"Confirm that the aircraft ends up in a hover approximately 50 yards to the left and 50 yards downwind of the target position at the selected RA altitude."},{"t":"step","lvl":2,"n":"m","text":"Verify that PHLD and VHLD are activated on the FD MODE SEL panel at the end of the approach."},{"t":"step","lvl":2,"n":"n","text":"Verify that P HOV, R HOV, C RALT and S PHLD display on the PFD header while in a coupled hover."},{"t":"step","lvl":1,"n":"10","text":"Repeat with AP1 and FD1."},{"t":"h","id":"5.10.5","text":"SAR CREW HOVER"},{"t":"step","lvl":1,"n":"1","text":"Select YAW, CYCLIC, and COLL TRIM ON."},{"t":"step","lvl":1,"n":"2","text":"Select ATT, AP2, SAS2, and PRI ON."},{"t":"step","lvl":1,"n":"3","text":"Select SAS1 and PRI ON."},{"t":"step","lvl":1,"n":"4","text":"Select AP1 OFF."},{"t":"step","lvl":1,"n":"5","text":"Select FD 2 on the AFCS control panel."},{"t":"step","lvl":1,"n":"6","text":"Establish stable hover above 30 feet with minimal drift."},{"t":"step","lvl":1,"n":"7","text":"Select HOV on the PFD."},{"t":"step","lvl":1,"n":"8","text":"Select SAR→VHLD→CHOV on a FD MODE SEL panel."},{"t":"step","lvl":2,"n":"a","text":"Verify that FD2, P HOV, R HOV, C RALT, and C CHOV appears on the PFD header."},{"t":"step","lvl":2,"n":"b","text":"Verify that the crew hover drift velocities are displayed on the PFD below the hover display."},{"t":"step","lvl":2,"n":"c","text":"Verify that the HOVER light on the cabin hoist control panel illuminates."},{"t":"step","lvl":1,"n":"9","text":"Have crewman initiate a 10 knot forward drift using the crew hover cyclic beeper."},{"t":"step","lvl":2,"n":"a","text":"Verify that the velocity vector and the acceleration ball on the hover display respond correctly."},{"t":"step","lvl":1,"n":"10","text":"Push down on the pilot cyclic beeper for greater than 1 second."},{"t":"step","lvl":2,"n":"a","text":"Verify that VHLD engages and then PHLD engages."},{"t":"step","lvl":2,"n":"b","text":"Verify that the aircraft hovers at the new position."},{"t":"step","lvl":1,"n":"11","text":"Repeat initiate 10 knot drift in aft, left and right directions."},{"t":"step","lvl":1,"n":"12","text":"Repeat the entire procedure using AP1, FD1, and the copilot cyclic beeper."}]},{"id":"5.11","chapter":"5","title":"RIG APPROACH","page":112,"blocks":[{"t":"note","text":"This check can be conducted over water using a waypoint to simulate an offshore rig."},{"t":"step","lvl":1,"n":"1","text":"Select YAW, CYCLIC, and COLL TRIM ON."},{"t":"step","lvl":1,"n":"2","text":"Select ATT, AP2, SAS 2, and PRI ON."},{"t":"step","lvl":1,"n":"3","text":"Select SAS 1 and PRI ON."},{"t":"step","lvl":1,"n":"4","text":"Select AP1 OFF."},{"t":"step","lvl":1,"n":"5","text":"Select FD 2 on the AFCS control panel."},{"t":"step","lvl":1,"n":"6","text":"Select a suitable FMS waypoint (simulated rig) to be used as a rig location."},{"t":"step","lvl":1,"n":"7","text":"Set simulated rig waypoint as the next and final active waypoint."},{"t":"step","lvl":1,"n":"8","text":"Set LNAV as the navigational mode using the pilot’s DCP."},{"t":"note","text":"RIG preview can only be selected on the DCP corresponding to the active flight director."},{"t":"step","lvl":1,"n":"9","text":"Select RIG preview on the pilot’s DCP."},{"t":"step","lvl":1,"n":"10","text":"Set inbound course with the Remote Instrument Controller (RIC)."},{"t":"step","lvl":1,"n":"11","text":"Set the offset direction and distance on the Mode Select Panel (MSP) (MSP→APP→RIG)."},{"t":"step","lvl":1,"n":"12","text":"Set the Minimum Descent Height (MDH) to 200 feet via HVR RA selection on the DCP."},{"t":"step","lvl":1,"n":"13","text":"Position aircraft above 2,500 feet AGL, 120 KIAS, and approximately 15 NM from the rig location and not on the final approach course."},{"t":"note","text":"If the rig approach is activated without sufficient time to accomplish a normal descent and deceleration prior to the Turn Point (TP), the TOO HIGH or TOO CLOSE alert will display on the MSP."},{"t":"step","lvl":1,"n":"14","text":"Select APP on the MSP to access the rig approach page."},{"t":"step","lvl":1,"n":"15","text":"Activate the approach by selecting RIG on the pilot’s MSP."},{"t":"step","lvl":2,"n":"a","text":"Verify LOC, GS, and DCL are ARMED on the DCP."},{"t":"step","lvl":2,"n":"b","text":"Verify that the aircraft initially maintains current airspeed and barometric altimeter."},{"t":"step","lvl":2,"n":"c","text":"Verify that the aircraft descends to arrive at the TP at 1,500 feet AWL with a maximum rate of descent of 750 fpm."},{"t":"step","lvl":2,"n":"d","text":"Verify that the aircraft decelerates to arrive at the TP at 80 KIAS."},{"t":"step","lvl":1,"n":"16","text":"At the TP:"},{"t":"step","lvl":2,"n":"a","text":"Verify that the aircraft is at 1,500 feet AWL."},{"t":"step","lvl":2,"n":"b","text":"Verify that the aircraft is at 80 KIAS."},{"t":"step","lvl":1,"n":"17","text":"At the IAF:"},{"t":"step","lvl":2,"n":"a","text":"Verify that the aircraft intercepts final approach course (localizer)."},{"t":"step","lvl":2,"n":"b","text":"Verify that the aircraft is at 1,500 feet AWL."},{"t":"step","lvl":2,"n":"c","text":"Verify that the aircraft is at 80 KGS."},{"t":"step","lvl":1,"n":"18","text":"At FAF:"},{"t":"step","lvl":2,"n":"a","text":"Verify that the aircraft descends on glideslope and localizer."},{"t":"step","lvl":2,"n":"b","text":"Verify that the aircraft decelerates to arrive at 30 KGS just prior to leveling at MDH."},{"t":"step","lvl":1,"n":"19","text":"At MAP:"},{"t":"step","lvl":2,"n":"a","text":"Verify that the aircraft maintains localizer course."},{"t":"step","lvl":2,"n":"b","text":"Verify that the aircraft maintains 30 KGS in VHLD."},{"t":"step","lvl":2,"n":"c","text":"Verify that the aircraft is at MDH in RALT."},{"t":"step","lvl":2,"n":"d","text":"Verify that the aircraft is at selected offset distance and direction."},{"t":"step","lvl":1,"n":"20","text":"Select GA."},{"t":"step","lvl":2,"n":"a","text":"Verify that the aircraft maintains localizer course."},{"t":"step","lvl":2,"n":"b","text":"Verify that the aircraft transitions to 80 KIAS."},{"t":"step","lvl":2,"n":"c","text":"Verify that the aircraft transitions to 750 fpm climb."},{"t":"step","lvl":1,"n":"21","text":"Repeat with AP1, FD 1, copilot’s DCP and copilot’s MSP."}]}],"figures":[{"n":1,"title":"Density Altitude Chart","src":"figures/fig1.png"},{"n":2,"title":"Autorotation RPM Correction Chart - 10%","src":"figures/fig2.png"},{"n":3,"title":"Autorotation RPM Correction Chart - 15%","src":"figures/fig3.png"},{"n":4,"title":"Autorotation RPM Correction Chart - 20%","src":"figures/fig4.png"}]}</script>

<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("fcp-data").textContent);
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "fcp-v1", SIGNKEY = "fcp-signer", FILTKEY = "fcp-filter", THEMEKEY = "fcp-theme";

  // ---------- data ----------
  var SEC = {}, ORDER = [], TITLE = {}, CHAP = {};
  D.sections.forEach(function (s) { SEC[s.id] = s; });
  D.index.forEach(function (c) {
    CHAP[c.id] = c;
    c.items.forEach(function (it) { ORDER.push(it.id); TITLE[it.id] = it.title; SEC[it.id].item = it; });
  });

  // ---------- state ----------
  function load() {
    try { var o = JSON.parse(localStorage.getItem(KEY)); if (o && typeof o === "object") return tidy(o); } catch (e) {}
    return tidy({});
  }
  function tidy(o) {
    o.sel = o.sel && typeof o.sel === "object" ? o.sel : {};
    o.done = o.done && typeof o.done === "object" ? o.done : {};
    o.rec = o.rec && typeof o.rec === "object" ? o.rec : {};
    return o;
  }
  var S = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var filterSel = lsGet(FILTKEY) === "sel";

  // ---------- helpers ----------
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function fmtTime(iso) { var d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function fmtDate(iso) { var d = new Date(iso); return pad(d.getDate()) + " " + MON[d.getMonth()] + " " + d.getFullYear(); }
  function isToday(iso) { return new Date(iso).toDateString() === new Date().toDateString(); }
  function stamp(iso) { return isToday(iso) ? fmtTime(iso) : fmtDate(iso).slice(0, 6) + " " + fmtTime(iso); }
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  function selCount() { return ORDER.filter(function (id) { return S.sel[id]; }).length; }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 1800);
  }

  // ---------- front page ----------
  $("docInfo").textContent = D.doc + " · " + D.rev;

  function statusHtml(id, home) {
    var d = S.done[id];
    if (!d && home && !S.sel[id]) return "";
    if (d) return '<button type="button" class="signed" data-sign="' + id + '">✓ ' + esc(d.by) + '<small>' + esc(stamp(d.at)) + '</small></button>';
    return '<button type="button" class="sign" data-sign="' + id + '">Sign</button>';
  }
  function recSummary() {
    var it = SEC["4.2"].item, r = S.rec["4.2"] || {}, parts = [];
    (it.fields || []).forEach(function (f) { if (r[f]) parts.push(f + " " + r[f]); });
    return parts.join(" · ");
  }
  function renderHome() {
    var any = selCount() > 0, html = "";
    D.index.forEach(function (c) {
      var items = c.items.filter(function (it) { return !filterSel || S.sel[it.id]; });
      if (filterSel && !items.length) return;
      var nSel = c.items.filter(function (it) { return S.sel[it.id]; }).length;
      var nDone = c.items.filter(function (it) { return S.sel[it.id] && S.done[it.id]; }).length;
      var all = nSel === c.items.length;
      html += '<section class="card chap"><div class="chap-h"><h3><span>' + c.id + '.0</span>' + esc(c.title) + '</h3>' +
        '<span class="cnt">' + (nSel ? nDone + "/" + nSel : "") + '</span>' +
        (filterSel ? "" : '<button type="button" data-chap="' + c.id + '">' + (all ? "Clear" : "Select all") + '</button>') + '</div>' +
        '<div class="rows' + (any && !filterSel ? " dim" : "") + '">';
      items.forEach(function (it) {
        var sub = it.id === "4.2" ? recSummary() : "";
        html += '<div class="row' + (S.sel[it.id] ? " sel" : "") + '" id="row-' + it.id + '">' +
          '<button type="button" class="chk" role="checkbox" aria-checked="' + !!S.sel[it.id] + '" aria-label="Select ' + it.id + '" data-sel="' + it.id + '"><i>' + CHECK + '</i></button>' +
