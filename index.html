          '<a class="go" href="#/' + it.id + '"><span class="n">' + it.id + '</span><span class="t">' + esc(it.title) + (sub ? '<small class="recsum">' + esc(sub) + '</small>' : "") + '</span><span class="chev">›</span></a>' +
          '<div class="st">' + statusHtml(it.id, true) + '</div></div>';
      });
      html += "</div></section>";
    });
    if (!html) html = '<div class="card empty">No tests selected. Switch to <b>All</b> and tick the tests to perform.</div>';
    $("chapters").innerHTML = html;
    renderSummary();
  }
  function renderSummary() {
    var nSel = selCount(), nDone = ORDER.filter(function (id) { return S.sel[id] && S.done[id]; }).length;
    $("nSel").textContent = nSel; $("nDone").textContent = nDone; $("nLeft").textContent = nSel - nDone;
    $("progBar").style.width = (nSel ? 100 * nDone / nSel : 0) + "%";
    $("barSum").textContent = nSel ? nDone + " of " + nSel + " performed" : D.doc;
    $("fAll").setAttribute("aria-pressed", !filterSel); $("fSel").setAttribute("aria-pressed", filterSel);
    $("fSel").textContent = "Selected" + (nSel ? " (" + nSel + ")" : "");
  }

  $("chapters").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.sel) {
      var id = b.dataset.sel;
      if (S.sel[id] && S.done[id]) { askUnsign(id, function () { delete S.sel[id]; }); return; }
      if (S.sel[id]) delete S.sel[id]; else S.sel[id] = true;
      save(); renderHome();
    } else if (b.dataset.chap) {
      var c = CHAP[b.dataset.chap], all = c.items.every(function (it) { return S.sel[it.id]; });
      c.items.forEach(function (it) { if (all) { if (!S.done[it.id]) delete S.sel[it.id]; } else S.sel[it.id] = true; });
      save(); renderHome();
    } else if (b.dataset.sign) {
      openSign(b.dataset.sign);
    }
  });
  function setFilter(v) { filterSel = v; lsSet(FILTKEY, v ? "sel" : "all"); renderHome(); window.scrollTo(0, 0); }
  $("fAll").addEventListener("click", function () { setFilter(false); });
  $("fSel").addEventListener("click", function () { setFilter(true); });

  // ---------- section page ----------
  var ANN = /^[A-Z0-9 #/().,–\-]+$/;
  function lineHtml(t) {
    return esc(t).replace(/→/g, '<span aria-label="then"> → </span>');
  }
  function blockHtml(b) {
    switch (b.t) {
      case "warning": case "caution": case "note":
        return '<div class="adm ' + b.t + '"><b>' + b.t.toUpperCase() + '</b><p>' + lineHtml(b.text) + '</p></div>';
      case "h":
        return '<h3><span>' + esc(b.id) + '</span>' + esc(b.text) + '</h3>';
      case "step":
        return '<div class="step l' + b.lvl + '" style="--l:' + b.lvl + '"><b>' + esc(b.lvl <= 2 ? b.n + "." : "(" + b.n + ")") + '</b><div>' + lineHtml(b.text) + '</div></div>';
      case "p":
        var l = b.lvl || 0, ann = ANN.test(b.text.replace(/\(.*?\)/g, "")) && b.text.length < 60;
        return '<p class="para' + (ann ? " ann" : "") + '" style="margin-left:' + (l * 2.2 + (l ? 0.3 : 0)) + 'em">' + lineHtml(b.text) + '</p>';
      case "table":
        // header row: empty corner cell above a filled first column (limit tables), or "Channel"
        var rest = b.rows.slice(1);
        var head = rest.length > 0 && (b.rows[0][0] === "" ? rest.every(function (r) { return r[0]; }) : b.rows[0][0] === "Channel");
        // annunciator lists (caution/advisory names) in mono
        var ann = !head && b.rows.every(function (r) { return r.every(function (c) { return !c || ANN.test(c); }); });
        return '<div class="tablewrap"><table><tbody>' + b.rows.map(function (r, i) {
          return '<tr' + (head && i === 0 ? ' class="th"' : "") + '>' + r.map(function (c) { return '<td' + (ann ? ' class="ann"' : "") + '>' + esc(c) + '</td>'; }).join("") + '</tr>';
        }).join("") + '</tbody></table></div>';
    }
    return "";
  }
  function navList() { return filterSel && selCount() ? ORDER.filter(function (id) { return S.sel[id]; }) : ORDER; }
  function neighbours(id) {
    var L = navList(), i = L.indexOf(id);
    if (i < 0) { L = ORDER; i = L.indexOf(id); }
    return { prev: L[i - 1], next: L[i + 1] };
  }
  var cur = null;
  function renderSection(id) {
    var s = SEC[id], c = CHAP[s.chapter], html = "";
    html += '<p class="ch">' + c.id + '.0 ' + esc(c.title) + '</p>';
    html += '<h1><span>' + s.id + '</span>' + esc(s.title) + '</h1>';
    s.blocks.forEach(function (b) { html += blockHtml(b); });
    if (id === "4.2") {
      html += '<h3><span>FIG</span>Figures</h3><div class="figs">' + D.figures.map(function (f) {
        return '<figure class="fig" id="fig' + f.n + '"><img src="' + f.src + '" alt="Figure ' + f.n + '. ' + esc(f.title) + '" loading="lazy"><figcaption>Figure ' + f.n + '. ' + esc(f.title) + '</figcaption></figure>';
      }).join("") + "</div>";
    }
    $("doc").innerHTML = html;
    $("barTitle").innerHTML = '<span class="num">' + s.id + '</span>' + esc(TITLE[id] || s.title);
    $("barCh").textContent = c.id + ".0 " + c.title;
    renderRec(id);
    renderSignParts(id);
    var nb = neighbours(id);
    [["prevBtn", "prev2", nb.prev, "Previous"], ["nextBtn", "next2", nb.next, "Next"]].forEach(function (x) {
      $(x[0]).disabled = !x[2]; $(x[0]).dataset.go = x[2] || "";
      var b2 = $(x[1]); b2.disabled = !x[2]; b2.dataset.go = x[2] || "";
      b2.innerHTML = x[2] ? '<small>' + x[3] + '</small><span><b>' + x[2] + '</b>' + esc(TITLE[x[2]]) + '</span>' : '<small>' + x[3] + '</small><span>–</span>';
    });
  }
  function renderRec(id) {
    var it = SEC[id].item, el = $("recCard");
    if (!it || !it.fields) { el.innerHTML = ""; return; }
    var r = S.rec[id] || {};
    el.innerHTML = '<div class="card rec"><h2>Record</h2><div class="recgrid">' + it.fields.map(function (f) {
      return '<label>' + esc(f) + '<input type="text" inputmode="decimal" data-rec="' + esc(f) + '" value="' + esc(r[f] || "") + '"></label>';
    }).join("") + '</div></div>';
  }
  $("recCard").addEventListener("input", function (e) {
    var f = e.target.dataset.rec; if (!f) return;
    var r = S.rec[cur] = S.rec[cur] || {};
    if (e.target.value.trim()) r[f] = e.target.value.trim(); else delete r[f];
    save();
  });
  function renderSignParts(id) {
    var d = S.done[id];
    $("barSign").innerHTML = statusHtml(id);
    var html = '<div class="card signcard' + (d ? " done" : "") + '">';
    html += '<div class="selrow"><button type="button" class="chk" role="checkbox" aria-checked="' + !!S.sel[id] + '" id="secSel" aria-labelledby="secSelL"><i>' + CHECK + '</i></button><label id="secSelL" for="secSel">Selected for this FCP</label></div>';
    if (d) html += '<div class="who"><b>✓ Performed</b><small>' + esc(d.by) + ' · ' + esc(fmtDate(d.at)) + ' ' + esc(fmtTime(d.at)) + '</small></div><button type="button" data-sign="' + id + '">Undo</button>';
    else html += '<button type="button" class="primary bigsign" data-sign="' + id + '">Sign off as performed</button>';
    $("signCard").innerHTML = html + "</div>";
  }
  function onSecClick(e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.id === "secSel") {
      if (S.sel[cur] && S.done[cur]) { askUnsign(cur, function () { delete S.sel[cur]; }); return; }
      if (S.sel[cur]) delete S.sel[cur]; else S.sel[cur] = true;
      save(); renderSignParts(cur);
    } else if (b.dataset.sign) openSign(b.dataset.sign);
  }
  $("signCard").addEventListener("click", onSecClick);
  $("barSign").addEventListener("click", onSecClick);
  ["prevBtn", "nextBtn", "prev2", "next2"].forEach(function (k) {
    $(k).addEventListener("click", function () { if (this.dataset.go) { navReplace = true; location.replace("#/" + this.dataset.go); } });
  });

  // ---------- sign-off modal ----------
  var modalCb = null;
  function openModal(title, body, btns, cb) {
    $("smTitle").innerHTML = title; $("smBody").innerHTML = body; $("smBtns").innerHTML = btns;
    modalCb = cb; $("signModal").hidden = false;
  }
  function closeModal() { $("signModal").hidden = true; modalCb = null; }
  function secTitle(id) { return '<span>' + id + '</span>' + esc(TITLE[id]); }
  function openSign(id) {
    var d = S.done[id];
    if (d) { askUnsign(id); return; }
    openModal(secTitle(id),
      '<label class="fld">Signature (initials)<input id="smWho" maxlength="12" autocapitalize="characters" spellcheck="false" value="' + esc(lsGet(SIGNKEY) || "") + '"></label>',
      '<button type="button" data-act="cancel">Cancel</button><button type="submit" class="primary">Sign off</button>',
      function () {
        var inp = $("smWho"), who = inp.value.trim().toUpperCase();
        if (!who) { inp.classList.add("bad"); inp.focus(); return false; }
        lsSet(SIGNKEY, who);
        S.sel[id] = true; S.done[id] = { by: who, at: new Date().toISOString() };
        save(); refresh(); toast(id + " signed off");
      });
    var inp = $("smWho"); setTimeout(function () { inp.focus(); inp.select(); }, 30);
  }
  function askUnsign(id, then) {
    var d = S.done[id];
    openModal(secTitle(id),
      '<p>Performed by <b>' + esc(d.by) + '</b>, ' + esc(fmtDate(d.at)) + ' ' + esc(fmtTime(d.at)) + '.</p><p>Remove the sign-off' + (then ? ' and deselect the test' : '') + '?</p>',
      '<button type="button" data-act="cancel">Keep</button><button type="submit" class="danger">Remove</button>',
      function () { delete S.done[id]; if (then) then(); save(); refresh(); });
  }
  $("signForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (modalCb && modalCb() === false) return;
    closeModal();
  });
  $("smBtns").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b && b.dataset.act === "cancel") closeModal(); });
  $("signModal").addEventListener("click", function (e) { if (e.target === this) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("signModal").hidden) closeModal(); });

  // ---------- routing ----------
  // fromHome: the history entry before this section is the front page, so Back can use history.back()
  var fromHome = false, booted = false, navReplace = false, lastSec = null, homeY = 0;
  function route() {
    var m = location.hash.match(/^#\/(\d\.\d+)$/), id = m && SEC[m[1]] ? m[1] : null;
    if (id) {
      if (!cur && booted) { homeY = window.scrollY; fromHome = true; }
      else if (!navReplace) fromHome = false;
      navReplace = false;
      cur = id; lastSec = id;
      $("home").hidden = true; $("barHome").hidden = true;
      $("sec").hidden = false; $("barSec").hidden = false;
      renderSection(id);
      window.scrollTo(0, 0);
      document.title = id + " " + TITLE[id] + " – S-92 FCP";
    } else {
      cur = null;
      $("sec").hidden = true; $("barSec").hidden = true;
      $("home").hidden = false; $("barHome").hidden = false;
      renderHome();
      document.title = "S-92 FCP";
      var row = lastSec && $("row-" + lastSec);
      if (row) {
        var r = row.getBoundingClientRect(), top = r.top + window.scrollY;
        if (top < homeY + 80 || top > homeY + window.innerHeight - 80) homeY = Math.max(0, top - window.innerHeight / 2);
        window.scrollTo(0, homeY);
        row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
      } else window.scrollTo(0, homeY);
    }
  }
  function goHome() {
    if (fromHome && history.length > 1) { fromHome = false; history.back(); }
    else location.hash = "#/";
  }
  $("backBtn").addEventListener("click", goHome);
  window.addEventListener("hashchange", route);
  function refresh() { if (cur) { renderSignParts(cur); } else renderHome(); renderSummary(); }

  // ---------- footer actions ----------
  $("resetBtn").addEventListener("click", function () {
    openModal("New FCP", "<p>Clear all selections, sign-offs and recorded values on this device?</p>",
      '<button type="button" data-act="cancel">Cancel</button><button type="submit" class="danger">Clear all</button>',
      function () { S = tidy({}); save(); lastSec = null; renderHome(); window.scrollTo(0, 0); });
  });
  function summaryText() {
    var L = ["S-92A FCP – " + fmtDate(new Date().toISOString()), ""];
    D.index.forEach(function (c) {
      var its = c.items.filter(function (it) { return S.sel[it.id]; });
      if (!its.length) return;
      L.push(c.id + ".0 " + c.title);
      its.forEach(function (it) {
        var d = S.done[it.id];
        L.push("  " + it.id + " " + it.title + " – " + (d ? "PERFORMED " + d.by + " " + fmtDate(d.at) + " " + fmtTime(d.at) : "NOT PERFORMED"));
        if (it.id === "4.2" && recSummary()) L.push("      " + recSummary());
      });
    });
    if (L.length === 2) L.push("No tests selected.");
    return L.join("\n");
  }
  $("shareBtn").addEventListener("click", function () {
    var t = summaryText();
    if (navigator.share) { navigator.share({ title: "S-92A FCP", text: t }).catch(function () {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { toast("Summary copied"); }, function () { toast("Copy failed"); });
  });

  // ---------- theme (som ground-run) ----------
  var themeBtn = $("themeBtn");
  function isDark() {
    var t = document.documentElement.getAttribute("data-theme");
    return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function themeLabel() { themeBtn.textContent = isDark() ? "Light mode" : "Dark mode"; }
  var th = lsGet(THEMEKEY); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th);
  themeLabel();
  themeBtn.addEventListener("click", function () {
    var t = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t); lsSet(THEMEKEY, t);
    var mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute("content", t === "dark" ? "#080d11" : "#e9eef1");
    themeLabel();
  });

  route();
  booted = true;
})();
</script>

<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
